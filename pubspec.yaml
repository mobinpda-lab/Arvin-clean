name: arvin
description: نرم‌افزار مدیریت کارها وپیگیری‌ها برای اندروید، ساخته‌شده با Flutter.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  shared_preferences_android: ^2.4.28
  # Flutter 3.47 generates AGP 9 with built-in Kotlin disabled. saf 2.1.1
  # skips the Kotlin plugin solely by AGP major, then calls its missing DSL.
  saf: 2.1.0
  android_alarm_manager_plus: ^5.1.1
  flutter_local_notifications: ^22.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^11.1.0
  adhan_dart: ^2.0.1
  cryptography: ^2.9.0
  drift: ^2.32.1
  drift_flutter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Thin.ttf
          weight: 100
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Black.ttf
          weight: 900
    # VazirHarf remains registered only for the separate PDF/report renderer.
    - family: VazirHarf
      fonts:
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Bold.ttf
          weight: 700
