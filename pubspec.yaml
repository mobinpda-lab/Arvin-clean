name: arvin
description: نرم‌افزار مدیریت کارها وپیگیری‌ها برای اندروید، ساخته‌شده با Flutter.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  shared_preferences_android: ^2.4.28
  # Flutter 3.47 generates AGP 9 with built-in Kotlin disabled. saf 2.1.1
  # skips the Kotlin plugin solely by AGP major, then calls its missing DSL.
  saf: 2.1.0
  android_alarm_manager_plus: ^5.1.1
  flutter_local_notifications: ^22.3.0
  flutter_svg: ^2.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^11.1.0
  adhan_dart: ^2.0.1
  cryptography: ^2.9.0
  drift: ^2.32.1
  drift_flutter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.7.1

# Keep sqlite3's upstream SHA-256 verification enabled while avoiding
# stale proxy/CDN responses for immutable release assets.
hooks:
  user_defines:
    sqlite3:
      # The mirror is transport-only; sqlite3 still checks the upstream release SHA-256.
      url_pattern: "https://ghfast.top/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/branding/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/ui/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
