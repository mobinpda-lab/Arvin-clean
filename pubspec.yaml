name: arvin
description: نرم‌افزار مدیریت کارها وپیگیری‌ها برای اندروید، ساخته‌شده با Flutter.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  shared_preferences_android: ^2.4.28
  # Flutter 3.47 generates AGP 9 with built-in Kotlin disabled. saf 2.1.1
  # skips the Kotlin plugin solely by AGP major, then calls its missing DSL.
  saf: 2.1.0
  android_alarm_manager_plus: ^5.1.1
  flutter_local_notifications: ^22.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^11.1.0
  adhan_dart: ^2.0.1
  cryptography: ^2.9.0
  drift: ^2.32.1
  drift_flutter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/fonts/vazirmatn-ui-fd/OFL.txt
    - assets/fonts/ui/estedad/LICENSE.txt
    - assets/fonts/ui/shabnam/LICENSE.txt
    - assets/fonts/ui/sahel/LICENSE.txt
    - assets/fonts/ui/samim/LICENSE.txt
    - assets/fonts/ui/tanha/LICENSE.txt
    - assets/fonts/ui/gandom/LICENSE.txt
    - assets/fonts/ui/parastoo/LICENSE.txt
    - assets/fonts/ui/mikhak/LICENSE.txt
    - assets/fonts/ui/lalezar/LICENSE.txt
    - assets/fonts/ui/vazircode/LICENSE.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn-ui-fd/fonts/ttf/Vazirmatn-UI-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn-ui-fd/fonts/ttf/Vazirmatn-UI-FD-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn-ui-fd/fonts/ttf/Vazirmatn-UI-FD-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn-ui-fd/fonts/ttf/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
    - family: Estedad
      fonts:
        - asset: assets/fonts/ui/estedad/Estedad-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/estedad/Estedad-Medium.ttf
          weight: 500
        - asset: assets/fonts/ui/estedad/Estedad-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ui/estedad/Estedad-Bold.ttf
          weight: 700
    - family: Shabnam
      fonts:
        - asset: assets/fonts/ui/shabnam/Shabnam-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/shabnam/Shabnam-Medium.ttf
          weight: 500
        - asset: assets/fonts/ui/shabnam/Shabnam-Bold.ttf
          weight: 700
    - family: Sahel
      fonts:
        - asset: assets/fonts/ui/sahel/Sahel-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/sahel/Sahel-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ui/sahel/Sahel-Bold.ttf
          weight: 700
    - family: Samim
      fonts:
        - asset: assets/fonts/ui/samim/Samim-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/samim/Samim-Medium.ttf
          weight: 500
        - asset: assets/fonts/ui/samim/Samim-Bold.ttf
          weight: 700
    - family: Tanha
      fonts:
        - asset: assets/fonts/ui/tanha/Tanha-Regular.ttf
          weight: 400
    - family: Gandom
      fonts:
        - asset: assets/fonts/ui/gandom/Gandom-Regular.ttf
          weight: 400
    - family: Parastoo
      fonts:
        - asset: assets/fonts/ui/parastoo/Parastoo-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/parastoo/Parastoo-Bold.ttf
          weight: 700
    - family: Mikhak
      fonts:
        - asset: assets/fonts/ui/mikhak/Mikhak-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/mikhak/Mikhak-Medium.ttf
          weight: 500
        - asset: assets/fonts/ui/mikhak/Mikhak-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ui/mikhak/Mikhak-Bold.ttf
          weight: 700
    - family: Lalezar
      fonts:
        - asset: assets/fonts/ui/lalezar/Lalezar-Regular.ttf
          weight: 400
    - family: Vazir Code
      fonts:
        - asset: assets/fonts/ui/vazircode/Vazir-Code-Regular.ttf
          weight: 400
    - family: VazirHarf
      fonts:
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Bold.ttf
          weight: 700
