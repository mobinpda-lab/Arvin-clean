name: arvin
description: نرم‌افزار مدیریت کارها و پیگیری‌ها برای اندروید، ساخته‌شده با Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  # Flutter 3.47 generates AGP 9 with built-in Kotlin disabled. saf 2.1.1
  # skips the Kotlin plugin solely by AGP major, then calls its missing DSL.
  saf: 2.1.0
  android_alarm_manager_plus: ^5.1.1
  flutter_local_notifications: ^22.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^11.1.0
  adhan_dart: ^2.0.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-UI-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn/Vazirmatn-UI-FD-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-UI-FD-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
