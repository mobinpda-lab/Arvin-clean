name: Arvin Execution Stream Event

description: Send autonomous execution events to the Arvin observability stream

inputs:
  event_type:
    description: Execution event type
    required: true
  status:
    description: Event status
    required: true
  message:
    description: Human readable message
    required: true
  component:
    description: Responsible component
    required: false
    default: github-actions
  task_id:
    description: Task identifier
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Append execution event
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .github/execution-stream
        python3 - <<'PY'
        import json, uuid, datetime, os
        event = {
          "event_id": str(uuid.uuid4()),
          "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          "project": "ARVIN",
          "agent": os.getenv("GITHUB_WORKFLOW", "unknown"),
          "component": "${{ inputs.component }}",
          "task_id": "${{ inputs.task_id }}",
          "event_type": "${{ inputs.event_type }}",
          "status": "${{ inputs.status }}",
          "message": "${{ inputs.message }}",
          "metadata": {
            "run_id": os.getenv("GITHUB_RUN_ID"),
            "sha": os.getenv("GITHUB_SHA")
          }
        }
        with open('.github/execution-stream/events.jsonl','a',encoding='utf-8') as f:
          f.write(json.dumps(event, ensure_ascii=False)+'\n')
        PY
