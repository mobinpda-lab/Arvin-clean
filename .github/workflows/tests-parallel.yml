name: Arvin Tests - Parallel

on:
  push:
    branches: ['feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-tests
            command: flutter test
          - name: calendar
            command: flutter test test/calendar_page_test.dart
          - name: follow-up
            command: flutter test test/follow_up_history_service_test.dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
