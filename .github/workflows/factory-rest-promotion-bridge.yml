name: Factory REST Promotion Bridge

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Arvin Parallel Wave', 'Arvin Build', 'Arvin Device Smoke']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: factory-rest-promotion-bridge
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            for (const pr of pulls) {
              if (!(pr.labels || []).some(l => l.name === 'arvin-auto')) continue;
              const head = pr.head.sha;
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: head, per_page: 100,
              });
              const fast = runs.filter(r => r.name === 'Arvin Parallel Wave' && r.status === 'completed')
                .sort((a,b) => b.id-a.id)[0];
              if (!fast || fast.conclusion !== 'success') continue;
              const base = fast.pull_requests?.find(p => p.number === pr.number)?.base?.sha;
              const main = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
              if (base !== main) continue;

              if (pr.draft) {
                await github.request('PATCH /repos/{owner}/{repo}/pulls/{pull_number}', {
                  owner, repo, pull_number: pr.number, draft: false,
                });
                core.notice(`#${pr.number}: promoted Draft -> Ready using REST after exact-head Fast gate.`);
              } else {
                const orchestratorRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: '345148430', per_page: 10,
                });
                const recent = orchestratorRuns.find(r => r.status === 'in_progress' || (Date.now() - new Date(r.updated_at).getTime()) < 4 * 60 * 1000);
                if (recent) continue;
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'production-orchestrator.yml', ref: 'main',
                });
                core.notice(`#${pr.number}: ready exact-head PR detected; waking Production Orchestrator.`);
              }
              return;
            }
            core.info('No eligible arvin-auto PR requires REST promotion/watchdog wake.');
