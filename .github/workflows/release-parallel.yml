name: Release Parallel Validation

on:
  push:
    branches: [feat/follow-up-history-v1.3]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Android V2 audit
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="$(find android/app/src/main -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print -quit)"
          test -n "$MAIN_ACTIVITY"
          grep -Eq 'FlutterActivity|io\.flutter\.embedding\.android' "$MAIN_ACTIVITY"
          if grep -RInE 'io\.flutter\.app\.FlutterActivity|PluginRegistry\.Registrar|GeneratedPluginRegistrant\.registerWith' android/app/src/main; then
            echo 'Android v1 embedding marker found'
            exit 1
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Full test suite
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
