name: COMMAND 49-R — V19 Retry, Rollback and Recovery

on:
  push:
    branches:
      - recovery-02/main-based-integration
    paths:
      - '.github/workflows/command-49-r-v19-safety.yml'
      - 'test/command49_v19_safety_test.dart'
      - 'docs/history/command-49-r/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-49-r-v19-safety
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  FIXTURE_SOURCE_SHA: 'f211326e7615f1c907494232dd3aec8d4732c83c'
  FIXTURE_ARCHIVE: 'test/fixtures/database/historical/main_v7_fixture.sqlite.gz'
  EXPECTED_FIXTURE_SHA256: '68752dcafcbe84abe399d71ac3411ec9832084fb888e84158d8a3b4a819913f0'
  V19_SOURCE_SHA: '310c0e20e3447c488c1e1c102c38bea5040708ca'
  V19_SCHEMA_BLOB: '9f0243dff6d8ffa13649ca7fd2ee33ac4d3a2c21'

jobs:
  v19-safety:
    name: Historical V19 retry, rollback, backup and TaskStore readback
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact historical V19 source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.V19_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify historical source and retrieve approved test harness
        shell: bash
        env:
          CANONICAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${V19_SOURCE_SHA}"
          actual_blob="$(git rev-parse HEAD:lib/services/g1_drift_schema.dart)"
          test "${actual_blob}" = "${V19_SCHEMA_BLOB}"
          git fetch --no-tags origin "${CANONICAL_SHA}"
          mkdir -p test
          git show "${CANONICAL_SHA}:test/command49_v19_safety_test.dart" > test/command49_v19_safety_test.dart
          test -s test/command49_v19_safety_test.dart
          {
            echo "CANONICAL_TEST_COMMIT=${CANONICAL_SHA}"
            echo "V19_SOURCE_SHA=${V19_SOURCE_SHA}"
            echo "V19_SCHEMA_BLOB=${actual_blob}"
            grep -m1 'static const int version' lib/services/g1_drift_schema.dart
          } | tee command49-source-identity.txt

      - name: Install SQLite and Flutter runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-dev gzip python3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve historical dependencies without lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Extract immutable V7 fixture and create extended isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${FIXTURE_SOURCE_SHA}"
          mkdir -p build/command-49-r
          git show "${FIXTURE_SOURCE_SHA}:${FIXTURE_ARCHIVE}" > build/command-49-r/main-v7-fixture.sqlite.gz
          gzip -dc build/command-49-r/main-v7-fixture.sqlite.gz > build/command-49-r/main-v7-source.sqlite
          source_sha="$(sha256sum build/command-49-r/main-v7-source.sqlite | awk '{print $1}')"
          test "${source_sha}" = "${EXPECTED_FIXTURE_SHA256}"
          cp build/command-49-r/main-v7-source.sqlite build/command-49-r/main-v7-extended.sqlite
          python3 - <<'PY'
          import json, sqlite3
          path = 'build/command-49-r/main-v7-extended.sqlite'
          db = sqlite3.connect(path)
          row = db.execute(
              "SELECT legacy_payload_json, recurrence_json FROM tasks WHERE id = ?",
              ('task-active-001',)
          ).fetchone()
          if row is None:
              raise SystemExit('Required historical Task task-active-001 is missing')
          raw, recurrence = row
          if not recurrence:
              raise SystemExit('Expected non-empty historical recurrence JSON is missing')
          envelope = json.loads(raw) if raw else {}
          scheduled = '2026-11-01T08:00:00.000Z'
          envelope['occurrenceHistory'] = {
              scheduled: {
                  'scheduledDate': scheduled,
                  'status': 'completed',
                  'completionDate': '2026-11-01T09:00:00.000Z',
                  'result': 'done'
              }
          }
          db.execute(
              'UPDATE tasks SET legacy_payload_json = ? WHERE id = ?',
              (json.dumps(envelope, ensure_ascii=False, separators=(',', ':')), 'task-active-001')
          )
          db.commit()
          db.close()
          PY
          {
            echo "FIXTURE_SOURCE_SHA=${FIXTURE_SOURCE_SHA}"
            echo "SOURCE_FIXTURE_SHA256=${source_sha}"
            echo "EXTENDED_FIXTURE_SHA256=$(sha256sum build/command-49-r/main-v7-extended.sqlite | awk '{print $1}')"
            echo "EXTENDED_FIXTURE_SIZE=$(stat -c '%s' build/command-49-r/main-v7-extended.sqlite)"
          } | tee build/command-49-r/fixture-verification.txt

      - name: Execute COMMAND 49-R physical database tests
        shell: bash
        env:
          ARVIN_COMMAND49_DIR: ${{ github.workspace }}/build/command-49-r
          ARVIN_V7_AUGMENTED_FIXTURE: ${{ github.workspace }}/build/command-49-r/main-v7-extended.sqlite
        run: |
          set -euo pipefail
          flutter test --reporter expanded test/command49_v19_safety_test.dart 2>&1 | tee build/command-49-r/flutter-test.log
          sha256sum build/command-49-r/*.sqlite build/command-49-r/*.json > build/command-49-r/evidence-sha256.txt
          cat build/command-49-r/command49-verdict.txt

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-49-r-v19-safety-${{ github.run_id }}
          path: |
            build/command-49-r/
            command49-source-identity.txt
          if-no-files-found: warn
          retention-days: 90
