name: Joplin Persian Shamsi Plugin
# Dedicated build gate for the isolated Joplin plugin.
# Trigger: build artifact proof.

on:
  push:
    paths:
      - 'research/joplin-persian-shamsi-isolated/plugin/**'
      - '.github/workflows/joplin-persian-shamsi-build.yml'
  pull_request:
    paths:
      - 'research/joplin-persian-shamsi-isolated/plugin/**'
      - '.github/workflows/joplin-persian-shamsi-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/joplin-persian-shamsi-isolated/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - name: Verify JPL archive
        run: |
          archive="$(find publish -maxdepth 1 -name '*.jpl' -print -quit)"
          test -n "$archive"
          tar -tf "$archive" | grep -Fx 'manifest.json'
          tar -tf "$archive" | grep -Fx 'index.js'
          tar -tf "$archive" | grep -Fx 'markdownItPlugin.js'
          tar -tf "$archive" | grep -Fx 'style.css'
          tar -tf "$archive" | grep -Fx 'fonts/Vazirharf[wght].ttf'
          tar -xOf "$archive" manifest.json | grep -F 'org.mobinpda.joplin.persianshamsi'
      - name: Upload JPL artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-persian-shamsi-jpl
          path: research/joplin-persian-shamsi-isolated/plugin/publish/*.jpl
          if-no-files-found: error
