name: temporary-remove-unused-home-code
on:
  push:
    branches: [feat/home-visual-integration-2026-09-07]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unreachable Home helpers
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          next_markers = {
              '_quickCapture': '\n  Future<void> _edit(',
              '_openFilter': '\n  void _selectHomeStat(',
              '_openBackup': '\n  Future<void> _openPrimaryCalendar(',
              '_openCalendar': '\n  Future<void> _openSettings(',
              '_openSettings': '\n  Future<void> _openAbout(',
              '_openAbout': '\n  TaskSwipeAction _actionForSwipe(',
          }
          for name, end_marker in next_markers.items():
              start_marker = '\n  Future<void> ' + name + '('
              if name == '_openFilter':
                  start_marker = '\n  void ' + name + '('
              start = s.find(start_marker)
              if start < 0:
                  raise SystemExit(f'missing method {name}')
              end = s.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'missing boundary for {name}')
              s = s[:start] + s[end:]
          start = s.find('class _Stat extends StatelessWidget {')
          if start < 0:
              raise SystemExit('missing _Stat')
          end_marker = '\n/// Backward-compatible public entry retained for existing callers/tests.'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('missing TaskDialog boundary')
          s = s[:start] + s[end:]
          p.write_text(s)
      - name: Commit cleanup
        run: |
          git config user.name 'arvin-factory-bot'
          git config user.email 'arvin-factory-bot@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix(home): remove unreachable legacy helpers'
          git push
