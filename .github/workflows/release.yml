name: Arvin Release (legacy shortcut disabled)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA requested for release; use Arvin Release Closure for gated signing'
        required: true
        type: string
      version:
        description: 'Requested release version (informational only; this workflow does not publish)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  refuse-ungated-release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unverified release shortcut
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "::error::This legacy workflow is disabled because it could create a release without a verified production-signed APK."
          echo "Use the existing Arvin Release Closure workflow from refs/heads/main with target_sha matching the current main tip, configured owner-approved signing secrets, apksigner v2/v3 evidence, and product release gates."
          echo "REQUESTED_TARGET_SHA=$TARGET_SHA"
          echo "REQUESTED_VERSION=$VERSION"
          exit 1
