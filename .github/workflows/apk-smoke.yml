name: Arvin APK - Smoke Build

on:
  push:
    branches: ['feat/**', 'fix/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Arvin-v1.2.0-build${GITHUB_RUN_NUMBER}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-v1.2.0-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/Arvin-v1.2.0-build${{ github.run_number }}.apk
