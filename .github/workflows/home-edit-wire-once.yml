name: Home Edit Apply One-Shot

on:
  push:
    branches:
      - feat/home-canonical-edit-apply

permissions:
  contents: write

jobs:
  patch-home:
    if: ${{ !contains(github.event.head_commit.message, '[home-edit-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-canonical-edit-apply
          fetch-depth: 0

      - name: Wire canonical TaskEditApplyService into Home
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          old_imports = "import 'services/task_migration_writer.dart';\nimport 'services/task_store.dart';"
          new_imports = "import 'services/task_migration_writer.dart';\nimport 'services/task_edit_apply_service.dart';\nimport 'services/task_store.dart';"
          if text.count(old_imports) != 1:
              raise SystemExit('expected import anchor exactly once')
          text = text.replace(old_imports, new_imports, 1)

          old_field = "  final TaskMigrationWriter migrationWriter = TaskMigrationWriter();\n  final TaskStore taskStore = TaskStore();"
          new_field = "  final TaskMigrationWriter migrationWriter = TaskMigrationWriter();\n  final TaskEditApplyService taskEditApplyService = TaskEditApplyService();\n  final TaskStore taskStore = TaskStore();"
          if text.count(old_field) != 1:
              raise SystemExit('expected service field anchor exactly once')
          text = text.replace(old_field, new_field, 1)

          old_edit = """    if (edited == null) return;\n    setState(() {\n      old.title = edited.title;\n      old.description = edited.description;\n      old.followUpEnabled = edited.followUpEnabled;\n      old.followUpDate = edited.followUpDate;\n      old.tags = List<String>.of(edited.tags);\n      old.updatedAt = DateTime.now();\n    });\n    await _save();"""
          new_edit = """    if (edited == null) return;\n    setState(() => taskEditApplyService.apply(old, edited));\n    await _save();"""
          if text.count(old_edit) != 1:
              raise SystemExit('expected Home edit block exactly once')
          text = text.replace(old_edit, new_edit, 1)

          path.write_text(text, encoding='utf-8')
          workflow = Path('.github/workflows/home-edit-wire-once.yml')
          workflow.unlink()
          PY

      - name: Commit deterministic Home wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart .github/workflows/home-edit-wire-once.yml
          git diff --cached --check
          git commit -m "feat(home): wire canonical editor apply [home-edit-wired]"
          git push origin HEAD:feat/home-canonical-edit-apply
