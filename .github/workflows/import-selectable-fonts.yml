name: Vendor selectable Persian fonts

on:
  push:
    branches:
      - feat/font-picker-settings
    paths:
      - .github/workflows/import-selectable-fonts.yml

permissions:
  contents: write

jobs:
  vendor-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/font-picker-settings

      - name: Vendor pinned font assets and licenses
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/fonts/selectable assets/fonts/licenses
          mkdir -p assets/fonts/selectable assets/fonts/licenses
          tmp="$(mktemp -d)"
          manifest="assets/fonts/FONT_SOURCES.md"
          cat > "$manifest" <<'EOF'
          # Selectable Persian font sources

          Vazirmatn remains the default application font. The selectable fonts below are vendored from pinned upstream commits. Each upstream license is copied under `assets/fonts/licenses/`.

          | Font | Upstream | Pinned commit |
          | --- | --- | --- |
          EOF

          vendor_font() {
            id="$1"; display="$2"; repo="$3"; sha="$4"
            src="$tmp/$id"
            git clone --quiet "https://github.com/rastikerdar/$repo.git" "$src"
            git -C "$src" checkout --quiet "$sha"

            search="$src/dist/Farsi-Digits"
            if [ ! -d "$search" ] || ! find "$search" -maxdepth 1 -type f -iname '*.ttf' -print -quit | grep -q .; then
              search="$src/dist"
            fi

            regular="$(find "$search" -maxdepth 1 -type f -iname '*.ttf' | grep -Evi '(bold|black|light|medium|semibold|semi-bold|thin|extra|demi)' | sort | head -n 1 || true)"
            bold="$(find "$search" -maxdepth 1 -type f -iname '*bold*.ttf' | grep -Evi '(semi|demi|extra)' | sort | head -n 1 || true)"

            if [ -z "$regular" ]; then
              echo "No regular TTF found for $display in $repo at $sha" >&2
              exit 1
            fi

            cp "$regular" "assets/fonts/selectable/${id}-regular.ttf"
            if [ -n "$bold" ]; then
              cp "$bold" "assets/fonts/selectable/${id}-bold.ttf"
            fi

            license="$(find "$src" -maxdepth 1 -type f \( -iname 'LICENSE' -o -iname 'LICENSE.*' -o -iname 'OFL.txt' \) | sort | head -n 1 || true)"
            if [ -z "$license" ]; then
              echo "No license file found for $display in $repo at $sha" >&2
              exit 1
            fi
            cp "$license" "assets/fonts/licenses/${id}-LICENSE.txt"
            printf '| %s | `rastikerdar/%s` | `%s` |\n' "$display" "$repo" "$sha" >> "$manifest"
          }

          vendor_font sahel "ساحل" sahel-font 81ea305068b028ce311807c574fef50f3d4e2c54
          vendor_font parastoo "پرستو" parastoo-font ab17e3b12fe84456c93e2d66e3e28231ae40c2de
          vendor_font samim "صمیم" samim-font ee3ab5791d96818e0311d82e43a4887a059507e4
          vendor_font tanha "تنها" tanha-font bd6f121ec33899e5b180c9fbdfff8e0b7bff8b55
          vendor_font gandom "گندم" gandom-font 71fefea52f5b90616d227ff5c084b34c0e8c5c65
          vendor_font shabnam "شبنم" shabnam-font 5283d80e0118d9d4439b1208e9b912588e563d06
          vendor_font nahid "ناهید" nahid-font ddbf092d368bec040d1cd3b1e85a1b68cb8b6291
          vendor_font vazir_code "وزیر کد" vazir-code-font abc484a90c685430c09332c4a6a65b0b1314de1f

          test "$(find assets/fonts/selectable -type f -name '*-regular.ttf' | wc -l)" -eq 8
          ls -lh assets/fonts/selectable

      - name: Commit verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/selectable assets/fonts/licenses assets/fonts/FONT_SOURCES.md
          git rm .github/workflows/import-selectable-fonts.yml
          git commit -m 'feat(ui): vendor selectable Persian font families'
          git push origin HEAD:feat/font-picker-settings
