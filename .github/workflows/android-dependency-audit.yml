name: Arvin Android Dependency Audit

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name arvin .
      - name: Get dependencies
        run: flutter pub get
      - name: Audit Android embedding references
        shell: bash
        run: |
          set -e
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          echo "Checking Flutter package cache: $CACHE"
          if grep -R -n -E 'PluginRegistry\.Registrar|io\.flutter\.app\.|registerWith\(' "$CACHE" --include='*.java' --include='*.kt' --include='*.gradle' 2>/dev/null | head -200; then
            echo 'Legacy Android embedding references were found above.'
          else
            echo 'No legacy Android v1 embedding references found in cached plugin source.'
          fi
      - name: Show resolved Android plugins
        run: flutter pub deps --style=compact
