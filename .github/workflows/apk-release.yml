name: Arvin APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name arvin .
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle file not found')
          text = path.read_text()
          is_kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if is_kts else 'coreLibraryDesugaringEnabled true'
          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'")
          if flag not in text:
              match = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n        ' + flag + text[match.end():]
          if 'desugar_jdk_libs:2.1.5' not in text:
              match = re.search(r'(?m)^\s*dependencies\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n    ' + dependency + text[match.end():]
          path.write_text(text)
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(awk -F': ' '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          VERSION=${VERSION:-1.1.0}
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Arvin-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arvin-v${{ github.run_number }}-release-apk
          path: dist/*.apk
