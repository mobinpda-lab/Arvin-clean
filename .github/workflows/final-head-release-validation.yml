name: Arvin Final Head Release Validation

on:
  workflow_run:
    workflows: ['Arvin Release Closure']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvin-final-head-release-validation
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout final main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assert exact current main
        id: head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          test "$SHA" = "$REMOTE_SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "FINAL_HEAD=$SHA"

      - name: Reuse exact-head release assets
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.head.outputs.sha }}"
          mkdir -p release-evidence
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --name "arvin-internal-build-${FINAL_SHA}" \
            --dir release-evidence

      - name: Verify release evidence matches exact final main
        if: github.event_name == 'workflow_run'
        env:
          FINAL_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          test -s release-evidence/release-evidence.txt
          test -n "$(find release-evidence -maxdepth 1 -type f -name 'arvin-*.apk' -print -quit)"
          test -s release-evidence/artifact.sha256
          grep -q "MAIN_SHA=${FINAL_SHA}" release-evidence/release-evidence.txt
          grep -q "BUILD_RESULT=success" release-evidence/release-evidence.txt
          grep -q "TEST_RESULT=success" release-evidence/release-evidence.txt
          (
            cd release-evidence
            awk '{
              name=$2
              sub(/^.*\//, "", name)
              print $1 "  " name
            }' artifact.sha256 | sha256sum -c -
          )

      - name: Record internal-only validation for blocked release
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        env:
          FINAL_SHA: ${{ steps.head.outputs.sha }}
        run: |
          printf '{"final_head":"%s","internal_build_validated":true,"release_validation":"blocked"}\n' "$FINAL_SHA" > release.json

      - name: Setup exact Flutter for manual validation
        if: github.event_name == 'workflow_dispatch'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify repository-owned release inputs for manual validation
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/settings.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application.*9.1.0' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.0' android/settings.gradle.kts
          grep -q 'VERSION_17' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts

      - name: Fetch official Vazirmatn assets for manual validation
        if: github.event_name == 'workflow_dispatch'
        run: bash tool/fetch_vazirmatn.sh      - name: Analyze from locked dependency graph for manual validation
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter analyze

      - name: Unit and widget tests for manual validation
        if: github.event_name == 'workflow_dispatch'
        run: flutter test

      - name: Build release APK for manual validation
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --release -t lib/main.dart

      - name: Record internal build artifact for manual validation
        if: github.event_name == 'workflow_dispatch'
        env:
          FINAL_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          APK="arvin-internal-${FINAL_SHA:0:7}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-evidence/$APK"
          (cd release-evidence && sha256sum "$APK" > artifact.sha256)
          cat > release-evidence/release-evidence.txt <<EOF
          MAIN_SHA=${FINAL_SHA}
          BUILD_RESULT=success
          TEST_RESULT=success
          RELEASE_ARTIFACT=${APK}
          EOF
          printf '{"final_head":"%s","internal_build":true,"apk":"%s"}\n' "$FINAL_SHA" "$APK" > release.json

      - name: Verify release record and artifact
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          FINAL_SHA: ${{ steps.head.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0-arvin-${FINAL_SHA:0:7}"
          gh release view "$TAG" --json tagName,targetCommitish,isPrerelease,assets > release.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('release.json', encoding='utf-8'))
          sha = os.environ['FINAL_SHA']
          tag = f"v0.1.0-arvin-{sha[:7]}"
          if data.get('tagName') != tag:
              raise SystemExit('Release tag mismatch')
          assets = {a['name'] for a in data.get('assets', [])}
          required_evidence = {'artifact.sha256', 'release-evidence.txt'}
          if not required_evidence.issubset(assets):
              raise SystemExit(f'Missing release evidence assets: {sorted(required_evidence - assets)}')
          apks = sorted(name for name in assets if name.startswith('arvin-') and name.endswith('.apk'))
          if not apks:
              raise SystemExit('Missing versioned Arvin APK asset')
          print(f"FINAL_HEAD_RELEASE_VALIDATION=success SHA={sha} TAG={tag} APK={apks[0]}")
          PY

      - name: Publish validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: arvin-final-head-release-validation-${{ steps.head.outputs.sha }}
          path: |
            release.json
            release-evidence/*.apk
            release-evidence/artifact.sha256
            release-evidence/release-evidence.txt
          if-no-files-found: error

      - name: Keep release gate fail-closed when closure did not succeed
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        run: |
          echo 'INTERNAL_BUILD_ARTIFACT_VALIDATED; RELEASE_VALIDATION_BLOCKED_BY_UPSTREAM_CLOSURE'
          exit 1
