name: Arvin Final Head Release Validation

on:
  workflow_run:
    workflows: ['Arvin Release Closure']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvin-final-head-release-validation
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout final main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assert exact current main
        id: head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          test "$SHA" = "$REMOTE_SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "FINAL_HEAD=$SHA"

      - name: Fetch pinned VazirHarf
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Bold.ttf"

      - name: Setup exact Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify repository-owned release inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/settings.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application.*9.1.0' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.0' android/settings.gradle.kts
          grep -q 'VERSION_17' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts

      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && rm -rf assets/fonts/vazirharf && cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf

      - name: Analyze from locked dependency graph
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release -t lib/main.dart

      - name: Verify release record and artifact
        env:
          FINAL_SHA: ${{ steps.head.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0-arvin-${FINAL_SHA:0:7}"
          gh release view "$TAG" --json tagName,targetCommitish,isPrerelease,assets > release.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('release.json', encoding='utf-8'))
          sha = os.environ['FINAL_SHA']
          tag = f"v0.1.0-arvin-{sha[:7]}"
          if data.get('tagName') != tag:
              raise SystemExit('Release tag mismatch')
          assets = {a['name'] for a in data.get('assets', [])}
          required = {'arvin-release.apk', 'artifact.sha256', 'release-evidence.txt'}
          missing = required - assets
          if missing:
              raise SystemExit(f'Missing release assets: {sorted(missing)}')
          print(f'FINAL_HEAD_RELEASE_VALIDATION=success SHA={sha} TAG={tag}')
          PY

      - name: Publish validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: arvin-final-head-release-validation-${{ steps.head.outputs.sha }}
          path: release.json
          if-no-files-found: error
