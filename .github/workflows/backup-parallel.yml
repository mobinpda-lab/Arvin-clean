name: Backup Parallel Validation

on:
  push:
    branches: [feat/follow-up-history-v1.3]
  pull_request:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Backup focused tests
        run: flutter test test/backup_service_test.dart test/task_store_test.dart
