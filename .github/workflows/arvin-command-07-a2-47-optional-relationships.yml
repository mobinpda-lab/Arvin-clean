name: Arvin COMMAND 07-A.2.80-D SQLite v20 Lifecycle and M2M Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/services/g1_drift_schema.dart'
      - 'lib/services/g1_many_to_many_hierarchy_migration.dart'
      - 'test/services/g1_drift_schema_test.dart'
      - 'test/services/g1_many_to_many_hierarchy_migration_test.dart'
      - 'test/services/g1_m2m_hierarchy_acceptance_test.dart'
      - 'test/services/g1_v19_historical_parity_test.dart'
      - '.github/workflows/arvin-command-07-a2-47-optional-relationships.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact product commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  sqlite-v20-acceptance:
    name: Canonical v20 lifecycle, historical parity and M2M integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_TARGET_SHA=$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$TARGET_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Install SQLite development library
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-dev
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Run canonical SQLite v20 acceptance suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/arvin-command-07-a2-80-d
          flutter test test/services/g1_many_to_many_hierarchy_migration_test.dart \
            --reporter expanded 2>&1 | tee build/arvin-command-07-a2-80-d/migration-helper.log
          flutter test test/services/g1_m2m_hierarchy_acceptance_test.dart \
            --reporter expanded 2>&1 | tee build/arvin-command-07-a2-80-d/m2m-acceptance.log
          flutter test test/services/g1_v19_historical_parity_test.dart \
            --reporter expanded 2>&1 | tee build/arvin-command-07-a2-80-d/v19-historical-parity.log
          flutter test test/services/g1_drift_schema_test.dart \
            --reporter expanded 2>&1 | tee build/arvin-command-07-a2-80-d/drift-lifecycle.log
          printf '%s\n' "$TARGET_SHA" > build/arvin-command-07-a2-80-d/target-sha.txt
          sha256sum build/arvin-command-07-a2-80-d/*.log \
            | tee build/arvin-command-07-a2-80-d/evidence.sha256
      - name: Upload exact-SHA SQLite v20 evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: arvin-command-07-a2-80-d-sqlite-v20-${{ env.TARGET_SHA }}
          path: build/arvin-command-07-a2-80-d/
          if-no-files-found: warn
          retention-days: 90
