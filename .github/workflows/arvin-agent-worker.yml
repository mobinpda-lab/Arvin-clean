name: ARVIN AI Code Worker

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA leased by the queue
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: arvin-agent-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  code-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARVIN_ISSUE_NUMBER: ${{ inputs.issue_number }}
      ARVIN_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
      ARVIN_MAX_AUTO_FIX_ATTEMPTS: '3'
      ARVIN_PROVIDER_TIMEOUT_SECONDS: '180'
      ARVIN_PROVIDER_BUDGET_SECONDS: '540'
      ASF_LEASE_SECONDS: '1800'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact main lease
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ARVIN_EXPECTED_MAIN_SHA"

      - name: Select issue-scoped worker branch
        run: |
          set -euo pipefail
          branch="ai/issue-${ARVIN_ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            git merge-base --is-ancestor "origin/main" HEAD || { echo 'Worker branch is stale relative to current main; fail closed.'; exit 8; }
          else
            git switch -c "$branch"
          fi
          echo "ARVIN_WORKER_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Setup Flutter
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure git
        run: |
          git config user.name "arvin-agent[bot]"
          git config user.email "arvin-agent[bot]@users.noreply.github.com"

      - name: Generate, test and self-fix
        run: python3 .github/arvin/agent-runtime.py

      - name: Final project validation
        run: |
          if [ -f pubspec.yaml ]; then
            flutter pub get
            flutter analyze
            flutter test
          elif [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo 'No supported project manifest detected.'
          fi

      - name: Commit worker result
        run: |
          set -euo pipefail
          git diff --quiet && { echo 'Worker produced no change.'; exit 1; }
          git add -A
          git commit -m "feat(ai-worker): implement issue #${ARVIN_ISSUE_NUMBER}"

      - name: Push worker branch
        run: git push origin "HEAD:${ARVIN_WORKER_BRANCH}"

      - name: Open or reuse guarded draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$ARVIN_WORKER_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            pr="$existing"
          else
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --head "$ARVIN_WORKER_BRANCH" --base main --title "AI Worker: issue #${ARVIN_ISSUE_NUMBER}" --body "Bounded autonomous Code Worker result for #${ARVIN_ISSUE_NUMBER}. Exact-head Fast, Build and Device gates remain required.")"
            pr="${pr_url##*/}"
          fi
          gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label arvin-auto
          gh issue comment "$ARVIN_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "<!-- arvin-worker-output -->\nAI Code Worker produced/updated PR #${pr} from exact leased main ${ARVIN_EXPECTED_MAIN_SHA}."
          echo "ARVIN_PR_NUMBER=$pr" >> "$GITHUB_ENV"

      - name: Wake canonical promotion gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-orchestrator.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$ARVIN_PR_NUMBER"
