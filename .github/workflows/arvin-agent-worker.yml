name: ARVIN AI Code Worker

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: arvin-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  code-worker:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'arvin-auto'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARVIN_ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
      ARVIN_MAX_AUTO_FIX_ATTEMPTS: '3'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets and task
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$ARVIN_ISSUE_NUMBER"

      - name: Configure git
        run: |
          git config user.name "arvin-agent[bot]"
          git config user.email "arvin-agent[bot]@users.noreply.github.com"

      - name: Generate, test and self-fix
        run: python3 .github/arvin/agent-runtime.py

      - name: Final project validation
        run: |
          if [ -f pubspec.yaml ]; then
            flutter --version
            flutter pub get
            flutter analyze
            flutter test
          elif [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo "No supported project manifest detected; code-worker stops safely."
          fi

      - name: Commit worker result
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "feat(ai-worker): implement issue #$ARVIN_ISSUE_NUMBER"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push worker branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ARVIN_ISSUE_NUMBER}"
          git switch -C "$BRANCH"
          git push --force-with-lease origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open or reuse guarded draft pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ARVIN_ISSUE_NUMBER}"
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            PR_NUMBER="$EXISTING"
            echo "PR #$PR_NUMBER already exists; branch updated."
          else
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --draft \
              --head "$BRANCH" \
              --base main \
              --title "AI Worker: issue #$ARVIN_ISSUE_NUMBER" \
              --body "Automated bounded Code Worker implementation for #$ARVIN_ISSUE_NUMBER. Exact-head Fast, Build and Device gates are required. Production Orchestrator is the single promotion/merge authority.")
            PR_NUMBER="${PR_URL##*/}"
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label arvin-auto
          gh issue comment "$ARVIN_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "<!-- arvin-worker-output -->\nAI Code Worker produced/updated PR #$PR_NUMBER. Promotion is delegated to the canonical Production Orchestrator; no direct merge is attempted by the worker."
