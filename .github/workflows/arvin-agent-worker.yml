name: ARVIN AI Code Worker

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA captured by the autonomous queue lease
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

# One issue has one canonical launch authority. ARVIN Orchestrator and the
# Production Loop dispatch this workflow explicitly. The worker never launches
# directly from an issue label.
concurrency:
  group: arvin-agent-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  code-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARVIN_ISSUE_NUMBER: ${{ inputs.issue_number }}
      ARVIN_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
      ARVIN_MAX_AUTO_FIX_ATTEMPTS: '3'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact leased main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact main lease
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARVIN_ISSUE_NUMBER"
          test -n "$ARVIN_EXPECTED_MAIN_SHA"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$ARVIN_EXPECTED_MAIN_SHA"

      - name: Setup Flutter
        if: ${{ hashFiles('pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure git
        run: |
          git config user.name "arvin-agent[bot]"
          git config user.email "arvin-agent[bot]@users.noreply.github.com"

      - name: Generate, test and self-fix
        id: generate
        shell: bash
        run: |
          set -uo pipefail
          # GitHub's bash wrapper starts with errexit enabled. Disable it only
          # around the provider process so exit code 75 can be classified and
          # the lease-release handler can run.
          set +e
          python3 .github/arvin/agent-runtime.py
          rc=$?
          set -e
          if [ "$rc" -eq 75 ]; then
            echo "provider_pressure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "provider_pressure=false" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Release lease on provider pressure
        if: steps.generate.outputs.provider_pressure == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue edit "$ARVIN_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label factory:leased --remove-label factory:in-progress || true
          gh issue comment "$ARVIN_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "<!-- arvin-provider-pressure -->\\nAI provider returned HTTP 429. No product failure is claimed; worker lease was released and immediate retry was suppressed. Deterministic/non-AI lanes may continue; retry only after cooldown."

      - name: Final project validation
        if: steps.generate.outputs.provider_pressure != 'true'
        run: |
          if [ -f pubspec.yaml ]; then
            flutter --version
            flutter pub get
            flutter analyze
            flutter test
          elif [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo "No supported project manifest detected; code-worker stops safely."
          fi

      - name: Commit worker result
        if: steps.generate.outputs.provider_pressure != 'true'
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "feat(ai-worker): implement issue #$ARVIN_ISSUE_NUMBER"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push worker branch
        if: steps.generate.outputs.provider_pressure != 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ARVIN_ISSUE_NUMBER}"
          git switch -C "$BRANCH"
          git push --force-with-lease origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open or reuse guarded draft pull request
        if: steps.generate.outputs.provider_pressure != 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ARVIN_ISSUE_NUMBER}"
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            PR_NUMBER="$EXISTING"
            echo "PR #$PR_NUMBER already exists; branch updated."
          else
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --draft \
              --head "$BRANCH" \
              --base main \
              --title "AI Worker: issue #$ARVIN_ISSUE_NUMBER" \
              --body "Automated bounded Code Worker implementation for #$ARVIN_ISSUE_NUMBER. Exact-head Fast, Build and Device gates are required. Production Orchestrator is the single promotion/merge authority.")
            PR_NUMBER="${PR_URL##*/}"
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label arvin-auto
          gh issue comment "$ARVIN_ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "<!-- arvin-worker-output -->\nAI Code Worker produced/updated PR #$PR_NUMBER from exact leased main $ARVIN_EXPECTED_MAIN_SHA. Promotion is delegated to the canonical Production Orchestrator; no direct merge is attempted by the worker."

          gh workflow run parallel-wave.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run production-orchestrator.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$PR_NUMBER"
