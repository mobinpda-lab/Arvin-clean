name: Home route transform

on:
  push:
    branches:
      - feat/home-visual-integration-2026-09-07

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[home-transform]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Transform real Home route
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          if "import 'widgets/arvin_home_primary_add_button.dart';" not in s:
              s = s.replace("import 'widgets/arvin_primary_navigation.dart';", "import 'widgets/arvin_primary_navigation.dart';\nimport 'widgets/arvin_home_primary_add_button.dart';", 1)
          task_start = s.index('  Widget _taskCard(Task task) {')
          build_start = s.index('  @override\n  Widget build(BuildContext context) {', task_start)
          enum_start = s.index('\nenum _HomeMoreAction {', build_start)
          task_method = '''  Widget _taskCard(Task task) {\n    final followUpDate = _homeFollowUpDate(task);\n    final late = _overdue(task);\n    final colors = Theme.of(context).colorScheme;\n    return Dismissible(\n      key: ValueKey(task.id),\n      direction: selectionMode ? DismissDirection.none : DismissDirection.horizontal,\n      confirmDismiss: (direction) => _applySwipe(task, direction),\n      background: task.trashed ? _swipeBackground(TaskSwipeAction.none) : _swipeBackground(widget.settings.swipeLeftAction),\n      secondaryBackground: task.trashed ? _swipeBackground(TaskSwipeAction.trash) : _swipeBackground(widget.settings.swipeRightAction),\n      child: Material(\n        color: colors.surface,\n        borderRadius: BorderRadius.circular(16),\n        elevation: 0,\n        child: InkWell(\n          borderRadius: BorderRadius.circular(16),\n          onLongPress: () => setState(() { selectionMode = true; selected.add(task.id); }),\n          onTap: selectionMode ? () => setState(() { if (selected.contains(task.id)) { selected.remove(task.id); } else { selected.add(task.id); } }) : () => _openTaskDetail(task),\n          child: Padding(\n            padding: const EdgeInsets.fromLTRB(12, 12, 12, 12),\n            child: Row(crossAxisAlignment: CrossAxisAlignment.start, children: [\n              selectionMode ? Checkbox(value: selected.contains(task.id), onChanged: (_) => setState(() { if (selected.contains(task.id)) { selected.remove(task.id); } else { selected.add(task.id); } })) : IconButton(onPressed: () => _toggle(task), icon: Icon(task.completed ? Icons.check_circle_rounded : late ? Icons.warning_amber_rounded : Icons.radio_button_unchecked_rounded, color: task.completed ? const Color(0xFF409B51) : late ? const Color(0xFFDB8B23) : colors.primary)),\n              const SizedBox(width: 4),\n              Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n                Text(task.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: TextStyle(color: const Color(0xFF232433), fontWeight: FontWeight.w700, fontSize: 15, decoration: task.completed ? TextDecoration.lineThrough : null)),\n                if (task.description.isNotEmpty) ...[const SizedBox(height: 4), Text(task.description, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Color(0xFF80829C), fontSize: 12))],\n                if (task.tags.isNotEmpty) ...[const SizedBox(height: 6), Wrap(spacing: 4, runSpacing: 4, children: task.tags.map((tag) => Container(padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3), decoration: BoxDecoration(color: const Color(0xFFE9EAFF), borderRadius: BorderRadius.circular(10)), child: Text(tag, style: const TextStyle(color: Color(0xFF4A4CAB), fontSize: 10)))).toList())],\n                if (followUpDate != null) ...[const SizedBox(height: 7), Row(children: [Icon(Icons.event_outlined, size: 15, color: late ? const Color(0xFFDB8B23) : const Color(0xFF80829C)), const SizedBox(width: 4), Flexible(child: Text('پیگیری: ${_date(followUpDate)} • ${_time(followUpDate)}', style: TextStyle(color: late ? const Color(0xFFDB8B23) : const Color(0xFF80829C), fontSize: 11, fontWeight: late ? FontWeight.w600 : FontWeight.w400)))])],\n                if (task.trashed || task.archived) TextButton(onPressed: () => _restore(task), child: const Text('بازگردانی به فعال')),\n              ])),\n            ]),\n          ),\n        ),\n      ),\n    );\n  }\n\n'''
          build_method = '''  @override\n  Widget build(BuildContext context) {\n    final activeTasks = tasks.where((task) => !task.archived && !task.trashed && !task.completed).length;\n    final allTasks = tasks.where((task) => !task.archived && !task.trashed).length;\n    final doneTasks = tasks.where((task) => !task.archived && !task.trashed && task.completed).length;\n    final overdueTasks = tasks.where((task) => !task.archived && !task.trashed && _overdue(task)).length;\n    Widget stat(String label, int value, IconData icon, String target, Color accent, String keyName) {\n      final selected = filter == target;\n      return Semantics(key: ValueKey(keyName), button: true, selected: selected, label: 'فیلتر $label، $value مورد', child: Material(color: selected ? const Color(0xFFE9EAFF) : const Color(0xFFFDFDFE), borderRadius: BorderRadius.circular(16), child: InkWell(borderRadius: BorderRadius.circular(16), onTap: () => _selectHomeStat(target), child: Container(padding: const EdgeInsets.symmetric(vertical: 10, horizontal: 3), decoration: BoxDecoration(borderRadius: BorderRadius.circular(16), border: Border.all(color: selected ? const Color(0xFF4A4CAB) : const Color(0xFFE5E7ED), width: selected ? 1.3 : 0.8)), child: Column(children: [Icon(icon, size: 19, color: accent), const SizedBox(height: 4), Text('$value', style: const TextStyle(color: Color(0xFF232433), fontWeight: FontWeight.w800, fontSize: 16)), const SizedBox(height: 1), Text(label, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Color(0xFF80829C), fontSize: 10))])))));\n    }\n    return Scaffold(backgroundColor: const Color(0xFFF8F8FB), body: SafeArea(child: Column(children: [\n      Padding(padding: const EdgeInsets.fromLTRB(12, 8, 12, 6), child: Row(crossAxisAlignment: CrossAxisAlignment.start, children: [\n        IconButton(key: const ValueKey('home-notifications'), tooltip: 'اعلان‌ها', onPressed: () => ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('اعلان‌ها در بخش اعلان‌های برنامه مدیریت می‌شوند'))), icon: const Icon(Icons.notifications_none_rounded)),\n        const Expanded(child: Column(children: [DecoratedBox(decoration: BoxDecoration(color: Color(0xFFF0F0F6), borderRadius: BorderRadius.all(Radius.circular(14))), child: Padding(padding: EdgeInsets.symmetric(horizontal: 12, vertical: 6), child: Text('بسم الله الرحمن الرحیم', key: ValueKey('home-bismillah'), textAlign: TextAlign.center, style: TextStyle(color: Color(0xFF80829C), fontSize: 12)))), SizedBox(height: 7), Text('مدیریت کارها و پیگیری آروین', key: ValueKey('home-title-block'), textAlign: TextAlign.center, style: TextStyle(color: Color(0xFF232433), fontSize: 18, fontWeight: FontWeight.w700))])),\n        IconButton(key: const ValueKey('home-menu'), tooltip: 'منو', onPressed: _openPrimaryMore, icon: const Icon(Icons.menu_rounded)),\n      ])),\n      Padding(padding: const EdgeInsets.fromLTRB(16, 4, 16, 10), child: TextField(key: _searchGuideKey, onChanged: (value) => setState(() => query = value), decoration: InputDecoration(hintText: 'جست‌وجو در کارها', prefixIcon: const Icon(Icons.search_rounded), filled: true, fillColor: const Color(0xFFFDFDFE), border: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: const BorderSide(color: Color(0xFFE5E7ED))), enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: const BorderSide(color: Color(0xFFE5E7ED))), focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: const BorderSide(color: Color(0xFF4A4CAB), width: 1.4)))),\n      Padding(padding: const EdgeInsets.symmetric(horizontal: 16), child: Row(children: [Expanded(child: stat('کل', allTasks, Icons.list_alt_rounded, 'کل', const Color(0xFF4A4CAB), 'home-stat-all')), const SizedBox(width: 6), Expanded(child: stat('فعال', activeTasks, Icons.pending_actions_rounded, 'فعال', const Color(0xFF2F80ED), 'home-stat-active')), const SizedBox(width: 6), Expanded(child: stat('انجام‌شده', doneTasks, Icons.check_circle_rounded, 'انجام‌شده', const Color(0xFF409B51), 'home-stat-done')), const SizedBox(width: 6), Expanded(child: stat('عقب‌افتاده', overdueTasks, Icons.warning_amber_rounded, 'عقب‌افتاده', const Color(0xFFDB8B23), 'home-stat-overdue'))])),\n      Padding(padding: const EdgeInsets.fromLTRB(16, 14, 16, 6), child: Row(children: [const Expanded(child: Text('کارهای من', style: TextStyle(color: Color(0xFF232433), fontSize: 17, fontWeight: FontWeight.w700))), if (filter != 'کل') TextButton(onPressed: () => _selectHomeStat('کل'), child: const Text('مشاهده همه'))])),\n      Expanded(child: loading ? const Center(child: CircularProgressIndicator()) : visible.isEmpty ? Center(child: Text(filter == 'سطل زباله' ? 'سطل زباله خالی است' : filter == 'بایگانی' ? 'بایگانی خالی است' : filter == 'امروز' ? 'کاری برای امروز وجود ندارد' : filter == 'انجام‌شده' ? 'کار انجام‌شده‌ای وجود ندارد' : filter == 'عقب‌افتاده' ? 'کار عقب‌افتاده‌ای وجود ندارد' : 'کاری برای نمایش وجود ندارد')) : ListView.separated(padding: const EdgeInsets.fromLTRB(16, 4, 16, 100), itemCount: visible.length, separatorBuilder: (_, __) => const SizedBox(height: 8), itemBuilder: (_, index) => _taskCard(visible[index]))),\n    ])),\n      floatingActionButton: selected.isEmpty ? Padding(padding: const EdgeInsets.only(bottom: 2), child: ArvinHomePrimaryAddButton(onPressed: _add)) : null,\n      bottomNavigationBar: selected.isEmpty ? ArvinPrimaryNavigation(selected: ArvinPrimaryDestination.home, onSelected: _onPrimaryDestinationSelected) : SafeArea(child: Padding(padding: const EdgeInsets.all(8), child: Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [FilledButton.icon(onPressed: _archiveSelected, icon: const Icon(Icons.archive_outlined), label: const Text('بایگانی')), FilledButton.tonalIcon(onPressed: _trashSelected, icon: const Icon(Icons.delete_outline), label: const Text('حذف'))]))),\n    );\n  }\n'''
          s = s[:task_start] + task_method + build_method + s[enum_start:]
          s = s.replace('    );\n  }\n\nenum _HomeMoreAction {', '    );\n  }\n}\n\nenum _HomeMoreAction {', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit transformed Home route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(home): integrate canonical Home route [home-transform]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
