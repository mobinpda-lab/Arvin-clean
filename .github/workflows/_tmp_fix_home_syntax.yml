name: temporary-home-syntax-fix
on:
  push:
    branches: [feat/home-visual-integration-2026-09-07]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Home TextField closure
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = "focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: const BorderSide(color: Color(0xFF4A4CAB), width: 1.4)))),"
          new = "focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: const BorderSide(color: Color(0xFF4A4CAB), width: 1.4))))),"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Commit fix
        run: |
          git config user.name 'arvin-factory-bot'
          git config user.email 'arvin-factory-bot@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix(home): close canonical search field'
          git push
