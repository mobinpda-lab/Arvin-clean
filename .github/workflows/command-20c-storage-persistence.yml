name: Arvin COMMAND 20-E Acceptance
run-name: Arvin COMMAND 20-E (${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }})

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'test/project_store_file_persistence_test.dart'
      - 'integration_test/calendar_link_shared_preferences_restart_test.dart'
      - 'integration_test/command20e_calendar_restart_fixture.dart'
      - '.github/scripts/command-20e-evidence-parser.sh'
      - '.github/scripts/test-command-20e-evidence-parser.sh'
      - '.github/workflows/command-20c-storage-persistence.yml'
      - '.github/scripts/command-20e-calendar-restart.sh'
      - '.github/scripts/command-20e-collect-evidence.sh'
      - 'lib/services/project_store.dart'
      - 'lib/services/external_calendar_link_store.dart'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FLUTTER_VERSION: '3.47.0'
  TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  storage-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout and initialize evidence
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .github/command-20e-evidence
          actual="$(git rev-parse HEAD)"
          printf 'TARGET_SHA=%s\nCHECKED_OUT_SHA=%s\n' "$TARGET_SHA" "$actual" | tee .github/command-20e-evidence/sha-verification.txt
          test "$actual" = "$TARGET_SHA"
          echo 'SHA_VERIFICATION=PASS' | tee -a .github/command-20e-evidence/sha-verification.txt
          printf 'WORKFLOW_RUN_URL=%s\n' "$RUN_URL" > .github/command-20e-evidence/workflow-run.txt

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Capture SDK versions
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
            flutter --version
            dart --version
            java -version
            echo "ANDROID_SDK_ROOT=$sdk_root"
            flutter doctor -v || true
            if [ -d "$sdk_root/platforms" ]; then
              find "$sdk_root/platforms" -maxdepth 2 -name source.properties -type f -print -exec grep -E 'Pkg.Desc|Pkg.Revision' {} \; || true
            fi
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
            if [ -n "$sdkmanager_path" ]; then
              echo "SDKMANAGER_PATH=$sdkmanager_path"
              "$sdkmanager_path" --list_installed || true
            else
              echo "SDKMANAGER=NOT_FOUND; Android SDK package manifests and Flutter doctor output retained"
            fi
          } > .github/command-20e-evidence/environment_versions.txt 2>&1
          cat .github/command-20e-evidence/environment_versions.txt

      - name: Resolve locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee .github/command-20e-evidence/pub-get.log
          git diff --exit-code -- pubspec.lock

      - name: Flutter Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee .github/command-20e-evidence/flutter_analyze.log

      - name: Run COMMAND 20-E evidence parser unit tests
        if: always()
        shell: bash
        run: bash .github/scripts/test-command-20e-evidence-parser.sh

      - name: Run file-backed ProjectStore test
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "TEST_STARTED=1" | tee .github/command-20e-evidence/project_store_persistence.log
          if flutter test test/project_store_file_persistence_test.dart 2>&1 | tee -a .github/command-20e-evidence/project_store_persistence.log; then
            echo "PROJECT_STORE_FILE_PERSISTENCE=PASS" | tee -a .github/command-20e-evidence/project_store_persistence.log
            echo "TEST_STATUS=PASS" | tee -a .github/command-20e-evidence/project_store_persistence.log
          else
            result=$?
            echo "TEST_STATUS=FAILURE" | tee -a .github/command-20e-evidence/project_store_persistence.log
            echo "FAILURE_REASON=flutter test exited with code $result" | tee -a .github/command-20e-evidence/project_store_persistence.log
            exit "$result"
          fi

      - name: Enable KVM
        id: enable-kvm
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM_DEVICE_ACCESS=PASS"
            ls -l /dev/kvm
          else
            echo "KVM_DEVICE_ACCESS=UNAVAILABLE — refusing unverified software-emulation fallback" >&2
            ls -l /dev/kvm 2>&1 || true
            exit 1
          fi
      - name: Run real SharedPreferences write, stop, and fresh-process read
        if: always() && steps.enable-kvm.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          cores: 4
          emulator-boot-timeout: 600
          disable-linux-hw-accel: auto
          script: |
            set -euo pipefail
            echo "EMULATOR_API_LEVEL=35"
            echo "EMULATOR_ARCH=x86_64"
            echo "EMULATOR_TARGET=default"
            echo "EMULATOR_ACCELERATION=auto"
            test -e /dev/kvm && test -r /dev/kvm && test -w /dev/kvm && echo "KVM_DEVICE_ACCESS=PASS" || echo "KVM_DEVICE_ACCESS=UNAVAILABLE"
            adb devices -l
            bash .github/scripts/command-20e-calendar-restart.sh

      - name: Write initial acceptance results
        if: always()
        shell: bash
        run: |
          set -u
          evidence=".github/command-20e-evidence"
          source .github/scripts/command-20e-evidence-parser.sh
          project_state=NOT_STARTED
          grep -q 'TEST_STARTED=1' "$evidence/project_store_persistence.log" 2>/dev/null && project_state=STARTED
          grep -Eq 'TEST_STATUS=(PASS|FAILURE)' "$evidence/project_store_persistence.log" 2>/dev/null && project_state=COMPLETED
          project="$(classify_evidence_file "$evidence/project_store_persistence.log" "$project_state" 'TEST_STARTED=1' 'TEST_STATUS=PASS' 'TEST_STATUS=FAILURE')"
          cat "$evidence/calendar_restart_stage_a.log" "$evidence/calendar_restart_stage_b.log" > "$evidence/calendar-combined-status.log"
          calendar_state=NOT_STARTED
          grep -q 'TEST_STARTED=1' "$evidence/calendar-combined-status.log" && calendar_state=STARTED
          grep -Eq 'TEST_STATUS=(PASS|FAILURE)' "$evidence/calendar-combined-status.log" && calendar_state=COMPLETED
          calendar="$(classify_evidence_file "$evidence/calendar-combined-status.log" "$calendar_state" 'TEST_STARTED=1' 'CALENDAR_LINK_PROCESS_RESTART=PASS' 'TEST_STATUS=FAILURE')"
          cleanup_state=NOT_STARTED
          grep -q 'CLEANUP_TEST_STARTED=1' "$evidence/cleanup_verification.log" 2>/dev/null && cleanup_state=STARTED
          grep -Eq 'TEST_STATUS=(PASS|FAILURE)' "$evidence/cleanup_verification.log" 2>/dev/null && cleanup_state=COMPLETED
          cleanup="$(classify_evidence_file "$evidence/cleanup_verification.log" "$cleanup_state" 'CLEANUP_TEST_STARTED=1' 'CALENDAR_TEST_KEY_CLEANUP=PASS' 'TEST_STATUS=FAILURE')"
          {
            printf 'PROJECT_STORE_FILE_PERSISTENCE=%s\n' "$project"
            printf 'CALENDAR_LINK_PROCESS_RESTART=%s\n' "$calendar"
            printf 'CLEANUP=%s\n' "$cleanup"
            printf 'TARGET_SHA=%s\n' "$TARGET_SHA"
          } | tee "$evidence/acceptance-results.txt"

      - name: Upload phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvin-command-20e-phase-${{ env.TARGET_SHA }}
          path: .github/command-20e-evidence/
          if-no-files-found: error
          retention-days: 30

  complete-evidence:
    if: always()
    needs: storage-persistence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Download phase evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: arvin-command-20e-phase-${{ env.TARGET_SHA }}
          path: .github/command-20e-evidence

      - name: Collect exact-SHA regression and prepare evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        shell: bash
        run: bash .github/scripts/command-20e-collect-evidence.sh

      - name: Upload final COMMAND 20-E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvin-command-20e-evidence
          path: .github/command-20e-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce COMMAND 20-E acceptance gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/command-20e-evidence/regression_summary.json
          jq -e '.overall == "PASS"' .github/command-20e-evidence/regression_summary.json
