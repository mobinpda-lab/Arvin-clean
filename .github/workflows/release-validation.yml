name: Arvin Release Validation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Print source revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          flutter --version

      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .

      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle file not found')

          text = path.read_text()
          is_kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if is_kts else 'coreLibraryDesugaringEnabled true'
          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'")

          if flag not in text:
              match = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n        ' + flag + text[match.end():]
              else:
                  block = '\n\ncompileOptions {\n        ' + flag + '\n}\n'
                  dep_pos = text.find('dependencies {')
                  text = text[:dep_pos] + block + text[dep_pos:] if dep_pos >= 0 else text + block

          if 'desugar_jdk_libs:2.1.5' not in text:
              match = re.search(r'(?m)^\s*dependencies\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n    ' + dependency + text[match.end():]
              else:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'

          path.write_text(text)
          print(f'Configured {path}')
          PY

      - name: Get dependencies with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "flutter pub get attempt $attempt/3"
            if flutter pub get; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          exit 1

      - name: Android V2 and release configuration audit
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts || { echo 'Android app Gradle file missing'; exit 1; }

          MAIN_ACTIVITY="$(find android/app/src/main -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print -quit)"
          test -n "$MAIN_ACTIVITY" || { echo 'MainActivity.kt/java not found'; find android/app/src/main -maxdepth 8 -type f | sort; exit 1; }
          echo "MainActivity=$MAIN_ACTIVITY"

          grep -q 'FlutterActivity' "$MAIN_ACTIVITY" || { echo 'MainActivity is not FlutterActivity'; cat "$MAIN_ACTIVITY"; exit 1; }

          GRADLE_FILE="$(find android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit)"
          grep -q 'desugar_jdk_libs:2.1.5' "$GRADLE_FILE" || { echo 'desugar_jdk_libs:2.1.5 missing'; exit 1; }

          if grep -RniE 'io\.flutter\.app\.(FlutterActivity|FlutterApplication)|FlutterActivityDelegate' android/app/src/main 2>/dev/null; then
            echo 'Deleted Android V1 embedding marker detected'
            exit 1
          fi

      - name: Analyze (errors fatal, infos non-fatal)
        run: flutter analyze --no-fatal-infos

      - name: Run all tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
