name: Arvin Release Validation

on:
  push:
    branches: ['feat/**', 'fix/**', main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Print source revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          flutter --version

      - name: Get dependencies with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "flutter pub get attempt $attempt/3"
            if flutter pub get; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          exit 1

      - name: Android V2 and release configuration audit
        shell: bash
        run: |
          test -f android/app/build.gradle.kts || { echo 'Android app Gradle file missing'; exit 1; }
          test -f android/app/src/main/kotlin/com/example/arvin/MainActivity.kt || { echo 'MainActivity.kt missing'; exit 1; }
          grep -q 'FlutterActivity' android/app/src/main/kotlin/com/example/arvin/MainActivity.kt || { echo 'MainActivity is not FlutterActivity'; exit 1; }
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts || { echo 'Core library desugaring is not enabled'; exit 1; }
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts || { echo 'desugar_jdk_libs:2.1.5 missing'; exit 1; }
          if grep -RniE 'io\.flutter\.app\.(FlutterActivity|FlutterApplication)|io\.flutter\.embedding\.engine\.FlutterEngine' android/app/src/main 2>/dev/null; then
            echo 'Deleted Android V1 embedding marker detected'
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run all tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
