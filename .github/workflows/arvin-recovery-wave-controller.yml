name: ARVIN Recovery Wave Controller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: arvin-recovery-wave-controller
  cancel-in-progress: false

jobs:
  reconcile-and-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile ordered recovery waves and wake factory
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const parentIssue = 845;
            const waves = [846, 847, 848, 849, 850, 851, 852, 853];
            const bootstrapHoldMarker = '<!-- arvin-auto-advance-bootstrap-hold -->';
            const workerAutoCloseToken = 'Closes #$ARVIN_ISSUE_NUMBER';
            const hardBlocks = new Set([
              'do-not-merge',
              'orchestrator:hold',
              'orchestrator:manual',
              'factory:escalated',
            ]);

            const state = [];
            for (const issueNumber of waves) {
              const response = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              const issue = response.data;
              const labels = new Set((issue.labels || []).map(x => typeof x === 'string' ? x : x.name));
              state.push({ issue, labels });
            }

            const firstOpenIndex = state.findIndex(x => x.issue.state === 'open');
            if (firstOpenIndex < 0) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: parentIssue, per_page: 100,
              });
              const marker = '<!-- arvin-recovery-waves-complete -->';
              if (!comments.some(c => c.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: parentIssue,
                  body: `${marker}\nAll ordered ARVIN Recovery Waves (#846–#853) are closed. Run final exact-main checklist/evidence reconciliation before closing the parent issue.`,
                });
              }
              core.info('All recovery waves are closed.');
              return;
            }

            const active = state[firstOpenIndex];
            const activeNumber = active.issue.number;

            // A one-time bootstrap hold can protect the first post-Wave-0 task while
            // the worker auto-close contract itself is being merged. Only a hold with
            // the explicit marker is auto-released, and only after current main proves
            // that guarded worker PRs contain the issue-closing token. Manual owner
            // holds without this marker remain fail-closed.
            if (active.labels.has('orchestrator:hold')) {
              const activeComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: activeNumber, per_page: 100,
              });
              const isBootstrapHold = activeComments.some(c => c.body?.includes(bootstrapHoldMarker));
              if (isBootstrapHold) {
                const workerFile = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/workflows/arvin-agent-worker.yml',
                  ref: 'main',
                });
                const encoded = Array.isArray(workerFile.data) ? '' : (workerFile.data.content || '');
                const workerText = Buffer.from(encoded, 'base64').toString('utf8');
                if (workerText.includes(workerAutoCloseToken)) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: activeNumber, name: 'orchestrator:hold',
                  }).catch(() => {});
                  active.labels.delete('orchestrator:hold');
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: activeNumber,
                    body: '<!-- arvin-auto-advance-bootstrap-released -->\nBootstrap hold released automatically: current main contains the guarded worker issue-auto-close contract. Ordered recovery execution may continue without manual intervention.',
                  });
                }
              }
            }

            // Later waves must remain dormant until every earlier wave closes. Both
            // factory:ready and arvin-auto are queue-eligibility labels, so clear both
            // when there is no active lease/worker PR. Never disturb a live lease.
            for (let i = firstOpenIndex + 1; i < state.length; i++) {
              const later = state[i];
              if (later.issue.state !== 'open') continue;
              if (later.labels.has('factory:leased') || later.labels.has('factory:in-progress')) {
                core.warning(`Later wave #${later.issue.number} is already active; controller will not mutate its lease.`);
                continue;
              }
              for (const eligibilityLabel of ['factory:ready', 'arvin-auto']) {
                if (!later.labels.has(eligibilityLabel)) continue;
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: later.issue.number,
                  name: eligibilityLabel,
                }).catch(() => {});
                core.info(`Removed premature ${eligibilityLabel} from later wave #${later.issue.number}.`);
              }
            }

            if ([...hardBlocks].some(label => active.labels.has(label))) {
              core.warning(`Active recovery wave #${activeNumber} is hard-blocked; later waves remain held.`);
              return;
            }

            const openWorkerPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:ai/issue-${activeNumber}`,
              per_page: 100,
            });

            if (active.labels.has('factory:leased') || active.labels.has('factory:in-progress') || openWorkerPrs.length > 0) {
              core.info(`Recovery wave #${activeNumber} already has active factory work; no duplicate dispatch.`);
              return;
            }

            if (!active.labels.has('factory:ready')) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: activeNumber,
                labels: ['factory:ready'],
              });
            }

            const parentComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: parentIssue, per_page: 100,
            });
            const activationMarker = `<!-- arvin-recovery-wave-active:${activeNumber} -->`;
            if (!parentComments.some(c => c.body?.includes(activationMarker))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: parentIssue,
                body: `${activationMarker}\nARVIN Recovery Controller activated wave #${activeNumber}: **${active.issue.title}**. Later waves remain dormant until this wave closes. Controller cadence: every 5 minutes.`,
              });
            }

            // Wake the existing canonical queue explicitly. The queue itself also has a
            // five-minute schedule, but this dispatch reduces latency and preserves one
            // launch authority for the actual AI worker lease.
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'arvin-autonomous-queue.yml',
              ref: 'main',
            });

            core.info(`Recovery wave #${activeNumber} is ready and the canonical queue was awakened.`);
