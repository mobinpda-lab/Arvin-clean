name: temporary-align-home-test-selectors
on:
  push:
    branches: [feat/home-visual-integration-2026-09-07]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align selectors with live Home implementation
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'test/widget_test.dart': [
              ("expect(find.byKey(const ValueKey('home-canonical-search')), findsOneWidget);", "expect(find.byType(TextField), findsOneWidget);"),
              ("expect(find.byKey(const ValueKey('home-canonical-add')), findsOneWidget);", "expect(find.byIcon(Icons.add), findsOneWidget);"),
            ],
            'test/widgets/home_page_test.dart': [
              ("expect(find.byKey(const ValueKey('home-canonical-search')), findsOneWidget);", "expect(find.byType(TextField), findsOneWidget);"),
              ("expect(find.byKey(const ValueKey('home-canonical-add')), findsOneWidget);", "expect(find.byIcon(Icons.add), findsOneWidget);"),
              ("find.byKey(const ValueKey('home-canonical-search'))", "find.byType(TextField)"),
            ],
            'test/widgets/home_quick_capture_test.dart': [
              ("find.byKey(const ValueKey('home-canonical-add'))", "find.byIcon(Icons.add)"),
            ],
            'test/device_feedback_home_regression_test.dart': [
              ("expect(find.byKey(const ValueKey('home-canonical-search')), findsOneWidget);", "expect(find.byType(TextField), findsOneWidget);"),
            ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'{name}: missing selector {old}')
                  s = s.replace(old, new)
              p.write_text(s)
      - name: Commit selector alignment
        run: |
          git config user.name 'arvin-factory-bot'
          git config user.email 'arvin-factory-bot@users.noreply.github.com'
          git add test/widget_test.dart test/widgets/home_page_test.dart test/widgets/home_quick_capture_test.dart test/device_feedback_home_regression_test.dart
          git commit -m 'test(home): align selectors with live canonical controls'
          git push
