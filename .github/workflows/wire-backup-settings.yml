name: Wire Backup Settings Once

on:
  push:
    branches:
      - feat/issue-235-backup-settings-format

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch canonical Home backup and restore
        run: python3 tool/wire_backup_settings_once.py

      - name: Commit final portable Settings wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wire-backup-settings.yml tool/wire_backup_settings_once.py
          git add lib/main.dart test/home_backup_settings_contract_test.dart
          git diff --cached --check
          git commit -m 'feat(backup): wire Settings through Home backup restore'
          git push origin HEAD:feat/issue-235-backup-settings-format
