name: ARVIN Orchestrator

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: arvin-orchestrator-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Task Analyzer and Worker Routing
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const pr = context.payload.pull_request;

            if (issue) {
              const text = `${issue.title}\n${issue.body || ''}`.toLowerCase();
              let route = 'feature';
              if (/(bug|fix|fail|error|crash|regression)/.test(text)) route = 'bugfix';
              else if (/(test|ci|quality|coverage)/.test(text)) route = 'test';
              else if (/(doc|documentation|readme|guide)/.test(text)) route = 'documentation';
              else if (/(core|architecture|foundation|database|storage|sync)/.test(text)) route = 'core';

              const marker = '<!-- arvin-task-router -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const alreadyRouted = comments.some(c => c.body?.includes(marker));

              if (!alreadyRouted) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `${marker}\n\n### ARVIN Task Analyzer\n\n- Route: **${route}**\n- Code Worker: **queued**\n- Test Worker: **queued**\n- Documentation Worker: **queued when required**\n- CI feedback: **required before promotion**\n- PR policy: **draft-first / controlled merge**\n\nThis routing record is generated automatically from the issue title/body. The production orchestrator remains the only component allowed to promote an eligible PR.`
                });
              }
              return;
            }

            if (pr) {
              core.info(`PR #${pr.number}: ${pr.head.ref} -> ${pr.base.ref}; draft=${pr.draft}`);
              return;
            }
