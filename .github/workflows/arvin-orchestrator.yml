name: ARVIN Orchestrator

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: arvin-orchestrator-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Task Analyzer and Worker Routing
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const pr = context.payload.pull_request;

            async function currentMainSha() {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
              return data.object.sha;
            }

            async function routeIssue(item) {
              const text = `${item.title}\n${item.body || ''}`.toLowerCase();
              let route = 'feature';
              if (/(bug|fix|fail|error|crash|regression)/.test(text)) route = 'bugfix';
              else if (/(test|ci|quality|coverage)/.test(text)) route = 'test';
              else if (/(doc|documentation|readme|guide)/.test(text)) route = 'documentation';
              else if (/(core|architecture|foundation|database|storage|sync)/.test(text)) route = 'core';

              const marker = '<!-- arvin-task-router -->';
              const workerDispatchMarker = '<!-- arvin-worker-dispatch -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: item.number, per_page: 100,
              });
              const alreadyRouted = comments.some(c => c.body?.includes(marker));
              const alreadyDispatched = comments.some(c => c.body?.includes(workerDispatchMarker));

              if (!alreadyRouted) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: item.number,
                  body: `${marker}\n\n### ARVIN Task Analyzer\n\n- Route: **${route}**\n- Code Worker: **queued**\n- Test Worker: **queued**\n- Documentation Worker: **queued when required**\n- CI feedback: **required before promotion**\n- PR policy: **draft-first / controlled merge**\n\nRouting is idempotent. The worker is activated automatically only for actionable feature/bugfix/core tasks; test/documentation-only tasks remain gated for their dedicated workers.`
                });
              }

              const labels = (item.labels || []).map(l => l.name);
              const autoEligible = ['feature', 'bugfix', 'core'].includes(route) && !/(security|credential|secret|legal|destructive|migration)/.test(text);
              if (autoEligible && !labels.includes('arvin-auto')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: item.number, labels: ['arvin-auto'] });
              }

              if (autoEligible && !alreadyDispatched) {
                const expectedMainSha = await currentMainSha();
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'arvin-agent-worker.yml',
                  ref: 'main',
                  inputs: { issue_number: String(item.number), expected_main_sha: expectedMainSha },
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: item.number,
                  body: `${workerDispatchMarker}\nAI Code Worker explicitly dispatched for issue #${item.number} against exact main ${expectedMainSha}. This marker prevents duplicate worker launches for the same routed issue.`
                });
              }
            }

            if (issue) {
              await routeIssue(issue);
              return;
            }

            if (pr) {
              core.info(`PR #${pr.number}: ${pr.head.ref} -> ${pr.base.ref}; draft=${pr.draft}`);
              return;
            }

            const queued = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const candidates = queued.filter(item => !item.pull_request &&
              (item.labels || []).some(l => l.name === 'arvin-auto'));

            core.info(`Scheduled queue sweep found ${candidates.length} arvin-auto issue(s).`);
            await Promise.all(candidates.map(item => routeIssue(item)));
