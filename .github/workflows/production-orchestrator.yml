name: Arvin Production Orchestrator

on:
  workflow_run:
    workflows: ['Arvin Parallel Wave', 'Arvin Build', 'Arvin Device Smoke']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional arvin-auto PR to process end-to-end
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: arvin-production-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Guarded promote and merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const AUTO_LABEL = 'arvin-auto';
            const directWake = context.eventName === 'workflow_dispatch';
            const requestedPr = Number(context.payload.inputs?.pr_number || 0);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = main.data.commit.sha;
            core.info(`Current main: ${mainSha}`);

            let pulls;
            if (requestedPr) {
              const requested = await github.rest.pulls.get({ owner, repo, pull_number: requestedPr });
              pulls = [requested.data];
              core.info(`Direct wake targets PR #${requestedPr}.`);
            } else {
              pulls = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', base: 'main', per_page: 100,
              });
            }

            async function runsForHead(headSha) {
              return github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: headSha, per_page: 100,
              });
            }

            async function latestFastRun(headSha) {
              const runs = await runsForHead(headSha);
              return runs
                .filter(r => r.name === 'Arvin Parallel Wave' && ['pull_request', 'workflow_dispatch'].includes(r.event))
                .sort((a, b) => b.id - a.id)[0] || null;
            }

            async function latestHeavyRun(name, headSha) {
              const runs = await runsForHead(headSha);
              return runs
                .filter(r => r.name === name && ['pull_request', 'workflow_dispatch'].includes(r.event))
                .sort((a, b) => b.id - a.id)[0] || null;
            }

            async function reportFailure(run) {
              if (run?.status !== 'completed' || !['failure', 'timed_out'].includes(run?.conclusion)) {
                return false;
              }
              if (!run.head_sha) {
                core.warning(`${run.name}: actionable failure has no exact head SHA; feedback dispatch skipped.`);
                return false;
              }
              core.info(`${run.name}: explicitly dispatching deterministic Production Loop feedback for ${run.head_sha}.`);
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'arvin-production-loop.yml',
                ref: 'main',
                inputs: {
                  failure_workflow: String(run.name || 'Unknown Gate'),
                  failure_run_url: String(run.html_url || ''),
                  failure_head_sha: String(run.head_sha),
                  failure_conclusion: String(run.conclusion),
                },
              });
              return true;
            }

            function runBaseSha(run, prNumber) {
              const pr = (run?.pull_requests || []).find(p => p.number === prNumber);
              return pr?.base?.sha || null;
            }

            async function headContainsCurrentMain(headSha) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${mainSha}...${headSha}`,
              });
              return comparison.data.merge_base_commit?.sha === mainSha;
            }

            async function fastGreenForCurrentMain(fast, item, headSha) {
              if (fast?.status !== 'completed' || fast?.conclusion !== 'success') return false;
              if (fast.event === 'pull_request') {
                return runBaseSha(fast, item.number) === mainSha;
              }
              if (fast.event === 'workflow_dispatch') {
                return headContainsCurrentMain(headSha);
              }
              return false;
            }

            async function waitForFast(item, headSha) {
              for (let attempt = 1; attempt <= 72; attempt++) {
                const fast = await latestFastRun(headSha);
                if (fast?.status === 'completed') return fast;
                if (attempt === 1 || attempt % 6 === 0) {
                  core.info(`#${item.number}: waiting for exact-head Fast (${attempt}/72).`);
                }
                await sleep(10000);
              }
              return latestFastRun(headSha);
            }

            async function dispatchHeavyIfNeeded(item, headSha) {
              if (item.head.repo?.full_name !== `${owner}/${repo}`) {
                core.warning(`#${item.number}: fork head cannot be dispatched safely; skip.`);
                return false;
              }
              const containsMain = await headContainsCurrentMain(headSha);
              if (!containsMain) {
                core.info(`#${item.number}: head does not contain current main; skip heavy dispatch.`);
                return false;
              }

              const [build, device] = await Promise.all([
                latestHeavyRun('Arvin Build', headSha),
                latestHeavyRun('Arvin Device Smoke', headSha),
              ]);

              const needsBuild = !build || (build.status === 'completed' && build.conclusion === 'skipped');
              const needsDevice = !device || (device.status === 'completed' && device.conclusion === 'skipped');
              let dispatched = false;

              if (needsBuild) {
                core.info(`#${item.number}: dispatching Arvin Build on exact head branch ${item.head.ref}.`);
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'build.yml', ref: item.head.ref,
                });
                dispatched = true;
              }
              if (needsDevice) {
                core.info(`#${item.number}: dispatching Arvin Device Smoke on exact head branch ${item.head.ref}.`);
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'device-smoke.yml', ref: item.head.ref,
                });
                dispatched = true;
              }
              return dispatched;
            }

            async function waitForHeavy(headSha, prNumber) {
              let lastBuild = null;
              let lastDevice = null;
              for (let attempt = 1; attempt <= 120; attempt++) {
                [lastBuild, lastDevice] = await Promise.all([
                  latestHeavyRun('Arvin Build', headSha),
                  latestHeavyRun('Arvin Device Smoke', headSha),
                ]);
                const settled =
                  lastBuild?.status === 'completed' &&
                  lastDevice?.status === 'completed';
                if (settled) return { build: lastBuild, device: lastDevice };
                if (attempt === 1 || attempt % 6 === 0) {
                  core.info(`#${prNumber}: waiting for exact-head Build + Device (${attempt}/120).`);
                }
                await sleep(10000);
              }
              return { build: lastBuild, device: lastDevice };
            }

            for (const pr of pulls) {
              const labels = new Set((pr.labels || []).map(l => l.name));
              if (!labels.has(AUTO_LABEL)) continue;

              const fresh = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              const item = fresh.data;
              if (item.state !== 'open' || item.base.ref !== 'main') continue;
              const headSha = item.head.sha;

              const containsMain = await headContainsCurrentMain(headSha);
              if (!containsMain) {
                core.info(`#${item.number}: head is stale against current main; skip.`);
                continue;
              }

              if (item.draft) {
                let fast = await latestFastRun(headSha);
                if (directWake && fast?.status !== 'completed') {
                  fast = await waitForFast(item, headSha);
                }
                if (await fastGreenForCurrentMain(fast, item, headSha)) {
                  core.info(`#${item.number}: Fast green on current main; marking ready.`);
                  await github.graphql(`
                    mutation($id: ID!) {
                      markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                        pullRequest { number isDraft }
                      }
                    }
                  `, { id: item.node_id });
                } else {
                  await reportFailure(fast);
                  core.info(`#${item.number}: draft waiting for current-main Fast gate.`);
                  continue;
                }
              }

              let [build, device] = await Promise.all([
                latestHeavyRun('Arvin Build', headSha),
                latestHeavyRun('Arvin Device Smoke', headSha),
              ]);

              const needsBuild = !build || (build.status === 'completed' && build.conclusion === 'skipped');
              const needsDevice = !device || (device.status === 'completed' && device.conclusion === 'skipped');
              if (needsBuild || needsDevice) {
                await dispatchHeavyIfNeeded(item, headSha);
              }

              const heavySettled =
                build?.status === 'completed' &&
                device?.status === 'completed' &&
                build?.conclusion !== 'skipped' &&
                device?.conclusion !== 'skipped';

              if (directWake && (!heavySettled || needsBuild || needsDevice)) {
                const waited = await waitForHeavy(headSha, item.number);
                build = waited.build;
                device = waited.device;
              } else if (!heavySettled || needsBuild || needsDevice) {
                core.info(`#${item.number}: heavy gates dispatched/in progress; next orchestrator event will re-evaluate.`);
                continue;
              }

              const heavyGreen =
                build?.status === 'completed' && build?.conclusion === 'success' &&
                device?.status === 'completed' && device?.conclusion === 'success';

              if (!heavyGreen) {
                await reportFailure(build);
                await reportFailure(device);
                core.info(`#${item.number}: Build + Device are not both green on exact head; no merge.`);
                continue;
              }

              const preMergeMain = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (preMergeMain.data.commit.sha !== mainSha) {
                core.warning(`#${item.number}: main moved during orchestrator run; skip merge.`);
                return;
              }

              const locked = await github.rest.pulls.get({ owner, repo, pull_number: item.number });
              if (locked.data.head.sha !== headSha || locked.data.state !== 'open' || locked.data.draft) {
                core.warning(`#${item.number}: PR changed during validation; skip merge.`);
                continue;
              }
              if (locked.data.mergeable !== true) {
                core.info(`#${item.number}: not currently mergeable; skip.`);
                continue;
              }

              core.info(`#${item.number}: exact-head Fast/Build/Device gates green on current main; squash merging.`);
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: item.number,
                merge_method: 'squash',
                sha: headSha,
              });

              return;
            }
