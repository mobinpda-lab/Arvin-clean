name: Arvin Production Orchestrator

on:
  workflow_run:
    workflows: ['Arvin Parallel Wave', 'Arvin Build', 'Arvin Device Smoke']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

concurrency:
  group: arvin-production-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Guarded promote and merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const AUTO_LABEL = 'arvin-auto';

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = main.data.commit.sha;
            core.info(`Current main: ${mainSha}`);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });

            async function latestRun(name, headSha) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, event: 'pull_request', head_sha: headSha, per_page: 100,
              });
              return runs
                .filter(r => r.name === name)
                .sort((a, b) => b.id - a.id)[0] || null;
            }

            function runBaseSha(run, prNumber) {
              const pr = (run?.pull_requests || []).find(p => p.number === prNumber);
              return pr?.base?.sha || null;
            }

            for (const pr of pulls) {
              const labels = new Set((pr.labels || []).map(l => l.name));
              if (!labels.has(AUTO_LABEL)) continue;

              const fresh = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              const item = fresh.data;
              if (item.state !== 'open' || item.base.ref !== 'main') continue;
              const headSha = item.head.sha;

              if (item.draft) {
                const fast = await latestRun('Arvin Parallel Wave', headSha);
                const fastBase = runBaseSha(fast, item.number);
                if (fast?.status === 'completed' && fast?.conclusion === 'success' && fastBase === mainSha) {
                  core.info(`#${item.number}: Fast green on current main; marking ready.`);
                  await github.graphql(`
                    mutation($id: ID!) {
                      markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                        pullRequest { number isDraft }
                      }
                    }
                  `, { id: item.node_id });
                } else {
                  core.info(`#${item.number}: draft waiting for current-main Fast gate.`);
                }
                continue;
              }

              const [build, device] = await Promise.all([
                latestRun('Arvin Build', headSha),
                latestRun('Arvin Device Smoke', headSha),
              ]);
              const buildBase = runBaseSha(build, item.number);
              const deviceBase = runBaseSha(device, item.number);
              const heavyGreen =
                build?.status === 'completed' && build?.conclusion === 'success' &&
                device?.status === 'completed' && device?.conclusion === 'success';
              const currentMainValidated = buildBase === mainSha && deviceBase === mainSha;

              if (!heavyGreen || !currentMainValidated) {
                core.info(`#${item.number}: ready but waiting for Build + Device on current main.`);
                continue;
              }

              const preMergeMain = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (preMergeMain.data.commit.sha !== mainSha) {
                core.warning(`#${item.number}: main moved during orchestrator run; skip merge.`);
                return;
              }

              const locked = await github.rest.pulls.get({ owner, repo, pull_number: item.number });
              if (locked.data.head.sha !== headSha || locked.data.state !== 'open' || locked.data.draft) {
                core.warning(`#${item.number}: PR changed during validation; skip merge.`);
                continue;
              }
              if (locked.data.mergeable !== true) {
                core.info(`#${item.number}: not currently mergeable; skip.`);
                continue;
              }

              core.info(`#${item.number}: exact-head heavy gates green on current main; squash merging.`);
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: item.number,
                merge_method: 'squash',
                sha: headSha,
              });

              return;
            }
