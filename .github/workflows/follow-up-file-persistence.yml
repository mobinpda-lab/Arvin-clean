name: Arvin Follow-up File Persistence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arvin-follow-up-file-persistence-${{ github.event.pull_request.number || inputs.target_sha || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  follow-up-file-persistence:
    name: Follow-up file-backed SQLite persistence (no APK build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}

      - name: Verify checkout SHA
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "LOCAL_EXECUTION_ID=github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CHECKOUT_SHA=$actual"
          test -n "$TARGET_SHA"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"

      - name: Cache pinned VazirHarf
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vazirharf
          key: arvin-vazirharf-${{ runner.os }}-3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8

      - name: Fetch pinned VazirHarf on cache miss
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/vazirharf/.git" ]; then
            git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
            git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
            git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          fi
          test "$(git -C "$RUNNER_TEMP/vazirharf" rev-parse HEAD)" = "3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8"
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"

      - name: Restore pinned font assets required by Flutter test asset bundling
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          rm -rf assets/fonts/vazirharf
          cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
          test -s assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf

      - name: Install Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter version and revision
        run: |
          set -euo pipefail
          flutter --version
          git rev-parse HEAD

      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: arvin-follow-up-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            arvin-follow-up-pub-${{ runner.os }}-

      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Run only the file-backed Repository test
        run: flutter test test/follow_up_repository_file_persistence_test.dart
