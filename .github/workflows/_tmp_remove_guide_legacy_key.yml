name: temporary-remove-guide-legacy-key
on:
  push:
    branches: [feat/home-visual-integration-2026-09-07]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete quick-capture guide target
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          import_line = "import 'quick_capture_dialog.dart';\n"
          field = "  final GlobalKey _quickCaptureGuideKey =\n      GlobalKey(debugLabel: 'home-guide-quick-capture');\n"
          if s.count(import_line) != 1: raise SystemExit('quick capture import mismatch')
          if s.count(field) != 1: raise SystemExit('quick capture guide key mismatch')
          s = s.replace(import_line, '')
          s = s.replace(field, '')
          p.write_text(s)
      - name: Commit cleanup
        run: |
          git config user.name 'arvin-factory-bot'
          git config user.email 'arvin-factory-bot@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix(home): remove obsolete guide target'
          git push
