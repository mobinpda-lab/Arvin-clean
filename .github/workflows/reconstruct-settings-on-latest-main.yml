name: Reconstruct Settings On Latest Main

on:
  push:
    branches:
      - feat/issue-231-settings

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore tested Settings vertical slice
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=9bfc90a58aed66318cef4e26cd8c32342e14a6ca
          files=(
            docs/CANONICAL_APP_SETTINGS_2026-08-26.md
            lib/services/app_settings_service.dart
            lib/services/persian_date_formatter.dart
            lib/settings_page.dart
            test/home_settings_integration_test.dart
            test/services/app_settings_service_test.dart
            test/services/persian_date_formatter_test.dart
            test/settings_page_test.dart
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "$SOURCE_SHA:$file" > "$file"
          done
          git show "$SOURCE_SHA:lib/main.dart" > lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = '        tasks = value;'
          new = '        tasks = List<Task>.of(value);'
          if old not in s:
              raise SystemExit('expected mutable-list reconstruction anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/reconstruct-settings-on-latest-main.yml
      - name: Commit reconstructed feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CANONICAL_APP_SETTINGS_2026-08-26.md lib/main.dart lib/services/app_settings_service.dart lib/services/persian_date_formatter.dart lib/settings_page.dart test/home_settings_integration_test.dart test/services/app_settings_service_test.dart test/services/persian_date_formatter_test.dart test/settings_page_test.dart
          git diff --cached --check
          git commit -m 'feat(settings): reconstruct canonical settings on latest main'
          git push origin HEAD:feat/issue-231-settings
