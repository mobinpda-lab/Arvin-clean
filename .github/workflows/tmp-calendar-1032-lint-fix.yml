name: Temporary Calendar 1032 Lint Fix

on:
  push:
    branches:
      - fix/calendar-runtime-1032-deterministic

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Fix strict flow-control lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          replacements = {
          """          if (filter == 'بایگانی' && (!task.archived || task.trashed))\n            return false;\n""": """          if (filter == 'بایگانی' && (!task.archived || task.trashed)) {\n            return false;\n          }\n""",
          """          if (matchingIds != null && !matchingIds.contains(task.id))\n            return false;\n""": """          if (matchingIds != null && !matchingIds.contains(task.id)) {\n            return false;\n          }\n""",
          """    if (_dueScope == TaskDueScope.overdue)\n      return 'کار عقب‌افتاده‌ای وجود ندارد';\n""": """    if (_dueScope == TaskDueScope.overdue) {\n      return 'کار عقب‌افتاده‌ای وجود ندارد';\n    }\n""",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source block: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          dart format lib/main.dart
      - name: Prepare pinned VazirHarf
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf
      - name: Validate
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test test/calendar_page_test.dart test/calendar_runtime_actions_fast_track_test.dart
      - name: Commit lint fix and remove temporary workflow
        run: |
          git config user.name "arvin-deterministic-worker[bot]"
          git config user.email "arvin-deterministic-worker[bot]@users.noreply.github.com"
          git restore analysis_options.yaml pubspec.lock || true
          rm -rf assets/fonts/vazirharf .dart_tool build .flutter-plugins-dependencies
          rm -f .github/workflows/tmp-calendar-1032-lint-fix.yml
          git add lib/main.dart .github/workflows/tmp-calendar-1032-lint-fix.yml
          git commit -m "fix(calendar): satisfy strict analyze on runtime branch (#1032)"
          git push origin HEAD:fix/calendar-runtime-1032-deterministic
