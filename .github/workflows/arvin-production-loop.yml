name: ARVIN Production Loop

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Arvin Build", "Arvin Device Smoke", "Arvin Parallel Wave"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue to route through the production queue'
        required: false
        type: string
      failure_workflow:
        description: 'Optional failed gate workflow name'
        required: false
        type: string
      failure_run_url:
        description: 'Optional failed gate run URL'
        required: false
        type: string
      failure_head_sha:
        description: 'Optional failed gate exact head SHA'
        required: false
        type: string
      failure_conclusion:
        description: 'Optional failed gate conclusion'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: arvin-production-loop-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id || inputs.failure_head_sha || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  analyze-and-queue:
    if: ${{ github.event_name == 'issues' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.issue_number != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Analyze task and build queue record
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue?.number || Number(context.payload.inputs?.issue_number || 0);
            if (!issueNumber) {
              if (context.payload.pull_request) {
                core.info(`PR #${context.payload.pull_request.number} synchronized; queue remains PR-bound.`);
                return;
              }
              core.setFailed('An issue number is required for queue routing.');
              return;
            }

            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const title = issue.data.title.toLowerCase();

            // Route by the issue's declared purpose, not acceptance/test words
            // embedded in a product issue body. This prevents feature issues
            // from being misclassified merely because their DoD mentions CI.
            let route = 'feature';
            if (/(bug|fix|fail|error|crash|regression)/.test(title)) route = 'bugfix';
            else if (/(^|[\s:(])(test|ci|quality|coverage)([\s):]|$)/.test(title)) route = 'test';
            else if (/(doc|documentation|readme|guide)/.test(title)) route = 'documentation';
            else if (/(core|architecture|foundation|database|storage|sync)/.test(title)) route = 'core';

            const workers = {
              core: ['core-worker', 'test-worker'],
              feature: ['code-worker', 'test-worker'],
              bugfix: ['code-worker', 'test-worker'],
              test: ['test-worker'],
              documentation: ['documentation-worker', 'test-worker'],
            }[route];

            const marker = '<!-- arvin-production-queue -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            if (!comments.some(c => c.body?.includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `${marker}\n\n### ARVIN Production Queue\n\n**Route:** ${route}\n\n**Workers:** ${workers.join(' → ')}\n\n**Policy:** maximum parallel development, current-main validation, exact-head CI, guarded promotion.\n\n**State:** queued. Worker execution must produce traceable PR/head evidence; no automatic merge is permitted from an issue alone.`
              });
            }

            if (['feature', 'bugfix', 'core'].includes(route)) {
              const labels = ['factory:ready'];
              if (route === 'core') labels.push('priority:core');
              else labels.push('priority:feature');
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels });

              const handoffMarker = '<!-- arvin-autonomous-queue-handoff -->';
              if (!comments.some(c => c.body?.includes(handoffMarker))) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `${handoffMarker}\n\nActionable ${route} work was reconciled into the canonical autonomous queue. AI worker dispatch is owned only by ARVIN Autonomous Task Queue so provider concurrency, stale leases, and duplicate dispatch are controlled centrally.`
                });
              }

              // Label writes made with GITHUB_TOKEN do not reliably recurse into another
              // workflow, so wake the queue explicitly instead of dispatching an AI worker here.
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'arvin-autonomous-queue.yml', ref: 'main',
              });
              core.info(`Issue #${issueNumber} handed to the canonical autonomous queue.`);
            }

            if (route === 'test') {
              const dispatchMarker = '<!-- arvin-test-worker-dispatch -->';
              const branch = `test/issue-${issueNumber}`;
              const openPrs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100,
              });
              const alreadyDispatched = comments.some(c => c.body?.includes(dispatchMarker));
              if (!alreadyDispatched && openPrs.length === 0) {
                let dispatched = false;
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner,
                    repo,
                    workflow_id: 'arvin-test-worker.yml',
                    ref: 'main',
                    inputs: { issue_number: String(issueNumber) },
                  });
                  dispatched = true;
                } catch (error) {
                  if (error?.status !== 422) throw error;
                  core.warning(`Issue #${issueNumber}: Test Worker dispatch returned HTTP 422. Leaving only the test-worker gate unverified; unrelated production routing continues.`);
                }
                if (dispatched) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issueNumber,
                    body: `${dispatchMarker}\n\n### ARVIN Test Worker\n\nTest Worker dispatched for issue #${issueNumber}. The worker must create an isolated evidence branch and Draft PR; promotion remains owned by the canonical production gates.`
                  });
                  core.info(`Test Worker dispatched for issue #${issueNumber}.`);
                }
              } else {
                core.info(`Test Worker already dispatched or PR exists for issue #${issueNumber}; no duplicate launch.`);
              }
            }

            core.info(`Issue #${issueNumber} routed to ${route}: ${workers.join(', ')}`);

  feedback-loop:
    if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.failure_head_sha != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate completed worker gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventRun = context.payload.workflow_run;
            const inputs = context.payload.inputs || {};

            const conclusion = eventRun?.conclusion || inputs.failure_conclusion || 'unknown';
            const name = eventRun?.name || inputs.failure_workflow || 'Unknown Gate';
            const headSha = eventRun?.head_sha || inputs.failure_head_sha || '';
            const runUrl = eventRun?.html_url || inputs.failure_run_url || '';

            core.info(`${name} completed with ${conclusion} at ${headSha || 'unknown-head'}`);

            if (conclusion === 'success') {
              core.info('Gate passed; existing Production Orchestrator remains responsible for promotion.');
              return;
            }

            if (conclusion === 'cancelled') {
              core.info('Cancelled gate is treated as protective/stale execution noise; no Auto-Fix task is created.');
              return;
            }

            if (!['failure', 'timed_out'].includes(conclusion)) {
              core.info(`Conclusion ${conclusion} is not actionable for bounded auto-fix.`);
              return;
            }

            if (!headSha) {
              core.setFailed('Actionable failure feedback requires an exact head SHA.');
              return;
            }

            const marker = '<!-- arvin-auto-fix-task -->';
            const title = `[AUTO-FIX] ${name} failed at ${headSha.slice(0, 12)}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'arvin-auto',
              per_page: 100,
            });
            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              core.info(`Auto-Fix already exists as #${duplicate.number}; no duplicate created.`);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              labels: ['arvin-auto'],
              body: `${marker}\n\nAutomated failure feedback.\n\n- Workflow: ${name}\n- Run: ${runUrl}\n- Head SHA: ${headSha}\n- Conclusion: ${conclusion}\n\nRoute this issue to the bounded AI Code Worker. Do not bypass Fast/Build/Device or exact-head promotion gates.`
            });

            // GITHUB_TOKEN-created issues do not reliably recurse into issue-triggered
            // workflows. Wake the canonical queue explicitly, but never dispatch the AI
            // worker from this feedback loop; the queue owns provider concurrency and leases.
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'arvin-autonomous-queue.yml',
              ref: 'main',
            });
            core.info(`Failure converted into Auto-Fix #${created.data.number} and handed to the canonical autonomous queue.`);
