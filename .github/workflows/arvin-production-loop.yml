name: ARVIN Production Loop

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue to route through the production queue'
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: arvin-production-loop-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze-and-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze task and build queue record
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue?.number || Number(context.payload.inputs?.issue_number);
            if (!issueNumber) core.setFailed('An issue number is required.');

            const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const text = `${issue.data.title}\n${issue.data.body || ''}`.toLowerCase();

            let route = 'feature';
            if (/(bug|fix|fail|error|crash|regression)/.test(text)) route = 'bugfix';
            else if (/(test|ci|quality|coverage)/.test(text)) route = 'test';
            else if (/(doc|documentation|readme|guide)/.test(text)) route = 'documentation';
            else if (/(core|architecture|foundation|database|storage|sync)/.test(text)) route = 'core';

            const workers = {
              core: ['core-worker', 'test-worker'],
              feature: ['code-worker', 'test-worker'],
              bugfix: ['code-worker', 'test-worker'],
              test: ['test-worker'],
              documentation: ['documentation-worker', 'test-worker'],
            }[route];

            const marker = '<!-- arvin-production-queue -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            if (!comments.some(c => c.body?.includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `${marker}\n\n### ARVIN Production Queue\n\n**Route:** ${route}\n\n**Workers:** ${workers.join(' → ')}\n\n**Policy:** maximum parallel development, current-main validation, exact-head CI, guarded promotion.\n\n**State:** queued — no automatic merge is permitted from an issue alone. A PR must pass the existing Fast + Build + Device gates before the Production Orchestrator can promote it.`
              });
            }

            core.info(`Issue #${issueNumber} routed to ${route}: ${workers.join(', ')}`);
