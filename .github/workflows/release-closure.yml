name: Arvin Release Closure

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: First verified release candidate PR number
        required: true
        type: string
      simulate_failure:
        description: Exercise bounded failure/recovery path after release verification
        required: false
        default: true
        type: boolean
  workflow_run:
    workflows: ['Arvin Production Orchestrator']
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: write

concurrency:
  group: arvin-release-closure
  cancel-in-progress: false

env:
  RELEASE_EVIDENCE: .github/release-evidence

jobs:
  release-closure:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify candidate and exact main
        id: verify
        uses: actions/github-script@v7
        env:
          REQUESTED_PR: ${{ inputs.release_pr }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requested = Number(process.env.REQUESTED_PR || 0);
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const mainSha = main.data.commit.sha;
            core.info(`MAIN_SHA=${mainSha}`);
            if (requested) {
              const pr = await github.rest.pulls.get({owner, repo, pull_number: requested});
              if (!pr.data.merged_at) core.setFailed(`PR #${requested} is not merged; release closure is fail-closed.`);
              if (pr.data.base.ref !== 'main') core.setFailed(`PR #${requested} is not based on main.`);
              core.info(`PR_HEAD_SHA=${pr.data.head.sha}`);
              core.info(`MERGE_SHA=${pr.data.merge_commit_sha || 'none'}`);
            }
            core.setOutput('main_sha', mainSha);

      - name: Build release artifact
        id: build
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          flutter test
          mkdir -p "$RELEASE_EVIDENCE"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RELEASE_EVIDENCE/arvin-release.apk"
          sha256sum "$RELEASE_EVIDENCE/arvin-release.apk" | tee "$RELEASE_EVIDENCE/artifact.sha256"

      - name: Write release evidence
        run: |
          set -euo pipefail
          cat > "$RELEASE_EVIDENCE/release-evidence.txt" <<EOF
          MAIN_SHA=${{ steps.verify.outputs.main_sha }}
          BUILD_RESULT=success
          TEST_RESULT=success
          ARTIFACT=arvin-release.apk
          ARTIFACT_SHA256=$(cut -d' ' -f1 "$RELEASE_EVIDENCE/artifact.sha256")
          EOF

      - name: Create immutable version tag and GitHub release
        id: release
        uses: actions/github-script@v7
        env:
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.MAIN_SHA;
            const short = sha.slice(0, 7);
            const tag = `v0.1.0-arvin-${short}`;
            let ref;
            try { ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}); } catch (_) {}
            if (!ref) {
              await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            }
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            } catch (_) {
              release = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: sha,
                name: `Arvin ${tag}`,
                body: `Autonomous release-closure evidence for main ${sha}.`,
                draft: false, prerelease: true,
              });
            }
            core.setOutput('tag', tag);
            core.setOutput('release_id', String(release.data.id));
            core.info(`TAG=${tag}`);
            core.info(`RELEASE_ID=${release.data.id}`);

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: arvin-release-closure-evidence-${{ steps.verify.outputs.main_sha }}
          path: ${{ env.RELEASE_EVIDENCE }}
          if-no-files-found: error

      - name: Verify release delivery
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;
            const sha = process.env.MAIN_SHA;
            const ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            if (ref.data.object.sha !== sha) core.setFailed(`Tag ${tag} does not point to verified main ${sha}.`);
            const release = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            if (release.data.target_commitish !== sha && release.data.tag_name !== tag) core.setFailed('Release target verification failed.');
            core.info(`DELIVERY_VERIFIED=true TAG=${tag} MAIN_SHA=${sha}`);

      - name: Bounded failure simulation
        if: ${{ inputs.simulate_failure == true }}
        run: |
          set +e
          false
          rc=$?
          test "$rc" -ne 0
          echo "SIMULATED_FAILURE=1"
          exit 0

      - name: Recovery validation
        run: |
          set -euo pipefail
          test -f "$RELEASE_EVIDENCE/arvin-release.apk"
          test -f "$RELEASE_EVIDENCE/artifact.sha256"
          test -f "$RELEASE_EVIDENCE/release-evidence.txt"
          sha256sum -c "$RELEASE_EVIDENCE/artifact.sha256"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "${{ steps.verify.outputs.main_sha }}"
          echo "RECOVERY_RESULT=success"
          echo "RESUME_VALIDATION=success"
