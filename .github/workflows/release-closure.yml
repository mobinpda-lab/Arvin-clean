name: Arvin Release Closure

on:
  workflow_run:
    workflows: ['Arvin Device Smoke']
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA to sign and validate; must match the current trusted main tip'
        required: false
        type: string

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: arvin-release-closure
  cancel-in-progress: false

env:
  RELEASE_EVIDENCE: .github/release-evidence
  FLUTTER_VERSION: '3.47.0'

jobs:
  release-closure:
    # Only successful Device Smoke for pushed main may auto-start release closure.
    # PR smoke and PR workflow_run chains must not create duplicate main release builds.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch pinned VazirHarf
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Bold.ttf"
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/

      - name: Detect pending release
        id: release_state
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const sha = main.data.commit.sha;
            const fs = require('fs');
            const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
            const versionMatch = pubspec.match(/^version:\s*([^\s]+)\s*$/m);
            if (!versionMatch) core.setFailed('pubspec.yaml version not found.');
            const version = versionMatch[1];
            const [appVersion, buildNumber] = version.split('+');
            if (!appVersion || !buildNumber) core.setFailed(`Invalid semantic Flutter version: ${version}`);
            const tag = `v${appVersion}-build${buildNumber}-arvin-${sha.slice(0,7)}`;
            let complete = false;
            try {
              const rel = await github.rest.repos.getReleaseByTag({owner, repo, tag});
              const assets = await github.rest.repos.listReleaseAssets({owner, repo, release_id: rel.data.id});
              const names = new Set(assets.data.map(a => a.name));
              complete = [`arvin-${appVersion}-build${buildNumber}.apk`,'artifact.sha256','release-evidence.txt'].every(n => names.has(n));
            } catch (_) {}
            core.setOutput('already_released', complete ? 'true' : 'false');
            core.setOutput('app_version', version);
            core.setOutput('build_number', buildNumber);
            core.info(`MAIN_SHA=${sha}`);
            core.info(`RELEASE_TAG=${tag}`);
            core.info(`ALREADY_RELEASED=${complete}`);

      - name: Validate candidate and exact main
        if: steps.release_state.outputs.already_released != 'true'
        id: verify
        uses: actions/github-script@v7
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
          DEVICE_SMOKE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const main = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main'
            });

            const sha = main.data.commit.sha;

            if (context.eventName === 'workflow_dispatch') {
              if (!process.env.REQUESTED_TARGET_SHA) {
                throw new Error('Exact target SHA is required for a manual official signing run.');
              }
              if (process.env.REQUESTED_TARGET_SHA !== sha) {
                throw new Error(`Requested target SHA ${process.env.REQUESTED_TARGET_SHA} does not match trusted main SHA ${sha}.`);
              }
            } else if (process.env.DEVICE_SMOKE_SHA !== sha) {
              throw new Error(`Device Smoke SHA ${process.env.DEVICE_SMOKE_SHA} does not match current main SHA ${sha}; refusing to sign stale/unvalidated source.`);
            }

            const pulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'closed',
                base: 'main',
                per_page: 100,
                sort: 'updated',
                direction: 'desc'
              }
            );

            const candidates = pulls
              .filter(pr => pr.merged_at)
              .filter(pr =>
                (pr.labels || []).some(
                  label => label.name === 'arvin-auto'
                )
              )
              .sort(
                (a,b) =>
                  new Date(b.merged_at) -
                  new Date(a.merged_at)
              );

            let selected = null;

            for (const pr of candidates) {
              if (!pr.merge_commit_sha) continue;

              const comparison =
                await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: pr.merge_commit_sha,
                  head: sha
                });

              if (
                ['ahead','identical']
                .includes(comparison.data.status)
              ) {
                selected = {
                  pr,
                  comparison
                };
                break;
              }
            }

            if (!selected) {
              core.warning(
                `No merged arvin-auto PR found. Falling back to exact main SHA ${sha}.`
              );

              core.setOutput(
                'candidate_pr',
                'main'
              );

              core.setOutput(
                'main_sha',
                sha
              );

              core.setOutput(
                'commit_sha',
                sha
              );

              core.setOutput(
                'merge_sha',
                sha
              );

              core.info(
                `CANDIDATE_PR=main`
              );

              core.info(
                `COMMIT_SHA=${sha}`
              );

              core.info(
                `MERGE_SHA=${sha}`
              );

              core.info(
                `MAIN_SHA=${sha}`
              );

              core.info(
                `CANDIDATE_MAIN_RELATION=identical`
              );

              return;
            }

            const pr = selected.pr;
            const comparison = selected.comparison;

            core.setOutput(
              'candidate_pr',
              String(pr.number)
            );

            core.setOutput(
              'main_sha',
              sha
            );

            core.setOutput(
              'commit_sha',
              pr.head.sha
            );

            core.setOutput(
              'merge_sha',
              pr.merge_commit_sha
            );

            core.info(
              `CANDIDATE_PR=${pr.number}`
            );

            core.info(
              `COMMIT_SHA=${pr.head.sha}`
            );

            core.info(
              `MERGE_SHA=${pr.merge_commit_sha}`
            );

            core.info(
              `MAIN_SHA=${sha}`
            );

            core.info(
              `CANDIDATE_MAIN_RELATION=${comparison.data.status}`
            );
      - name: Verify exact checked-out revision
        if: steps.release_state.outputs.already_released != 'true'
        env:
          TARGET_SHA: ${{ steps.verify.outputs.main_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test -n "$TARGET_SHA"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"
          echo "REQUESTED_TARGET_SHA=$TARGET_SHA"
          echo "SOURCE_BRANCH=$GITHUB_REF_NAME"
          echo "WORKFLOW_EVENT=$GITHUB_EVENT_NAME"
          echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
          echo "WORKFLOW_JOB_ID=$GITHUB_JOB"

      - name: Setup exact Flutter
        if: steps.release_state.outputs.already_released != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify repository-owned release inputs
        if: steps.release_state.outputs.already_released != 'true'
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/settings.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application.*9.1.0' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.0' android/settings.gradle.kts
          grep -q 'VERSION_17' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts

      - name: Restore VazirHarf assets
        if: steps.release_state.outputs.already_released != 'true'
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          rm -rf assets/fonts/vazirharf
          cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
          test -s assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf
          test -s assets/fonts/vazirharf/fonts/ttf/Vazirharf-Bold.ttf

      - name: Android V2 audit
        if: steps.release_state.outputs.already_released != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app/src/main')
          activities = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if not activities:
              raise SystemExit('MainActivity.kt/java not found in repository-owned Android platform')
          text = activities[0].read_text(encoding='utf-8')
          if 'FlutterActivity' not in text:
              raise SystemExit('MainActivity does not use FlutterActivity')
          forbidden = ('io.flutter.app.', 'PluginRegistry.Registrar')
          for candidate in root.rglob('*'):
              if candidate.is_file():
                  content = candidate.read_text(encoding='utf-8', errors='ignore')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(f'deleted Android v1 embedding reference: {token} in {candidate}')
          print(f'Android V2 audit passed: {activities[0]}')
          PY

      - name: Decode authorized production keystore
        if: steps.release_state.outputs.already_released != 'true'
        env:
          ARVIN_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARVIN_RELEASE_KEYSTORE_BASE64 }}
          ARVIN_RELEASE_STORE_PASSWORD: ${{ secrets.ARVIN_RELEASE_STORE_PASSWORD }}
          ARVIN_RELEASE_KEY_ALIAS: ${{ secrets.ARVIN_RELEASE_KEY_ALIAS }}
          ARVIN_RELEASE_KEY_PASSWORD: ${{ secrets.ARVIN_RELEASE_KEY_PASSWORD }}
          ARVIN_RELEASE_CERT_SHA256: ${{ secrets.ARVIN_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ARVIN_RELEASE_KEYSTORE_BASE64:-}" ]; then echo "Required secret missing: ARVIN_RELEASE_KEYSTORE_BASE64"; exit 1; fi
          if [ -z "${ARVIN_RELEASE_STORE_PASSWORD:-}" ]; then echo "Required secret missing: ARVIN_RELEASE_STORE_PASSWORD"; exit 1; fi
          if [ -z "${ARVIN_RELEASE_KEY_ALIAS:-}" ]; then echo "Required secret missing: ARVIN_RELEASE_KEY_ALIAS"; exit 1; fi
          if [ -z "${ARVIN_RELEASE_KEY_PASSWORD:-}" ]; then echo "Required secret missing: ARVIN_RELEASE_KEY_PASSWORD"; exit 1; fi
          if [ -z "${ARVIN_RELEASE_CERT_SHA256:-}" ]; then echo "Required secret missing: ARVIN_RELEASE_CERT_SHA256"; exit 1; fi
          key_file="$RUNNER_TEMP/arvin-release-keystore.jks"
          umask 077
          printf '%s' "$ARVIN_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          test -s "$key_file"
          echo "KEYSTORE_DECODE=PASS (contents withheld)"

      - name: Test and build production-signed APK from locked inputs
        if: steps.release_state.outputs.already_released != 'true'
        env:
          ARVIN_OFFICIAL_RELEASE: 'true'
          ARVIN_RELEASE_STORE_FILE: ${{ runner.temp }}/arvin-release-keystore.jks
          ARVIN_RELEASE_STORE_PASSWORD: ${{ secrets.ARVIN_RELEASE_STORE_PASSWORD }}
          ARVIN_RELEASE_KEY_ALIAS: ${{ secrets.ARVIN_RELEASE_KEY_ALIAS }}
          ARVIN_RELEASE_KEY_PASSWORD: ${{ secrets.ARVIN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter analyze
          flutter test
          flutter build apk --release -t lib/main.dart
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify v2/v3 signatures and independently authorized certificate
        if: steps.release_state.outputs.already_released != 'true'
        env:
          ARVIN_RELEASE_CERT_SHA256: ${{ secrets.ARVIN_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          verify_log="$RUNNER_TEMP/apksigner-verify.txt"
          "$apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee "$verify_log"
          grep -Eiq '^Verified using v2 scheme .*: true
      - name: Store release evidence
        if: steps.release_state.outputs.already_released != 'true'
        env:
          CANDIDATE_PR: ${{ steps.verify.outputs.candidate_pr }}
        run: |
          cat > "$RELEASE_EVIDENCE/release-evidence.txt" <<EOF
          PR_NUMBER=${CANDIDATE_PR}
          COMMIT_SHA=${{ steps.verify.outputs.commit_sha }}
          MERGE_SHA=${{ steps.verify.outputs.merge_sha }}
          MAIN_SHA=${{ steps.verify.outputs.main_sha }}
          FLUTTER_VERSION=${FLUTTER_VERSION}
          GRADLE_VERSION=9.3.1
          AGP_VERSION=9.1.0
          KOTLIN_VERSION=2.4.0
          JAVA_VERSION=17
          LOCKFILE=pubspec.lock
          BUILD_RESULT=success
          TEST_RESULT=success
          RELEASE_ARTIFACT=arvin-${{ steps.release_state.outputs.app_version }}-build${{ steps.release_state.outputs.build_number }}.apk
          ARTIFACT_SHA256=$(cut -d' ' -f1 "$RELEASE_EVIDENCE/artifact.sha256")
          CERTIFICATE_SHA256=$ARVIN_VERIFIED_CERT_SHA256
          APK_SIGNATURE_V2=$ARVIN_APK_V2_VERIFIED
          APK_SIGNATURE_V3=$ARVIN_APK_V3_VERIFIED
          CERTIFICATE_FINGERPRINT_MATCH=PASS
          APP_VERSION=${{ steps.release_state.outputs.app_version }}
          BUILD_NUMBER=${{ steps.release_state.outputs.build_number }}
          EOF


      - name: Upload internal Release APK artifact
        if: steps.release_state.outputs.already_released != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arvin-internal-build-${{ steps.verify.outputs.main_sha }}
          path: |
            .github/release-evidence/*.apk
            .github/release-evidence/artifact.sha256
            .github/release-evidence/release-evidence.txt
          if-no-files-found: error

      - name: Require explicit product release approval
        if: steps.release_state.outputs.already_released != 'true'
        id: product_gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // A green build is not product acceptance. Publication stays blocked
            // until the existing release gate and the known regression lane are closed.
            // Hide already-published Arvin prereleases while blocked; preserve their
            // tags/assets so this containment is reversible rather than destructive.
            async function hideUnapprovedPrereleases() {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100
              });
              for (const release of releases) {
                if (release.draft || !release.prerelease || !release.tag_name.includes('-arvin-')) {
                  continue;
                }
                try {
                  await github.rest.repos.updateRelease({
                    owner,
                    repo,
                    release_id: release.id,
                    draft: true,
                    body: `${release.body || ''}\n\n**UNAPPROVED — NOT A RELEASE CANDIDATE.** Product release gate #2102 and regression lane #1901 must both be closed after acceptance before publication.`
                  });
                  core.warning(`HIDDEN_UNAPPROVED_PRERELEASE=${release.tag_name}`);
                } catch (error) {
                  core.warning(`FAILED_TO_HIDE_UNAPPROVED_PRERELEASE=${release.tag_name}: ${error.message}`);
                }
              }
            }

            const gate = await github.rest.issues.get({
              owner,
              repo,
              issue_number: 2102
            });
            if (gate.data.state !== 'closed') {
              await hideUnapprovedPrereleases();
              core.setFailed('RELEASE BLOCKED: issue #2102 must be closed only after exact-main CI, device evidence, and product acceptance are complete.');
              return;
            }

            const regression = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: 1901
            });
            if (regression.data.state !== 'closed') {
              await hideUnapprovedPrereleases();
              core.setFailed('RELEASE BLOCKED: existing P0/P1 regression PR #1901 is still open; reconcile/resolve its findings before publishing.');
              return;
            }

            core.info('PRODUCT_RELEASE_GATE=approved');
            core.info('RELEASE_GATE_ISSUE=2102:closed');
            core.info('REGRESSION_LANE_PR=1901:closed');

      - name: Create exact-head tag and prerelease
        if: steps.release_state.outputs.already_released != 'true'
        id: release
        uses: actions/github-script@v7
        env:
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
          PR_NUMBER: ${{ steps.verify.outputs.candidate_pr }}
          APP_VERSION: ${{ steps.release_state.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.release_state.outputs.build_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.MAIN_SHA;
            const appVersion = process.env.APP_VERSION.split('+')[0];
            const buildNumber = process.env.BUILD_NUMBER;
            const tag = `v${appVersion}-build${buildNumber}-arvin-${sha.slice(0,7)}`;
            try { await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}); }
            catch (_) { await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha}); }
            let rel;
            try { rel = await github.rest.repos.getReleaseByTag({owner, repo, tag}); }
            catch (_) { rel = await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sha, name: `Arvin ${process.env.APP_VERSION} (build ${process.env.BUILD_NUMBER})`, body: `Autonomous release closure for PR #${process.env.PR_NUMBER}; verified main ${sha}.`, draft: false, prerelease: true}); }
            core.setOutput('tag', tag);
            core.setOutput('release_id', String(rel.data.id));
            core.info(`TAG=${tag}`);

      - name: Upload release assets
        if: steps.release_state.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RELEASE_EVIDENCE/arvin-${{ steps.release_state.outputs.app_version }}-build${{ steps.release_state.outputs.build_number }}.apk" "$RELEASE_EVIDENCE/artifact.sha256" "$RELEASE_EVIDENCE/release-evidence.txt" --clobber

      - name: Verify delivery
        if: steps.release_state.outputs.already_released != 'true'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;
            const sha = process.env.MAIN_SHA;
            const ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            if (ref.data.object.sha !== sha) core.setFailed('Tag target mismatch.');
            const rel = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            const assets = await github.rest.repos.listReleaseAssets({owner, repo, release_id: rel.data.id});
            const names = new Set(assets.data.map(a => a.name));
            for (const n of [`arvin-${{ steps.release_state.outputs.app_version }}-build${{ steps.release_state.outputs.build_number }}.apk`,'artifact.sha256','release-evidence.txt']) if (!names.has(n)) core.setFailed(`Missing release asset: ${n}`);
            core.info(`DELIVERY_CHECK=success TAG=${tag}`);

      - name: Recovery and resume validation
        if: steps.release_state.outputs.already_released != 'true'
        run: |
          set -euo pipefail
          sha256sum -c "$RELEASE_EVIDENCE/artifact.sha256"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "${{ steps.verify.outputs.main_sha }}"
          test "$(git rev-list -n 1 '${{ steps.release.outputs.tag }}')" = "${{ steps.verify.outputs.main_sha }}"
          echo "RECOVERY_RESULT=success"
          echo "RESUME_VALIDATION=success"

      - name: Remove stale Arvin prereleases
        if: steps.release_state.outputs.already_released != 'true'
        uses: actions/github-script@v7
        env:
          KEEP_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepTag = process.env.KEEP_TAG;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            for (const release of releases) {
              if (release.draft || !release.prerelease) continue;
              if (!release.tag_name.startsWith('v') || !release.tag_name.includes('-arvin-')) continue;
              if (release.tag_name === keepTag) continue;
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: 'tags/' + release.tag_name });
              } catch (error) {
                if (error.status !== 422 && error.status !== 404) throw error;
              }
              core.info('REMOVED_STALE_RELEASE=' + release.tag_name);
            }

      - name: Publish final evidence
        if: steps.release_state.outputs.already_released != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arvin-release-closure-${{ steps.verify.outputs.main_sha }}
          path: ${{ env.RELEASE_EVIDENCE }}
          if-no-files-found: error

      - name: Remove temporary production signing material
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/arvin-release-keystore.jks"
          test ! -e "$RUNNER_TEMP/arvin-release-keystore.jks"

 "$verify_log"
          grep -Eiq '^Verified using v3 scheme .*: true
      - name: Store release evidence
        if: steps.release_state.outputs.already_released != 'true'
        env:
          CANDIDATE_PR: ${{ steps.verify.outputs.candidate_pr }}
        run: |
          cat > "$RELEASE_EVIDENCE/release-evidence.txt" <<EOF
          PR_NUMBER=${CANDIDATE_PR}
          COMMIT_SHA=${{ steps.verify.outputs.commit_sha }}
          MERGE_SHA=${{ steps.verify.outputs.merge_sha }}
          MAIN_SHA=${{ steps.verify.outputs.main_sha }}
          FLUTTER_VERSION=${FLUTTER_VERSION}
          GRADLE_VERSION=9.3.1
          AGP_VERSION=9.1.0
          KOTLIN_VERSION=2.4.0
          JAVA_VERSION=17
          LOCKFILE=pubspec.lock
          BUILD_RESULT=success
          TEST_RESULT=success
          RELEASE_ARTIFACT=arvin-${{ steps.release_state.outputs.app_version }}-build${{ steps.release_state.outputs.build_number }}.apk
          APP_VERSION=${{ steps.release_state.outputs.app_version }}
          BUILD_NUMBER=${{ steps.release_state.outputs.build_number }}
          ARTIFACT_SHA256=$(cut -d' ' -f1 "$RELEASE_EVIDENCE/artifact.sha256")
          EOF


      - name: Upload internal Release APK artifact
        if: steps.release_state.outputs.already_released != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arvin-internal-build-${{ steps.verify.outputs.main_sha }}
          path: |
            .github/release-evidence/*.apk
            .github/release-evidence/artifact.sha256
            .github/release-evidence/release-evidence.txt
          if-no-files-found: error

      - name: Require explicit product release approval
        if: steps.release_state.outputs.already_released != 'true'
        id: product_gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // A green build is not product acceptance. Publication stays blocked
            // until the existing release gate and the known regression lane are closed.
            // Hide already-published Arvin prereleases while blocked; preserve their
            // tags/assets so this containment is reversible rather than destructive.
            async function hideUnapprovedPrereleases() {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100
              });
              for (const release of releases) {
                if (release.draft || !release.prerelease || !release.tag_name.includes('-arvin-')) {
                  continue;
                }
                try {
                  await github.rest.repos.updateRelease({
                    owner,
                    repo,
                    release_id: release.id,
                    draft: true,
                    body: `${release.body || ''}\n\n**UNAPPROVED — NOT A RELEASE CANDIDATE.** Product release gate #2102 and regression lane #1901 must both be closed after acceptance before publication.`
                  });
                  core.warning(`HIDDEN_UNAPPROVED_PRERELEASE=${release.tag_name}`);
                } catch (error) {
                  core.warning(`FAILED_TO_HIDE_UNAPPROVED_PRERELEASE=${release.tag_name}: ${error.message}`);
                }
              }
            }

            const gate = await github.rest.issues.get({
              owner,
              repo,
              issue_number: 2102
            });
            if (gate.data.state !== 'closed') {
              await hideUnapprovedPrereleases();
              core.setFailed('RELEASE BLOCKED: issue #2102 must be closed only after exact-main CI, device evidence, and product acceptance are complete.');
              return;
            }

            const regression = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: 1901
            });
            if (regression.data.state !== 'closed') {
              await hideUnapprovedPrereleases();
              core.setFailed('RELEASE BLOCKED: existing P0/P1 regression PR #1901 is still open; reconcile/resolve its findings before publishing.');
              return;
            }

            core.info('PRODUCT_RELEASE_GATE=approved');
            core.info('RELEASE_GATE_ISSUE=2102:closed');
            core.info('REGRESSION_LANE_PR=1901:closed');

      - name: Create exact-head tag and prerelease
        if: steps.release_state.outputs.already_released != 'true'
        id: release
        uses: actions/github-script@v7
        env:
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
          PR_NUMBER: ${{ steps.verify.outputs.candidate_pr }}
          APP_VERSION: ${{ steps.release_state.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.release_state.outputs.build_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.MAIN_SHA;
            const appVersion = process.env.APP_VERSION.split('+')[0];
            const buildNumber = process.env.BUILD_NUMBER;
            const tag = `v${appVersion}-build${buildNumber}-arvin-${sha.slice(0,7)}`;
            try { await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}); }
            catch (_) { await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha}); }
            let rel;
            try { rel = await github.rest.repos.getReleaseByTag({owner, repo, tag}); }
            catch (_) { rel = await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sha, name: `Arvin ${process.env.APP_VERSION} (build ${process.env.BUILD_NUMBER})`, body: `Autonomous release closure for PR #${process.env.PR_NUMBER}; verified main ${sha}.`, draft: false, prerelease: true}); }
            core.setOutput('tag', tag);
            core.setOutput('release_id', String(rel.data.id));
            core.info(`TAG=${tag}`);

