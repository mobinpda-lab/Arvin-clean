name: Arvin Release Closure

on:
  workflow_run:
    workflows: ['Arvin Production Orchestrator']
    types: [completed]
  schedule:
    - cron: '7/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: arvin-release-closure
  cancel-in-progress: false

env:
  RELEASE_EVIDENCE: .github/release-evidence
  CANDIDATE_PR: '648'

jobs:
  release-closure:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Initialize release lifecycle state
        id: lifecycle_init
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_EVIDENCE"
          MAIN_SHA="$(git rev-parse HEAD)"
          cat > "$RELEASE_EVIDENCE/release-state.json" <<EOF
          {
            "release_state": "RUNNING",
            "evidence_state": "PENDING",
            "main_sha": "$MAIN_SHA",
            "workflow_run": "${{ github.run_id }}",
            "workflow_attempt": "${{ github.run_attempt }}",
            "event": "${{ github.event_name }}",
            "repository": "${{ github.repository }}"
          }
          EOF
          echo "RELEASE_STATE=RUNNING"
          echo "MAIN_SHA=$MAIN_SHA"
          echo "WORKFLOW_RUN=${{ github.run_id }}"

      - name: Detect pending release
        id: release_state
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const sha = main.data.commit.sha;
            const tag = `v0.1.0-arvin-${sha.slice(0,7)}`;
            let complete = false;
            try {
              const rel = await github.rest.repos.getReleaseByTag({owner, repo, tag});
              const assets = await github.rest.repos.listReleaseAssets({owner, repo, release_id: rel.data.id});
              const names = new Set(assets.data.map(a => a.name));
              complete = ['arvin-release.apk','artifact.sha256','release-evidence.txt'].every(n => names.has(n));
            } catch (_) {}
            core.setOutput('already_released', complete ? 'true' : 'false');
            core.info(`MAIN_SHA=${sha}`);
            core.info(`RELEASE_TAG=${tag}`);
            core.info(`ALREADY_RELEASED=${complete}`);

      - name: Validate candidate and exact main
        if: steps.release_state.outputs.already_released != 'true'
        id: verify
        uses: actions/github-script@v7
        env:
          CANDIDATE_PR: ${{ env.CANDIDATE_PR }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const n = Number(process.env.CANDIDATE_PR);
            const pr = await github.rest.pulls.get({owner, repo, pull_number: n});
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const sha = main.data.commit.sha;
            if (pr.data.state !== 'closed' || !pr.data.merged_at) core.setFailed(`PR #${n} is not merged; fail-closed.`);
            if (pr.data.base.ref !== 'main') core.setFailed(`PR #${n} is not based on main.`);
            const candidateMerge = pr.data.merge_commit_sha;
            const comparison = await github.rest.repos.compareCommits({owner, repo, base: candidateMerge, head: sha});
            if (!['ahead', 'identical'].includes(comparison.data.status)) core.setFailed(`PR #${n} merge ${candidateMerge} is not an ancestor of current main ${sha}.`);
            core.setOutput('main_sha', sha);
            core.setOutput('commit_sha', pr.data.head.sha);
            core.setOutput('merge_sha', candidateMerge);
            core.info(`COMMIT_SHA=${pr.data.head.sha}`);
            core.info(`MERGE_SHA=${candidateMerge}`);
            core.info(`MAIN_SHA=${sha}`);
            core.info(`CANDIDATE_MAIN_RELATION=${comparison.data.status}`);

      - name: Setup Flutter
        if: steps.release_state.outputs.already_released != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test and build release APK
        if: steps.release_state.outputs.already_released != 'true'
        id: build
        run: |
          set -euo pipefail
          flutter pub get
          flutter test
          flutter build apk --release -t lib/main.dart
          mkdir -p "$RELEASE_EVIDENCE"
          cp build/app/outputs/flutter-apk/app-release.apk "$RELEASE_EVIDENCE/arvin-release.apk"
          sha256sum "$RELEASE_EVIDENCE/arvin-release.apk" | tee "$RELEASE_EVIDENCE/artifact.sha256"

      - name: Store release evidence
        if: steps.release_state.outputs.already_released != 'true'
        id: evidence
        run: |
          cat > "$RELEASE_EVIDENCE/release-evidence.txt" <<EOF
          PR_NUMBER=${CANDIDATE_PR}
          COMMIT_SHA=${{ steps.verify.outputs.commit_sha }}
          MERGE_SHA=${{ steps.verify.outputs.merge_sha }}
          MAIN_SHA=${{ steps.verify.outputs.main_sha }}
          BUILD_RESULT=success
          TEST_RESULT=success
          RELEASE_ARTIFACT=arvin-release.apk
          ARTIFACT_SHA256=$(cut -d' ' -f1 "$RELEASE_EVIDENCE/artifact.sha256")
          WORKFLOW_RUN=${{ github.run_id }}
          EOF

      - name: Create immutable tag and prerelease
        if: steps.release_state.outputs.already_released != 'true'
        id: release
        uses: actions/github-script@v7
        env:
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
          PR_NUMBER: ${{ env.CANDIDATE_PR }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.MAIN_SHA;
            const tag = `v0.1.0-arvin-${sha.slice(0,7)}`;
            try { await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}); }
            catch (_) { await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha}); }
            let rel;
            try { rel = await github.rest.repos.getReleaseByTag({owner, repo, tag}); }
            catch (_) { rel = await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sha, name: `Arvin ${tag}`, body: `Autonomous release closure for PR #${process.env.PR_NUMBER}; verified main ${sha}.`, draft: false, prerelease: true}); }
            core.setOutput('tag', tag);
            core.setOutput('release_id', String(rel.data.id));
            core.info(`TAG=${tag}`);

      - name: Upload release assets
        if: steps.release_state.outputs.already_released != 'true'
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RELEASE_EVIDENCE/arvin-release.apk" "$RELEASE_EVIDENCE/artifact.sha256" "$RELEASE_EVIDENCE/release-evidence.txt" --clobber

      - name: Verify delivery
        if: steps.release_state.outputs.already_released != 'true'
        id: delivery
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;
            const sha = process.env.MAIN_SHA;
            const ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            if (ref.data.object.sha !== sha) core.setFailed('Tag target mismatch.');
            const rel = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            const assets = await github.rest.repos.listReleaseAssets({owner, repo, release_id: rel.data.id});
            const names = new Set(assets.data.map(a => a.name));
            for (const n of ['arvin-release.apk','artifact.sha256','release-evidence.txt']) if (!names.has(n)) core.setFailed(`Missing release asset: ${n}`);
            core.info(`DELIVERY_CHECK=success TAG=${tag}`);

      - name: Failure simulation
        if: steps.release_state.outputs.already_released != 'true'
        id: failure_simulation
        run: |
          set +e
          false
          rc=$?
          echo "SIMULATED_FAILURE_RC=$rc"
          test "$rc" -ne 0

      - name: Recovery and resume validation
        if: steps.release_state.outputs.already_released != 'true'
        id: recovery
        run: |
          set -euo pipefail
          sha256sum -c "$RELEASE_EVIDENCE/artifact.sha256"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "${{ steps.verify.outputs.main_sha }}"
          test "$(git rev-list -n 1 '${{ steps.release.outputs.tag }}')" = "${{ steps.verify.outputs.main_sha }}"
          echo "RECOVERY_RESULT=success"
          echo "RESUME_VALIDATION=success"

      - name: Finalize release lifecycle evidence
        if: always()
        id: lifecycle_finalize
        env:
          MAIN_SHA: ${{ steps.verify.outputs.main_sha || github.sha }}
          ALREADY_RELEASED: ${{ steps.release_state.outputs.already_released || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_EVIDENCE"
          JOB_STATUS="${{ job.status }}"
          if [ "$ALREADY_RELEASED" = "true" ]; then STATE="SUCCESS"; else STATE="$JOB_STATUS"; fi
          case "$STATE" in success) STATE="SUCCESS";; failure) STATE="FAILED";; *) STATE="RUNNING";; esac
          BUILD="${{ steps.build.outcome || 'skipped' }}"
          TAG="${{ steps.release.outputs.tag || '' }}"
          DELIVERY="${{ steps.delivery.outcome || 'skipped' }}"
          FAILURE_SIMULATION="${{ steps.failure_simulation.outcome || 'skipped' }}"
          RECOVERY="${{ steps.recovery.outcome || 'skipped' }}"
          if [ "$RECOVERY" = "success" ]; then RESUME="success"; else RESUME="unverified"; fi
          if [ "$STATE" = "SUCCESS" ] && [ "$RECOVERY" = "success" ]; then EVIDENCE_STATE="COMPLETE"; elif [ "$STATE" = "FAILED" ]; then EVIDENCE_STATE="INCOMPLETE"; else EVIDENCE_STATE="PARTIAL"; fi
          cat > "$RELEASE_EVIDENCE/release-state.json" <<EOF
          {
            "release_state": "$STATE",
            "evidence_state": "$EVIDENCE_STATE",
            "main_sha": "$MAIN_SHA",
            "workflow_run": "${{ github.run_id }}",
            "workflow_attempt": "${{ github.run_attempt }}",
            "event": "${{ github.event_name }}",
            "build": "$BUILD",
            "artifact": "${{ steps.build.outcome == 'success' && 'arvin-release.apk' || '' }}",
            "tag": "$TAG",
            "sha256": "${{ steps.build.outcome == 'success' && 'verified-by-artifact.sha256' || '' }}",
            "release": "${{ steps.release.outcome || 'skipped' }}",
            "delivery": "$DELIVERY",
            "monitoring": "workflow-and-release-state-recorded",
            "failure_simulation": "$FAILURE_SIMULATION",
            "recovery": "$RECOVERY",
            "resume": "$RESUME"
          }
          EOF
          echo "RELEASE_STATE=$STATE"
          echo "EVIDENCE_STATE=$EVIDENCE_STATE"
          echo "WORKFLOW_RUN=${{ github.run_id }}"
          echo "MAIN_SHA=$MAIN_SHA"

      - name: Publish final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvin-release-closure-${{ github.run_id }}-${{ github.sha }}
          path: ${{ env.RELEASE_EVIDENCE }}
          if-no-files-found: error