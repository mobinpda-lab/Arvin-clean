name: Arvin Release Closure

on:
  workflow_run:
    workflows: ['Arvin Production Orchestrator']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: arvin-release-closure
  cancel-in-progress: false

env:
  RELEASE_EVIDENCE: .github/release-evidence

jobs:
  release-closure:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch pinned VazirHarf
