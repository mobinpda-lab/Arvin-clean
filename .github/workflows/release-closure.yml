          cp "$apk" "$dest"
          sha256sum "$dest" | tee "$RELEASE_EVIDENCE/artifact.sha256"
          {
            echo "repository=mobinpda-lab/Arvin-clean"
            echo "workflow_name=$GITHUB_WORKFLOW"
            echo "workflow_event=$GITHUB_EVENT_NAME"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_job_id=$GITHUB_JOB"
            echo "source_branch=$GITHUB_REF_NAME"
            echo "requested_target_sha=${{ steps.verify.outputs.main_sha }}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "source_pr_number=${{ steps.verify.outputs.candidate_pr }}"
            echo "source_pr_head_sha=${{ steps.verify.outputs.commit_sha }}"
            echo "source_pr_merge_sha=${{ steps.verify.outputs.merge_sha }}"
            echo "main_sha=${{ steps.verify.outputs.main_sha }}"
            echo "flutter_version=$FLUTTER_VERSION"
            echo "gradle_version=9.3.1"
            echo "agp_version=9.1.0"
            echo "kotlin_version=2.4.0"
            echo "java_version=17"
            echo "release_artifact=$(basename "$dest")"
            echo "apk_sha256=$(cut -d' ' -f1 "$RELEASE_EVIDENCE/artifact.sha256")"
            echo "certificate_sha256=$ARVIN_VERIFIED_CERT_SHA256"
            echo "v2_signature=$ARVIN_APK_V2_VERIFIED"
            echo "v3_signature=$ARVIN_APK_V3_VERIFIED"
            echo "certificate_fingerprint_match=PASS"
            echo "build_result=success"
            echo "test_result=success"
          } > "$RELEASE_EVIDENCE/release-evidence.txt"
          {
            echo "### Verified production APK"
            echo "- Source SHA: `$(git rev-parse HEAD)`"
            echo "- APK SHA-256: `$(cut -d' ' -f1 "$RELEASE_EVIDENCE/artifact.sha256")`"
            echo "- Certificate SHA-256: `$ARVIN_VERIFIED_CERT_SHA256`"
