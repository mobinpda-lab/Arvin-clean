name: Arvin Parallel Wave

on:
  push:
    branches: ['wave/**', 'ci/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name arvin .
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle file not found')
          text = path.read_text()
          is_kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if is_kts else 'coreLibraryDesugaringEnabled true'
          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'")
          if flag not in text:
              match = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n        ' + flag + text[match.end():]
              else:
                  text += f'\n\ncompileOptions {{\n        {flag}\n}}\n'
          if 'desugar_jdk_libs:2.1.5' not in text:
              match = re.search(r'(?m)^\s*dependencies\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n    ' + dependency + text[match.end():]
              else:
                  text += f'\n\ndependencies {{\n    {dependency}\n}}\n'
          path.write_text(text)
          print(f'Configured {path}')
          PY
      - run: flutter pub get
      - name: Android V2 audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app/src/main')
          activities = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if not activities:
              raise SystemExit('MainActivity.kt/java not found after flutter create')
          text = activities[0].read_text(encoding='utf-8')
          if 'FlutterActivity' not in text:
              raise SystemExit('MainActivity does not use FlutterActivity')
          forbidden = ('io.flutter.app.', 'PluginRegistry.Registrar')
          for path in root.rglob('*'):
              if path.is_file():
                  content = path.read_text(encoding='utf-8', errors='ignore')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(f'deleted Android v1 embedding reference: {token} in {path}')
          print(f'Android V2 audit passed: {activities[0]}')
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: arvin-${{ github.run_id }}-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  surface:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: followup
            test: test/follow_up_history_card_test.dart
          - area: calendar
            test: test/calendar_page_test.dart
          - area: backup
            test: test/backup_scheduler_adapter_test.dart
          - area: typography
            test: test/widget_test.dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate ${{ matrix.area }} surface
        shell: bash
        run: |
          if test -f "${{ matrix.test }}"; then
            flutter test "${{ matrix.test }}"
          else
            echo "${{ matrix.test }} is not present; running smoke test instead."
            flutter test test/widget_test.dart
          fi
