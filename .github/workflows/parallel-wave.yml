name: Arvin Parallel Wave

on:
  push:
    branches: ['wave/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Android platform when needed
        shell: bash
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ] || \
             ! find android/app/src/main -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print -quit | grep -q .; then
            flutter create --platforms=android --project-name arvin_temp .
          fi
      - name: Android V2 audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app/src/main')
          activities = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if not activities:
              raise SystemExit('MainActivity.kt/java not found after Android generation')
          text = activities[0].read_text(encoding='utf-8')
          if 'FlutterActivity' not in text:
              raise SystemExit('MainActivity does not use FlutterActivity')
          forbidden = ('io.flutter.app.', 'PluginRegistry.Registrar')
          for path in root.rglob('*'):
              if path.is_file():
                  content = path.read_text(encoding='utf-8', errors='ignore')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(f'deleted Android v1 embedding reference: {token} in {path}')
          print(f'Android V2 audit passed: {activities[0]}')
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: arvin-${{ github.run_id }}-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  surface:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [followup, calendar, backup, typography]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate ${{ matrix.area }} surface
        shell: bash
        run: |
          case "${{ matrix.area }}" in
            calendar) flutter test test/calendar_page_test.dart ;;
            followup) flutter test test/follow_up_history_card_test.dart 2>/dev/null || flutter test test/task_store_test.dart ;;
            backup) flutter test test/backup_service_test.dart test/backup_scheduler_test.dart ;;
            typography) flutter test test/font_settings_test.dart test/typography_test.dart 2>/dev/null || flutter test test/calendar_page_test.dart ;;
          esac
