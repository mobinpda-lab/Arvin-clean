name: Arvin Parallel Wave

on:
  push:
    branches: ['wave/**', 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Fast Lane: wave/** and ci/** automation branches receive push validation.
# Normal feature/fix/test work opens a PR immediately and receives one canonical
# PR validation, avoiding duplicate push + pull_request runs for the same head.
# The canonical APK gate lives in Arvin Build when a PR is ready or when an
# exact-SHA gate/** validation ref is moved to the PR head.
concurrency:
  group: arvin-parallel-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Fast Lane workflow contract
        run: python3 tool/validate_fast_lane.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  surface:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [followup, calendar, backup, typography, guide, release]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate ${{ matrix.area }} surface independently
        shell: bash
        env:
          ARVIN_SURFACE: ${{ matrix.area }}
        run: |
          case "$ARVIN_SURFACE" in
            calendar)
              tests=$(find test -type f -name '*calendar*test.dart' -print)
              ;;
            followup)
              tests=$(find test -type f \( -iname '*followup*test.dart' -o -iname '*follow_up*test.dart' \) -print)
              ;;
            backup)
              tests=$(find test -type f -iname '*backup*test.dart' -print)
              ;;
            typography)
              tests=$(find test -type f \( -iname '*font*test.dart' -o -iname '*typograph*test.dart' -o -iname '*setting*test.dart' \) -print)
              ;;
            guide)
              tests=$(find test -type f \( -iname '*guide*test.dart' -o -iname '*help*test.dart' \) -print)
              ;;
            release)
              tests=$(find test -type f \( -iname '*release*test.dart' -o -iname '*critical_path*test.dart' \) -print)
              ;;
            *)
              echo "Unknown surface: $ARVIN_SURFACE"
              exit 1
              ;;
          esac
          if [ -n "$tests" ]; then
            echo "$tests"
            for test_file in $tests; do
              flutter test "$test_file"
            done
          else
            echo "No dedicated ${ARVIN_SURFACE} tests found; running core smoke test only."
            flutter test test/task_store_test.dart
          fi
