name: Arvin Parallel Wave

on:
  push:
    branches: ['wave/**', 'ci/**', 'fix/**', 'feat/**', 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Fast Lane: Push + PR events for the same working branch share one concurrency
# group, so stale validation is cancelled. This workflow provides fast PR
# feedback; the canonical APK gate lives in Arvin Build when a PR is ready or
# when an exact-SHA gate/** validation ref is moved to the PR head.
concurrency:
  group: arvin-parallel-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  one_off_wire_backup:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire Home to canonical backup and restore
        run: python3 tool/one_off_wire_canonical_backup.py
      - name: Commit wiring and restore canonical workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tool/one_off_wire_canonical_backup.py
          git show origin/main:.github/workflows/parallel-wave.yml > .github/workflows/parallel-wave.yml
          git add lib/main.dart .github/workflows/parallel-wave.yml
          git commit -m "fix(backup): wire Home to canonical portability"
          git push origin HEAD:${GITHUB_REF_NAME}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Fast Lane workflow contract
        run: python3 tool/validate_fast_lane.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  surface:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [followup, calendar, backup, typography, release]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate ${{ matrix.area }} surface independently
        shell: bash
        env:
          ARVIN_SURFACE: ${{ matrix.area }}
        run: |
          case "$ARVIN_SURFACE" in
            calendar)
              tests=$(find test -type f -name '*calendar*test.dart' -print)
              ;;
            followup)
              tests=$(find test -type f \( -iname '*followup*test.dart' -o -iname '*follow_up*test.dart' \) -print)
              ;;
            backup)
              tests=$(find test -type f -iname '*backup*test.dart' -print)
              ;;
            typography)
              tests=$(find test -type f \( -iname '*font*test.dart' -o -iname '*typograph*test.dart' -o -iname '*setting*test.dart' \) -print)
              ;;
            release)
              tests=$(find test -type f \( -iname '*release*test.dart' -o -iname '*critical_path*test.dart' \) -print)
              ;;
            *)
              echo "Unknown surface: $ARVIN_SURFACE"
              exit 1
              ;;
          esac
          if [ -n "$tests" ]; then
            echo "$tests"
            for test_file in $tests; do
              flutter test "$test_file"
            done
          else
            echo "No dedicated ${ARVIN_SURFACE} tests found; running core smoke test only."
            flutter test test/task_store_test.dart
          fi
