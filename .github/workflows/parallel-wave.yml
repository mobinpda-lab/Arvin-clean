name: Arvin Parallel Wave

on:
  push:
    branches: ['wave/**', 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Fast Lane: CI automation branches receive the lightweight contract gate.
# Arvin Build owns the complete Analyze + sharded Test + Debug/Release APK gate.
# Arvin Device Smoke owns real Android integration evidence for Ready PRs.
# Do not duplicate product tests here: duplicate execution only increases queue time
# and runner consumption without increasing product coverage.
concurrency:
  group: arvin-parallel-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Fast Lane workflow contract
        run: python3 tool/validate_fast_lane.py

