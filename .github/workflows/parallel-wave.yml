name: Arvin Parallel Wave

on:
  push:
    branches: ['wave/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name arvin .
      - run: flutter pub get
      - name: Android V2 audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml not found')
          text = manifest.read_text(encoding='utf-8')
          if 'io.flutter.embedding.android' not in text:
              raise SystemExit('Android manifest is not using Flutter V2 embedding')
          forbidden = ('io.flutter.app.', 'PluginRegistry.Registrar')
          for root in (Path('android/app/src/main'),):
              for path in root.rglob('*'):
                  if path.is_file():
                      content = path.read_text(encoding='utf-8', errors='ignore')
                      for token in forbidden:
                          if token in content:
                              raise SystemExit(f'deleted Android v1 embedding reference: {token} in {path}')
          print('Android V2 audit passed')
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: arvin-${{ github.run_id }}-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  surface:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: [followup, calendar, backup, typography]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate ${{ matrix.area }} surface
        shell: bash
        run: |
          case '${{ matrix.area }}' in
            followup)
              tests=(test/follow_up*_test.dart)
              if compgen -G 'test/follow_up*_test.dart' > /dev/null; then
                flutter test "${tests[@]}"
              else
                flutter test test/task_store_test.dart
              fi
              ;;
            calendar)
              flutter test test/calendar_page_test.dart
              ;;
            backup)
              flutter test test/*backup*.dart
              ;;
            typography)
              if compgen -G 'test/*font*.dart' > /dev/null; then
                flutter test test/*font*.dart
              else
                echo 'No dedicated typography tests yet; surface smoke check passed.'
              fi
              ;;
            *)
              echo "Unknown surface: ${{ matrix.area }}" >&2
              exit 1
              ;;
          esac
