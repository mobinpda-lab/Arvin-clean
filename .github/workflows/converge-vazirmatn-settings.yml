name: Converge Vazirmatn Into Canonical Settings

on:
  push:
    branches:
      - feat/issue-231-settings

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Converge bundled default font
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('lib/main.dart')
          s = main.read_text()
          anchor = "import 'settings_page.dart';\n"
          if "import 'theme/app_fonts.dart';" not in s:
              if anchor not in s:
                  raise SystemExit('settings import anchor missing')
              s = s.replace(anchor, anchor + "import 'theme/app_fonts.dart';\n", 1)
          old = '        fontFamily: settings.fontFamily,'
          new = '        fontFamily: settings.fontFamily ?? AppFonts.vazirmatnFamily,'
          if s.count(old) != 2:
              raise SystemExit(f'expected two theme font anchors, found {s.count(old)}')
          s = s.replace(old, new)
          main.write_text(s)

          page = Path('lib/settings_page.dart')
          s = page.read_text()
          old_text = 'فعلاً از فونت پیش‌فرض برنامه استفاده می‌شود؛ فونت جدید بدون دارایی موجود اضافه نمی‌شود.'
          new_text = 'وزیرمتن فونت عمومی و پیش‌فرض آروین است؛ فونت دارای مجوز فقط از همین تنظیمات قابل توسعه خواهد بود.'
          if old_text not in s:
              raise SystemExit('settings font copy anchor missing')
          page.write_text(s.replace(old_text, new_text, 1))

          doc = Path('docs/CANONICAL_APP_SETTINGS_2026-08-26.md')
          s = doc.read_text()
          addition = '''\n## Typography convergence\n- Vazirmatn bundled on `main` is the canonical public/default font.\n- `fontFamily == null` means use the Arvin default, not a second settings system.\n- Any licensed/private or additional public font picker must extend `AppSettingsService`; it must not create a parallel settings store/controller.\n'''
          if '## Typography convergence' not in s:
              doc.write_text(s.rstrip() + '\n' + addition)

          test = Path('test/vazirmatn_settings_convergence_test.dart')
          test.write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('canonical Settings uses bundled Vazirmatn as Arvin default', () {\n    final mainSource = File('lib/main.dart').readAsStringSync();\n    final settingsSource = File('lib/settings_page.dart').readAsStringSync();\n\n    expect(mainSource, contains(\"import 'theme/app_fonts.dart';\"));\n    expect(\n      mainSource,\n      contains('fontFamily: settings.fontFamily ?? AppFonts.vazirmatnFamily,'),\n    );\n    expect(settingsSource, contains('وزیرمتن فونت عمومی و پیش‌فرض آروین است'));\n  });\n}\n""")
          PY
          git rm .github/workflows/converge-vazirmatn-settings.yml

      - name: Commit convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart lib/settings_page.dart docs/CANONICAL_APP_SETTINGS_2026-08-26.md test/vazirmatn_settings_convergence_test.dart
          git diff --cached --check
          git commit -m 'feat(settings): converge bundled Vazirmatn default'
          git push origin HEAD:feat/issue-231-settings
