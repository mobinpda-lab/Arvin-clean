name: Arvin Repro Bootstrap Temporary

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: arvin-repro-bootstrap-temp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.head_ref == 'fix/issue-782-reproducible-build-current-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Track exact Gradle wrapper and clean bootstrap-only metadata
        shell: bash
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android --project-name arvin .
          flutter pub get
          test -s pubspec.lock
          test -s android/gradlew
          test -s android/gradlew.bat
          test -s android/gradle/wrapper/gradle-wrapper.jar
          git config user.name 'arvin-repro-bootstrap[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/repro-bootstrap-temp.yml
          git rm -f android/arvin_android.iml 2>/dev/null || true
          git add pubspec.lock android
          git add -f android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar
          git reset -- android/local.properties 2>/dev/null || true
          git commit -m 'build(reproducibility): track Gradle wrapper and clean generated IDE metadata'
          git push origin HEAD:${{ github.head_ref }}
