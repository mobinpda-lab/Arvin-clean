name: temporary-align-home-guide
on:
  push:
    branches: [feat/home-visual-integration-2026-09-07]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align guide targets with canonical Home
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """      targets: [\n        HomeGuideTarget(\n          key: _quickCaptureGuideKey,\n          title: 'ثبت سریع',\n          description:\n              'وقتی عجله دارید، این دکمه را بزنید و فقط متن کار را سریع ثبت کنید. جزئیات را بعداً می‌توانید کامل کنید.',\n          icon: Icons.bolt_outlined,\n        ),\n        HomeGuideTarget(\n          key: _searchGuideKey,\n"""
          new = """      targets: [\n        HomeGuideTarget(\n          key: _searchGuideKey,\n"""
          if s.count(old) != 1: raise SystemExit(f'guide header target mismatch: {s.count(old)}')
          s = s.replace(old, new)
          old = """        HomeGuideTarget(\n          key: _newTaskGuideKey,\n          title: 'ساخت کار جدید',\n"""
          if s.count(old) != 1: raise SystemExit('new-task target missing')
          old_row = """      Padding(padding: const EdgeInsets.symmetric(horizontal: 16), child: Row(children: [Expanded(child: stat('کل', allTasks, Icons.list_alt_rounded, 'کل', const Color(0xFF4A4CAB), 'home-stat-all')),"""
          new_row = """      Padding(key: _filtersGuideKey, padding: const EdgeInsets.symmetric(horizontal: 16), child: Row(children: [Expanded(child: stat('کل', allTasks, Icons.list_alt_rounded, 'کل', const Color(0xFF4A4CAB), 'home-stat-all')),"""
          if s.count(old_row) != 1: raise SystemExit(f'stat row mismatch: {s.count(old_row)}')
          s = s.replace(old_row, new_row)
          old_add = """      floatingActionButton: selected.isEmpty ? Padding(padding: const EdgeInsets.only(bottom: 2), child: ArvinHomePrimaryAddButton(onPressed: _add)) : null,"""
          new_add = """      floatingActionButton: selected.isEmpty ? Padding(padding: const EdgeInsets.only(bottom: 2), child: KeyedSubtree(key: _newTaskGuideKey, child: ArvinHomePrimaryAddButton(onPressed: _add))) : null,"""
          if s.count(old_add) != 1: raise SystemExit(f'add button mismatch: {s.count(old_add)}')
          s = s.replace(old_add, new_add)
          p.write_text(s)
      - name: Commit guide alignment
        run: |
          git config user.name 'arvin-factory-bot'
          git config user.email 'arvin-factory-bot@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix(home): align first-run guide with canonical controls'
          git push
