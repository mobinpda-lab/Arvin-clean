name: Arvin Governance Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/arvin_colors.dart'
      - 'lib/home/home_visual_integration.dart'
      - 'docs/project-continuity/PRODUCT_DECISIONS.md'
      - '.github/workflows/arvin-governance-validation.yml'
      - 'test/arvin_primary_blue_contract_test.dart'
  push:
    branches: [recovery-02/main-based-integration]
    paths:
      - 'lib/arvin_colors.dart'
      - 'docs/project-continuity/PRODUCT_DECISIONS.md'
      - '.github/workflows/arvin-governance-validation.yml'
      - 'test/arvin_primary_blue_contract_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvin-governance-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner-locked-contract:
    name: Owner-locked REV10 contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate immutable decision and canonical token
        shell: bash
        run: |
          set -euo pipefail
          decisions='docs/project-continuity/PRODUCT_DECISIONS.md'
          colors='lib/arvin_colors.dart'
          grep -Fq 'ARVIN-DEC-OWNER-001' "$decisions"
          grep -Fq 'APPROVED / OWNER-LOCKED' "$decisions"
          grep -Fq 'Exact Primary HEX | `#4169A1` |' "$decisions"
          grep -Fq "static const String primaryName = 'Primary Blue';" "$colors"
          grep -Fq 'static const primary = Color(0xFF4169A1);' "$colors"
          if grep -R -nE 'static const (primary|primaryColor)[[:space:]]*=[[:space:]]*Color\(0xFF' lib --include='*.dart' | grep -v 'Color(0xFF4169A1)'; then
            echo 'Conflicting canonical primary token found.' >&2
            exit 1
          fi
          echo 'REV10_OWNER_DECISION=PASS'
          echo 'PRIMARY_BLUE_NAME=PASS'
          echo 'PRIMARY_BLUE_HEX=PASS'
