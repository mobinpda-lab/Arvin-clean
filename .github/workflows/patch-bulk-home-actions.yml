name: Patch bulk Home actions

on:
  push:
    branches:
      - feat/bulk-home-report-actions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bulk-home-report-actions
          fetch-depth: 0

      - name: Apply deterministic Home bulk wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              "import 'services/task_edit_apply_service.dart';\nimport 'services/task_store.dart';",
              "import 'services/task_edit_apply_service.dart';\nimport 'services/task_bulk_selection_service.dart';\nimport 'services/task_store.dart';",
          )
          replace_once(
              "import 'task_editor_dialog.dart';\nimport 'task_next_action_page.dart';",
              "import 'task_editor_dialog.dart';\nimport 'task_report_page.dart';\nimport 'task_next_action_page.dart';",
          )
          replace_once(
              "import 'widgets/home_interactive_guide.dart';",
              "import 'widgets/home_interactive_guide.dart';\nimport 'widgets/task_bulk_selection_bar.dart';",
          )
          replace_once(
              "  final TaskEditApplyService taskEditApplyService = TaskEditApplyService();\n  final TaskStore taskStore = TaskStore();",
              "  final TaskEditApplyService taskEditApplyService = TaskEditApplyService();\n  final TaskBulkSelectionService taskBulkSelectionService =\n      const TaskBulkSelectionService();\n  final TaskStore taskStore = TaskStore();",
          )
          replace_once(
              "  Future<void> _archiveSelected() async {",
              "  void _replaceSelection(Set<String> next) {\n    setState(() {\n      selected\n        ..clear()\n        ..addAll(next);\n      selectionMode = selected.isNotEmpty;\n    });\n  }\n\n  void _toggleSelected(Task task) {\n    _replaceSelection(taskBulkSelectionService.toggle(selected, task.id));\n  }\n\n  void _toggleAllVisible() {\n    _replaceSelection(taskBulkSelectionService.selectAll(selected, visible));\n  }\n\n  void _clearSelection() {\n    setState(() {\n      selected.clear();\n      selectionMode = false;\n    });\n  }\n\n  Future<void> _shareSelected() async {\n    if (!mounted || selected.isEmpty) return;\n    await Navigator.of(context).push<void>(\n      MaterialPageRoute<void>(\n        builder: (_) => TaskReportPage(\n          tasks: _searchSource,\n          initialSelectedIds: Set<String>.of(selected),\n        ),\n      ),\n    );\n  }\n\n  Future<void> _archiveSelected() async {",
          )
          replace_once(
              "          onTap: selectionMode\n              ? () => setState(() {\n                    if (selected.contains(task.id)) {\n                      selected.remove(task.id);\n                    } else {\n                      selected.add(task.id);\n                    }\n                  })\n              : () => _openTaskDetail(task),",
              "          onTap: selectionMode\n              ? () => _toggleSelected(task)\n              : () => _openTaskDetail(task),",
          )
          replace_once(
              "                  onChanged: (_) => setState(() {\n                    if (selected.contains(task.id)) {\n                      selected.remove(task.id);\n                    } else {\n                      selected.add(task.id);\n                    }\n                  }),",
              "                  onChanged: (_) => _toggleSelected(task),",
          )
          replace_once(
              "          IconButton(\n            onPressed: () => setState(() {\n              selectionMode = !selectionMode;\n              if (!selectionMode) selected.clear();\n            }),\n            icon: Icon(selectionMode ? Icons.close : Icons.checklist),\n          ),",
              "          IconButton(\n            onPressed: selectionMode\n                ? _clearSelection\n                : () => setState(() => selectionMode = true),\n            icon: Icon(selectionMode ? Icons.close : Icons.checklist),\n          ),",
          )
          replace_once(
              "          : SafeArea(\n              child: Padding(\n                padding: const EdgeInsets.all(8),\n                child: Row(\n                  mainAxisAlignment: MainAxisAlignment.spaceEvenly,\n                  children: [\n                    FilledButton.icon(\n                      onPressed: _archiveSelected,\n                      icon: const Icon(Icons.archive_outlined),\n                      label: const Text('بایگانی'),\n                    ),\n                    FilledButton.tonalIcon(\n                      onPressed: _trashSelected,\n                      icon: const Icon(Icons.delete_outline),\n                      label: const Text('حذف'),\n                    ),\n                  ],\n                ),\n              ),\n            ),",
              "          : TaskBulkSelectionBar(\n              selectedCount: selected.length,\n              allVisibleSelected: taskBulkSelectionService.allVisibleSelected(\n                selected,\n                visible,\n              ),\n              onToggleAll: _toggleAllVisible,\n              onClearSelection: _clearSelection,\n              onArchive: _archiveSelected,\n              onTrash: _trashSelected,\n              onShare: _shareSelected,\n            ),",
          )

          path.write_text(source)

          Path('test/home_bulk_selection_wiring_test.dart').write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('Home bulk selection reuses canonical shared foundations', () {
    final source = File('lib/main.dart').readAsStringSync();

    expect(source, contains("import 'services/task_bulk_selection_service.dart';"));
    expect(source, contains("import 'task_report_page.dart';"));
    expect(source, contains("import 'widgets/task_bulk_selection_bar.dart';"));
    expect(source, contains('TaskBulkSelectionService taskBulkSelectionService'));
    expect(source, contains('TaskBulkSelectionBar('));
    expect(source, contains('onToggleAll: _toggleAllVisible'));
    expect(source, contains('onClearSelection: _clearSelection'));
    expect(source, contains('onArchive: _archiveSelected'));
    expect(source, contains('onTrash: _trashSelected'));
    expect(source, contains('onShare: _shareSelected'));
  });

  test('Home report entry forwards exact selected canonical ids', () {
    final source = File('lib/main.dart').readAsStringSync();

    expect(source, contains('TaskReportPage('));
    expect(source, contains('tasks: _searchSource'));
    expect(source, contains('initialSelectedIds: Set<String>.of(selected)'));
    expect(source, contains('taskBulkSelectionService.selectAll(selected, visible)'));
    expect(source, contains('taskBulkSelectionService.toggle(selected, task.id)'));
  });
}
""")
          PY

      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/patch-bulk-home-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(bulk): wire Home selection to report actions"
          git push origin HEAD:feat/bulk-home-report-actions
