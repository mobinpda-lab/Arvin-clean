name: G1 lock sync

on:
  push:
    branches:
      - feature/arvin-g1-drift-dependency-20260922
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Ensure only lockfile changed
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -z "$(git diff --name-only | grep -v '^pubspec.lock$' || true)"
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore(g1): sync pubspec.lock"
          git push

# Triggered for the lock synchronization pass.
