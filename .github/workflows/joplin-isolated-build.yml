name: Joplin isolated plugin build

on:
  push:
    branches:
      - research/joplin-persian-shamsi-isolated
    paths:
      - 'research/joplin-persian-shamsi-isolated/plugin/**'
      - '.github/workflows/joplin-isolated-build.yml'
  pull_request:
    paths:
      - 'research/joplin-persian-shamsi-isolated/plugin/**'
      - '.github/workflows/joplin-isolated-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-joplin-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/joplin-persian-shamsi-isolated/plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: research/joplin-persian-shamsi-isolated/plugin/package.json

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run dist

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -f publish/*.jpl
          test -f publish/*.json
          test -f dist/fonts/Vazirharf[wght].ttf
          test -f dist/manifest.json
          echo "Generated plugin archives:"
          ls -lh publish/*.jpl
          echo "Archive contents:"
          tar -tf publish/*.jpl | sed -n '1,120p'

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-persian-shamsi-plugin
          path: |
            research/joplin-persian-shamsi-isolated/plugin/publish/*.jpl
            research/joplin-persian-shamsi-isolated/plugin/publish/*.json
          if-no-files-found: error
