name: Arvin Calendar Provider Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'integration_test/android_calendar_provider_acceptance_test.dart'
      - '.github/workflows/calendar-provider-acceptance.yml'
      - 'lib/services/calendar_provider_sync_executor.dart'
      - 'lib/services/calendar_outbound_sync_service.dart'
      - 'lib/services/app_settings_service.dart'
      - 'lib/calendar_integration_settings_page.dart'
      - 'test/services/calendar_outbound_sync_service_test.dart'
      - 'test/services/calendar_integration_settings_contract_test.dart'
      - 'test/calendar_integration_settings_page_test.dart'
      - 'lib/services/calendar_sync_plan_service.dart'
      - 'lib/services/system_calendar_bridge.dart'
      - 'android/app/src/main/kotlin/com/example/arvin/MainActivity.kt'
  pull_request:
    branches: [main, 'fix/follow-up-record-authority-20261019']
    paths:
      - 'integration_test/android_calendar_provider_acceptance_test.dart'
      - '.github/workflows/calendar-provider-acceptance.yml'
      - 'lib/services/calendar_provider_sync_executor.dart'
      - 'lib/services/calendar_sync_plan_service.dart'
      - 'lib/services/system_calendar_bridge.dart'
      - 'android/app/src/main/kotlin/com/example/arvin/MainActivity.kt'
      - 'test/follow_up_calendar_projection_test.dart'
      - 'test/calendar_integration_settings_page_test.dart'
      - 'test/services/calendar_outbound_sync_service_test.dart'
      - 'test/services/calendar_integration_settings_contract_test.dart'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  android-calendar-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned VazirHarf
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Initialize Calendar Provider evidence directory
        run: |
          mkdir -p .github/calendar-provider-evidence
          printf 'HEAD_SHA=%s\\n' "$(git rev-parse HEAD)" > .github/calendar-provider-evidence/environment.txt
          printf 'PROVIDER_ACCEPTANCE=STARTED\\n' >> .github/calendar-provider-evidence/environment.txt

      - name: Run real Calendar Provider acceptance or prove stock-emulator limitation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            set -eu
            evidence_dir=".github/calendar-provider-evidence"
            mkdir -p "$evidence_dir"
            printf 'HEAD_SHA=%s\n' "$(git rev-parse HEAD)" > "$evidence_dir/environment.txt"
            device="emulator-${EMULATOR_PORT}"
            printf 'EMULATOR_DEVICE=%s\n' "$device" >> "$evidence_dir/environment.txt"
            printf 'EMULATOR_API=%s\n' "$(adb -s "$device" shell getprop ro.build.version.sdk | tr -d '\\r')" >> "$evidence_dir/environment.txt"
            printf 'PROVIDER_DISCOVERY_BEGIN\n' >> "$evidence_dir/environment.txt"
            (adb -s "$device" shell dumpsys package providers | grep -i -E 'calendar|com.android.providers.calendar' >> "$evidence_dir/environment.txt" || true)
            printf 'PROVIDER_DISCOVERY_END\n' >> "$evidence_dir/environment.txt"

            flutter build apk --debug -t lib/main.dart
            adb -s "$device" install -r build/app/outputs/flutter-apk/app-debug.apk
            adb -s "$device" shell pm grant com.example.arvin android.permission.READ_CALENDAR
            adb -s "$device" shell pm grant com.example.arvin android.permission.WRITE_CALENDAR

            # Quote the full remote shell command so URI query-string ampersands
            # are not interpreted as background operators by the emulator shell.
            seed_uri='content://com.android.calendar/calendars?caller_is_syncadapter=true&account_name=arvin-acceptance&account_type=LOCAL'
            set +e
            seed_output="$(adb -s "$device" shell "content insert --uri '$seed_uri' --bind account_name:s:arvin-acceptance --bind account_type:s:LOCAL --bind name:s:arvin-acceptance --bind calendar_displayName:s:ArvinAcceptance --bind calendar_color:i:-16776961 --bind calendar_access_level:i:700 --bind ownerAccount:s:arvin-acceptance --bind visible:i:1 --bind sync_events:i:1" 2>&1)"
            seed_rc=$?
            set -e
            {
              printf 'CALENDAR_SEED_EXIT=%s\n' "$seed_rc"
              printf 'CALENDAR_SEED_OUTPUT_BEGIN\n%s\nCALENDAR_SEED_OUTPUT_END\n' "$seed_output"
              printf 'CALENDAR_ROWS_BEGIN\n'
              adb -s "$device" shell content query --uri content://com.android.calendar/calendars --projection _id:account_name:account_type:calendar_displayName:calendar_access_level 2>&1 || true
              printf 'CALENDAR_ROWS_END\n'
            } >> "$evidence_dir/environment.txt"

            set +e
            flutter test integration_test/android_calendar_provider_acceptance_test.dart -d "$device" > "$evidence_dir/test-output.txt" 2>&1
            test_rc=$?
            set -e
            cat "$evidence_dir/test-output.txt" 2>/dev/null || true

            if [ "$test_rc" -ne 0 ]; then
              printf 'RESULT=FAIL_PROVIDER_TEST_EXIT_%s\n' "$test_rc" > "$evidence_dir/result.txt"
              exit "$test_rc"
            fi
            if grep -q 'CALENDAR_PROVIDER_ACCEPTANCE=PASS' "$evidence_dir/test-output.txt"; then
              echo 'RESULT=PASS_REAL_PROVIDER_CREATE_NOOP_UPDATE_DELETE' > "$evidence_dir/result.txt"
              exit 0
            fi
            if grep -q 'CALENDAR_PROVIDER_ACCEPTANCE=LIMITATION_NO_WRITABLE_CALENDAR_ON_STOCK_EMULATOR' "$evidence_dir/test-output.txt"; then
              echo 'RESULT=BLOCKED_NO_WRITABLE_CALENDAR_PROVIDER' > "$evidence_dir/result.txt"
              echo "::error::Calendar Provider acceptance is blocked: no writable calendar was discovered. This is not a pass."
              exit 1
            fi
            echo 'RESULT=FAIL_NO_EXPLICIT_ACCEPTANCE_MARKER' > "$evidence_dir/result.txt"
            echo "::error::Provider test produced no explicit PASS marker."
            exit 1

      - name: Publish exact-head provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvin-calendar-provider-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: .github/calendar-provider-evidence
          if-no-files-found: error
