name: Arvin Calendar Provider Acceptance
run-name: Calendar Provider Acceptance (${{ inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }})

on:
  push:
    branches: [main]
    paths:
      - 'integration_test/android_calendar_provider_acceptance_test.dart'
      - '.github/workflows/calendar-provider-acceptance.yml'
      - 'lib/services/calendar_provider_sync_executor.dart'
      - 'lib/services/calendar_outbound_sync_service.dart'
      - 'lib/services/app_settings_service.dart'
      - 'lib/calendar_integration_settings_page.dart'
      - 'test/services/calendar_outbound_sync_service_test.dart'
      - 'test/services/calendar_integration_settings_contract_test.dart'
      - 'test/calendar_integration_settings_page_test.dart'
      - 'lib/services/calendar_sync_plan_service.dart'
      - 'lib/services/system_calendar_bridge.dart'
      - 'android/app/src/main/kotlin/com/example/arvin/MainActivity.kt'
  pull_request:
    branches: [main]
    paths:
      - 'integration_test/android_calendar_provider_acceptance_test.dart'
      - '.github/workflows/calendar-provider-acceptance.yml'
      - 'lib/services/calendar_provider_sync_executor.dart'
      - 'lib/services/calendar_sync_plan_service.dart'
      - 'lib/services/system_calendar_bridge.dart'
      - 'android/app/src/main/kotlin/com/example/arvin/MainActivity.kt'
      - 'test/follow_up_calendar_projection_test.dart'
      - 'test/calendar_integration_settings_page_test.dart'
      - 'test/services/calendar_outbound_sync_service_test.dart'
      - 'test/services/calendar_integration_settings_contract_test.dart'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate; defaults to the PR head or pushed commit'
        required: false
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  android-calendar-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"

      - name: Fetch pinned VazirHarf
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Calendar Provider acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/calendar-provider-acceptance.sh

      - name: Publish exact-head provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvin-calendar-provider-acceptance-${{ inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
          path: .github/calendar-provider-evidence
          if-no-files-found: error
