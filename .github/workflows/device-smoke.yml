name: Arvin Device Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    # Validate PRs targeting integration branches too; product code can live there before main integration.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact product commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arvin-device-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  # One revision contract for PR, manual dispatch, and push events.
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  prepare-matrix:
    name: Prepare selected smoke scenarios
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build canonical seven-lane matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          scenarios='[
            {"scenario":"smoke-boot","test_file":"integration_test/android_home_smoke_test.dart"},
            {"scenario":"smoke-navigation","test_file":"integration_test/android_people_smoke_test.dart"},
            {"scenario":"smoke-calendar-segmented-view","test_file":"integration_test/calendar_card_interaction_test.dart"},
            {"scenario":"smoke-quick-capture","test_file":"integration_test/android_quick_capture_smoke_test.dart"},
            {"scenario":"smoke-task-lifecycle","test_file":"integration_test/android_backup_restore_sql_smoke_test.dart"},
            {"scenario":"smoke-reminder-vazirmatn","test_file":"integration_test/alarm_overlay_smoke_test.dart"},
            {"scenario":"smoke-follow-up-persistence","test_file":"integration_test/android_sql_persistence_smoke_test.dart"}
          ]'
          echo "Selected canonical smoke lanes: $scenarios"
          matrix="$(jq -cn --argjson scenarios "$scenarios" '{include:$scenarios}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  device-smoke:
    needs: prepare-matrix
    # Draft PRs need CI evidence before they are marked ready; this job never promotes or merges.
    name: device-smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Record and verify checkout revision
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid TARGET_SHA: expected 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_TARGET_SHA=$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          if [ "$actual" != "$TARGET_SHA" ]; then
            echo "CHECKOUT SHA mismatch: expected $TARGET_SHA, got $actual" >&2
            exit 1
          fi
          echo "EXACT_TARGET_SHA=$actual"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned Android inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: arvin-gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            arvin-gradle-${{ runner.os }}-
      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: arvin-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            arvin-pub-${{ runner.os }}-
      - name: Cache Flutter SDK artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.FLUTTER_ROOT }}/bin/cache
            ${{ env.PUB_CACHE }}
          key: arvin-flutter-artifacts-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            arvin-flutter-artifacts-${{ runner.os }}-
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Verify Reminder legacy compatibility
        if: matrix.scenario == 'smoke-reminder-vazirmatn'
        run: flutter test test/task_reminder_legacy_compatibility_test.dart test/follow_up_entry_page_test.dart

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run selected canonical smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-port: 5554
          script: |
            # Keep discovery, readiness, Flutter Drive, and capture in one Bash process.
            bash -euo pipefail -c '
              set -euo pipefail
              raw_devices="$(adb devices -l 2>&1)" || {
                echo "ADB_DISCOVERY_FAILED" >&2
                printf "%s\n" "$raw_devices" >&2
                exit 1
              }
              echo "ADB_DEVICES_RAW_BEGIN"
              printf "%s\n" "$raw_devices"
              echo "ADB_DEVICES_RAW_END"

              valid_devices=()
              invalid_devices=()
              header_seen=false
              while IFS= read -r line; do
                if [[ "$line" == List\ of\ devices\ attached* ]]; then
                  header_seen=true
                  continue
                fi
                [[ "$header_seen" == true && -n "$line" ]] || continue
                read -r serial state remainder <<< "$line"
                if [[ -z "$serial" || -z "$state" ]]; then
                  invalid_devices+=("$line")
                elif [[ "$state" == "device" ]]; then
                  valid_devices+=("$serial")
                else
                  invalid_devices+=("$line")
                fi
              done <<< "$raw_devices"

              if [[ "$header_seen" != true ]]; then
                echo "ADB_DISCOVERY_ERROR: adb devices -l returned no device-list header" >&2
                exit 1
              fi
              if (( ${#invalid_devices[@]} > 0 )); then
                printf "ADB_INVALID_DEVICE_STATE: %s\n" "${invalid_devices[@]}" >&2
                exit 1
              fi
              if (( ${#valid_devices[@]} != 1 )); then
                echo "ADB_DEVICE_SELECTION_ERROR: expected exactly one device-state serial; found ${#valid_devices[@]}" >&2
                exit 1
              fi

              device="${valid_devices[0]}"
              if [[ ! "$device" =~ ^[A-Za-z0-9._:-]+$ ]]; then
                echo "ADB_INVALID_SERIAL: $device" >&2
                exit 1
              fi

              if ! state="$(adb -s "$device" get-state 2>&1)"; then
                echo "ADB_GET_STATE_FAILED: serial=$device response=$state" >&2
                exit 1
              fi
              if [[ "$state" != "device" ]]; then
                echo "ADB_STATE_MISMATCH: serial=$device state=$state" >&2
                exit 1
              fi

              boot_property=""
              boot_deadline=$((SECONDS + 120))
              while (( SECONDS < boot_deadline )); do
                current_state="$(adb -s "$device" get-state 2>&1 || true)"
                if [[ "$current_state" == "device" ]]; then
                  boot_property="$(adb -s "$device" shell getprop sys.boot_completed 2>&1 || true)"
                  boot_property="$(printf "%s" "$boot_property" | tr -d "\015")"
                  if [[ "$boot_property" == "1" ]]; then
                    break
                  fi
                fi
                sleep 2
              done
              if [[ "$boot_property" != "1" ]]; then
                diagnostic_state="$(adb -s "$device" get-state 2>&1 || true)"
                diagnostic_boot="$(adb -s "$device" shell getprop sys.boot_completed 2>&1 || true)"
                diagnostic_sdk="$(adb -s "$device" shell getprop ro.build.version.sdk 2>&1 || true)"
                echo "ADB_BOOT_TIMEOUT: serial=$device state=$diagnostic_state sys.boot_completed=$diagnostic_boot sdk=$diagnostic_sdk" >&2
                echo "ADB_DEVICES_RAW_BEGIN" >&2
                printf "%s\n" "$raw_devices" >&2
                echo "ADB_DEVICES_RAW_END" >&2
                exit 1
              fi

              if ! sdk="$(adb -s "$device" shell getprop ro.build.version.sdk 2>&1)"; then
                echo "ADB_SDK_READ_FAILED: serial=$device state=$state boot=$boot_property sdk=$sdk" >&2
                exit 1
              fi
              if [[ ! "$sdk" =~ ^[0-9]{1,3}$ ]]; then
                echo "ADB_INVALID_SDK: serial=$device state=$state boot=$boot_property sdk=$sdk" >&2
                exit 1
              fi
              if [[ "$sdk" != "35" ]]; then
                echo "ADB_API_MISMATCH: expected matrix API 35, got $sdk (serial=$device)" >&2
                exit 1
              fi
              echo "ADB_DEVICE=$device ADB_STATE=$state ADB_BOOT_COMPLETED=$boot_property ADB_API_LEVEL=$sdk"

              flutter drive --driver=test_driver/integration_test.dart --target=${{ matrix.test_file }} -d "$device"
              mkdir -p artifacts/device-smoke
              screenshot="artifacts/device-smoke/${{ matrix.scenario }}-final.png"
              adb -s "$device" exec-out screencap -p > "$screenshot"
              test -s "$screenshot"
              echo "SCREENSHOT_ARTIFACT_WRITTEN=$screenshot"
            '

      - name: Upload Android smoke screenshot evidence
        if: always() && (matrix.scenario == 'smoke-boot' || matrix.scenario == 'smoke-quick-capture' || matrix.scenario == 'smoke-navigation' || matrix.scenario == 'smoke-task-lifecycle' || matrix.scenario == 'smoke-follow-up-persistence')
        uses: actions/upload-artifact@v5
        with:
          name: arvin-device-smoke-${{ matrix.scenario }}-${{ env.TARGET_SHA }}
          path: artifacts/device-smoke/*.png
          if-no-files-found: warn

      - name: Upload Persian time picker screenshot evidence
        if: always() && matrix.scenario == 'smoke-quick-capture'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-persian-time-picker-${{ env.TARGET_SHA }}
          path: artifacts/device-smoke/persian-time-picker.png
          if-no-files-found: warn

      - name: Upload calendar interaction and RTL evidence
        if: always() && matrix.scenario == 'smoke-calendar-segmented-view'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-device-smoke-calendar-${{ env.TARGET_SHA }}
          path: artifacts/device-smoke/*.png
          if-no-files-found: warn

      - name: Upload Reminder overlay evidence
        if: always() && matrix.scenario == 'smoke-reminder-vazirmatn'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-device-smoke-reminder-${{ env.TARGET_SHA }}
          # Include the final scenario screenshot as well as the alarm-overlay fallback captures.
          path: artifacts/device-smoke/*.png
          if-no-files-found: warn
