name: Arvin Device Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    # Validate PRs targeting integration branches too; product code can live there before main integration.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvin-device-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  device-smoke:
    # Draft PRs need CI evidence before they are marked ready; this job never promotes or merges.
    name: device-smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - scenario: home
            test_file: integration_test/android_home_smoke_test.dart
          - scenario: quick-capture
            test_file: integration_test/android_quick_capture_smoke_test.dart
          - scenario: task-lifecycle
            test_file: integration_test/android_task_lifecycle_smoke_test.dart
          - scenario: sql-persistence
            test_file: integration_test/android_sql_persistence_smoke_test.dart
          - scenario: sql-migration
            test_file: integration_test/android_upgrade_migration_smoke_test.dart
          - scenario: backup-restore
            test_file: integration_test/android_backup_restore_sql_smoke_test.dart
          - scenario: people
            test_file: integration_test/android_people_smoke_test.dart
          - scenario: calendar
            test_file: integration_test/calendar_card_interaction_test.dart
    steps:
      - uses: actions/checkout@v5
      - name: Cache pinned VazirHarf
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vazirharf
          key: arvin-vazirharf-${{ runner.os }}-3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
      - name: Fetch pinned VazirHarf on cache miss
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/vazirharf/.git" ]; then
            git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
            git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
            git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          fi
          test "$(git -C "$RUNNER_TEMP/vazirharf" rev-parse HEAD)" = "3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8"
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned Android inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && rm -rf assets/fonts/vazirharf && cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: arvin-gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            arvin-gradle-${{ runner.os }}-
      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: arvin-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            arvin-pub-${{ runner.os }}-
      - name: Cache Flutter SDK artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.FLUTTER_ROOT }}/bin/cache
            ${{ env.PUB_CACHE }}
          key: arvin-flutter-artifacts-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            arvin-flutter-artifacts-${{ runner.os }}-
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run selected canonical smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            # android-emulator-runner executes script lines in separate /usr/bin/sh processes.
            # Discover the ready device instead of relying on EMULATOR_PORT being exported.
            adb devices -l && device="$(adb devices | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')" && test -n "$device" && echo "ADB_DEVICE=$device" && adb -s "$device" shell getprop sys.boot_completed && adb -s "$device" shell getprop ro.build.version.sdk && flutter drive --driver=test_driver/integration_test.dart --target=${{ matrix.test_file }} -d "$device" && { if [ "${{ matrix.scenario }}" = "task-lifecycle" ]; then echo "ARVIN_LIFECYCLE_RESTART_BEGIN"; adb -s "$device" shell am force-stop com.example.arvin
              package_id="$(adb -s "$device" shell pm list packages | tr -d '\\r' | sed -n 's/^package://p' | grep -Fx 'com.example.arvin' || true)"
              test "$package_id" = 'com.example.arvin' || { adb -s "$device" shell pm list packages -3; adb -s "$device" shell dumpsys activity activities; exit 1; }
              launcher_output="$(adb -s "$device" shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$package_id" 2>&1)" || { printf '%s\\n' "$launcher_output"; adb -s "$device" shell dumpsys package "$package_id"; exit 1; }
              launcher_component="$(printf '%s\\n' "$launcher_output" | tr -d '\\r' | grep -E "^$package_id/" | tail -n 1)"
              test -n "$launcher_component" || { printf '%s\\n' "$launcher_output"; adb -s "$device" shell dumpsys package "$package_id"; exit 1; }
              case "$launcher_component" in "$package_id/"*) ;; *) printf '%s\\n' "$launcher_output"; exit 1 ;; esac
              echo "ARVIN_LIFECYCLE_PACKAGE=$package_id"
              echo "ARVIN_LIFECYCLE_LAUNCHER=$launcher_component"
              adb -s "$device" shell am force-stop "$package_id"
              before_pid="$(adb -s "$device" shell pidof "$package_id" 2>/dev/null | tr -d '\\r' || true)"
              test -z "$before_pid" || { echo "Expected process stopped but pid remains: $before_pid"; exit 1; }
              adb -s "$device" shell am start -W -n "$launcher_component" || { adb -s "$device" shell dumpsys activity activities; adb -s "$device" logcat -d -t 300; exit 1; }
              sleep 3
              after_pid="$(adb -s "$device" shell pidof "$package_id" 2>/dev/null | tr -d '\\r' || true)"
              test -n "$after_pid" || { echo "Launcher returned but app process is absent"; adb -s "$device" logcat -d -t 300; exit 1; }
              echo "ARVIN_LIFECYCLE_RESTART_VERIFIED new_pid=$after_pid"
              flutter drive --driver=test_driver/integration_test.dart --target=integration_test/android_task_lifecycle_restart_verify_test.dart -d "$device"; fi; }

      - name: Upload Android smoke screenshot evidence
        if: always() && (matrix.scenario == 'home' || matrix.scenario == 'quick-capture' || matrix.scenario == 'people')
        uses: actions/upload-artifact@v5
        with:
          name: arvin-device-smoke-${{ matrix.scenario }}-${{ github.sha }}
          path: artifacts/device-smoke/${{ matrix.scenario }}.png
          if-no-files-found: warn

      - name: Upload Task lifecycle screenshots
        if: always() && matrix.scenario == 'task-lifecycle'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-task-lifecycle-${{ github.sha }}
          path: |
            artifacts/device-smoke/task-lifecycle-created.png
            artifacts/device-smoke/task-lifecycle-edited.png
            artifacts/device-smoke/task-lifecycle.png
            artifacts/device-smoke/task-lifecycle-restarted.png
            artifacts/device-smoke/task-lifecycle-reopened.png
          if-no-files-found: warn

      - name: Upload Persian time picker screenshot evidence
        if: always() && matrix.scenario == 'quick-capture'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-persian-time-picker-${{ github.sha }}
          path: artifacts/device-smoke/persian-time-picker.png
          if-no-files-found: warn

      - name: Upload calendar interaction and RTL evidence
        if: always() && matrix.scenario == 'calendar'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-device-smoke-calendar-${{ github.sha }}
          path: |
            artifacts/device-smoke/calendar-card-interaction.png
            artifacts/device-smoke/calendar-card-completed.png
            artifacts/device-smoke/calendar-persian-time-picker.png
          if-no-files-found: error
