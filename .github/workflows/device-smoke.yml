name: Arvin Device Smoke

on:
  push:
    branches: [main, master, 'device/**']
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvin-device-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  device-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle file not found')
          text = path.read_text()
          is_kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if is_kts else 'coreLibraryDesugaringEnabled true'
          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'")
          if flag not in text:
              match = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n        ' + flag + text[match.end():]
              else:
                  text += '\n\ncompileOptions {\n        ' + flag + '\n}\n'
          if 'desugar_jdk_libs:2.1.5' not in text:
              match = re.search(r'(?m)^\s*dependencies\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n    ' + dependency + text[match.end():]
              else:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'
          path.write_text(text)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run canonical Home smoke and capture real screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            rm -f /tmp/arvin-home-test.log
            flutter test integration_test/android_home_smoke_test.dart -d emulator-${EMULATOR_PORT} > /tmp/arvin-home-test.log 2>&1 &
            TEST_PID=$!
            FOUND=0
            I=0
            while [ "$I" -lt 240 ]; do
              if grep -q 'ARVIN_SCREENSHOT_READY' /tmp/arvin-home-test.log 2>/dev/null; then
                FOUND=1
                break
              fi
              if ! kill -0 "$TEST_PID" 2>/dev/null; then
                break
              fi
              I=$((I + 1))
              sleep 2
            done
            cat /tmp/arvin-home-test.log
            if [ "$FOUND" -ne 1 ]; then
              wait "$TEST_PID" || true
              echo 'Home screenshot marker was not reached'
              exit 1
            fi
            mkdir -p artifacts
            adb exec-out screencap -p > artifacts/arvin-home-real.png
            test -s artifacts/arvin-home-real.png
            wait "$TEST_PID"
      - name: Upload real Home screenshot
        uses: actions/upload-artifact@v4
        with:
          name: arvin-home-real-screenshot
          path: artifacts/arvin-home-real.png
          if-no-files-found: error
