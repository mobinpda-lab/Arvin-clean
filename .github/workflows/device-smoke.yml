name: Arvin Device Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvin-device-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  device-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: device-smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - scenario: home
            test_file: integration_test/android_home_smoke_test.dart
          - scenario: quick-capture
            test_file: integration_test/android_quick_capture_smoke_test.dart
          - scenario: sql-persistence
            test_file: integration_test/android_sql_persistence_smoke_test.dart
          - scenario: sql-migration
            test_file: integration_test/android_upgrade_migration_smoke_test.dart
          - scenario: backup-restore
            test_file: integration_test/android_backup_restore_sql_smoke_test.dart
          - scenario: people
            test_file: integration_test/android_people_smoke_test.dart
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned VazirHarf
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vazirharf
          key: arvin-vazirharf-${{ runner.os }}-3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
      - name: Fetch pinned VazirHarf on cache miss
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/vazirharf/.git" ]; then
            git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
            git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
            git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          fi
          test "$(git -C "$RUNNER_TEMP/vazirharf" rev-parse HEAD)" = "3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8"
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned Android inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && rm -rf assets/fonts/vazirharf && cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: arvin-gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            arvin-gradle-${{ runner.os }}-
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: arvin-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            arvin-pub-${{ runner.os }}-
      - name: Cache Flutter SDK artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_ROOT }}/bin/cache
            ${{ env.PUB_CACHE }}
          key: arvin-flutter-artifacts-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            arvin-flutter-artifacts-${{ runner.os }}-
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run selected canonical smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            bash -euo pipefail -c 'mkdir -p artifacts/device-smoke; screenshot_path="artifacts/device-smoke/${{ matrix.scenario }}.png"; temp_path="${screenshot_path}.tmp"; adb shell pm grant com.example.arvin android.permission.POST_NOTIFICATIONS || true; adb shell pm grant com.example.arvin android.permission.READ_CALENDAR || true; adb shell pm grant com.example.arvin android.permission.WRITE_CALENDAR || true; flutter test ${{ matrix.test_file }} -d emulator-${EMULATOR_PORT} & test_pid=$!; (while kill -0 "$test_pid" 2>/dev/null; do if adb shell dumpsys activity activities 2>/dev/null | grep -E "mResumedActivity|topResumedActivity" | grep "com.example.arvin" >/dev/null; then if adb exec-out screencap -p > "$temp_path" 2>/dev/null && file "$temp_path" | grep "PNG image data" >/dev/null && [ "$(stat -c %s "$temp_path")" -ge 12000 ]; then mv "$temp_path" "$screenshot_path"; else rm -f "$temp_path"; fi; fi; sleep 0.25; done) & capture_pid=$!; if wait "$test_pid"; then test_exit=0; else test_exit=$?; fi; kill "$capture_pid" 2>/dev/null || true; wait "$capture_pid" 2>/dev/null || true; if adb shell dumpsys activity activities 2>/dev/null | grep -E "mResumedActivity|topResumedActivity" | grep "com.example.arvin" >/dev/null; then if adb exec-out screencap -p > "$temp_path" 2>/dev/null && file "$temp_path" | grep "PNG image data" >/dev/null && [ "$(stat -c %s "$temp_path")" -ge 12000 ]; then mv "$temp_path" "$screenshot_path"; else rm -f "$temp_path"; fi; fi; rm -f "$temp_path"; exit "$test_exit"'

      - name: Upload Android smoke screenshot evidence
        if: always() && (matrix.scenario == 'home' || matrix.scenario == 'quick-capture' || matrix.scenario == 'people')
        uses: actions/upload-artifact@v4
        with:
          name: arvin-device-smoke-${{ matrix.scenario }}-${{ github.sha }}
          path: artifacts/device-smoke/${{ matrix.scenario }}.png
          if-no-files-found: warn
