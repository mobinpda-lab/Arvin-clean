name: Arvin Device Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    # Validate PRs targeting integration branches too; product code can live there before main integration.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact product commit SHA to validate'
        required: true
        type: string
      run_calendar:
        description: 'Run Calendar interaction scenario'
        required: true
        default: true
        type: boolean
      run_sql_persistence:
        description: 'Run SQL persistence scenario'
        required: true
        default: true
        type: boolean
      run_sql_migration:
        description: 'Run SQL legacy-storage migration scenario'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arvin-device-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  prepare-matrix:
    name: Prepare selected smoke scenarios
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build scenario matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CALENDAR: ${{ inputs.run_calendar }}
          RUN_SQL_PERSISTENCE: ${{ inputs.run_sql_persistence }}
          RUN_SQL_MIGRATION: ${{ inputs.run_sql_migration }}
        shell: bash
        run: |
          set -euo pipefail
          scenarios='[]'
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            scenarios='[
              {"scenario":"home","test_file":"integration_test/android_home_smoke_test.dart"},
              {"scenario":"quick-capture","test_file":"integration_test/android_quick_capture_smoke_test.dart"},
              {"scenario":"sql-persistence","test_file":"integration_test/android_sql_persistence_smoke_test.dart"},
              {"scenario":"sql-migration","test_file":"integration_test/android_upgrade_migration_smoke_test.dart"},
              {"scenario":"backup-restore","test_file":"integration_test/android_backup_restore_sql_smoke_test.dart"},
              {"scenario":"people","test_file":"integration_test/android_people_smoke_test.dart"},
              {"scenario":"calendar","test_file":"integration_test/calendar_card_interaction_test.dart"}
            ]'
          else
            if [ "$RUN_CALENDAR" = "true" ]; then
              scenarios="$(jq -c '. + [{"scenario":"calendar","test_file":"integration_test/calendar_card_interaction_test.dart"}]' <<< "$scenarios")"
            fi
            if [ "$RUN_SQL_PERSISTENCE" = "true" ]; then
              scenarios="$(jq -c '. + [{"scenario":"sql-persistence","test_file":"integration_test/android_sql_persistence_smoke_test.dart"}]' <<< "$scenarios")"
            fi
            if [ "$RUN_SQL_MIGRATION" = "true" ]; then
              scenarios="$(jq -c '. + [{"scenario":"sql-migration","test_file":"integration_test/android_upgrade_migration_smoke_test.dart"}]' <<< "$scenarios")"
            fi
            if [ "$scenarios" = "[]" ]; then
              echo "At least one smoke scenario must be selected for workflow_dispatch." >&2
              exit 1
            fi
          fi
          echo "Selected scenario matrix: $scenarios"
          matrix="$(jq -cn --argjson scenarios "$scenarios" '{include:$scenarios}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  device-smoke:
    needs: prepare-matrix
    # Draft PRs need CI evidence before they are marked ready; this job never promotes or merges.
    name: device-smoke (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
      - name: Record and verify checkout revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CHECKOUT_SHA=$actual"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$TARGET_SHA"
            if [ "$actual" != "$TARGET_SHA" ]; then
              echo "CHECKOUT SHA mismatch: expected $TARGET_SHA, got $actual" >&2
              exit 1
            fi
            echo "EXACT_TARGET_SHA=$actual"
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify tracked Vazirmatn assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/fonts/ui/vazirmatn/Vazirmatn-Regular.ttf
          test -s assets/fonts/ui/vazirmatn/Vazirmatn-Medium.ttf
          test -s assets/fonts/ui/vazirmatn/Vazirmatn-Bold.ttf
          test -s assets/fonts/ui/vazirmatn/Vazirmatn-SemiBold.ttf
          cat <<'EOF' | sha256sum --check -
          b69fd4c680b8f3f225feabcc655a2c585d97627b8f5f5c0f9985e894069f3a56  assets/fonts/ui/vazirmatn/Vazirmatn-Regular.ttf
          b986623e4ddef10755e04be39f8ea7bcb1dc08bfe8dd0aa6af395736f256ad4a  assets/fonts/ui/vazirmatn/Vazirmatn-Medium.ttf
          f635fdbea28f265de395ba83b4b1570dcf2f58d13c65469e61903b1c2d2ae723  assets/fonts/ui/vazirmatn/Vazirmatn-Bold.ttf
          3f239d8364c14ee32c46b6839fa197c28958358b82a9673d2c6acc8506d78bc5  assets/fonts/ui/vazirmatn/Vazirmatn-SemiBold.ttf
          EOF
          grep -q 'family: Vazirmatn' pubspec.yaml
          ! grep -q 'family: VazirHarf' pubspec.yaml
      - name: Verify repository-owned Android inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: arvin-gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            arvin-gradle-${{ runner.os }}-
      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: arvin-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            arvin-pub-${{ runner.os }}-
      - name: Cache Flutter SDK artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.FLUTTER_ROOT }}/bin/cache
            ${{ env.PUB_CACHE }}
          key: arvin-flutter-artifacts-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            arvin-flutter-artifacts-${{ runner.os }}-
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run selected canonical smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            # android-emulator-runner executes script lines in separate /usr/bin/sh processes.
            # Discover the ready device instead of relying on EMULATOR_PORT being exported.
            adb devices -l && device="$(adb devices | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')" && test -n "$device" && echo "ADB_DEVICE=$device" && adb -s "$device" shell getprop sys.boot_completed && adb -s "$device" shell getprop ro.build.version.sdk && flutter drive --driver=test_driver/integration_test.dart --target=${{ matrix.test_file }} -d "$device"

      - name: Upload Android smoke screenshot evidence
        if: always() && (matrix.scenario == 'home' || matrix.scenario == 'quick-capture' || matrix.scenario == 'people')
        uses: actions/upload-artifact@v5
        with:
          name: arvin-device-smoke-${{ matrix.scenario }}-${{ github.sha }}
          path: artifacts/device-smoke/${{ matrix.scenario }}.png
          if-no-files-found: warn

      - name: Upload Persian time picker screenshot evidence
        if: always() && matrix.scenario == 'quick-capture'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-persian-time-picker-${{ github.sha }}
          path: artifacts/device-smoke/persian-time-picker.png
          if-no-files-found: warn

      - name: Upload calendar interaction and RTL evidence
        if: always() && matrix.scenario == 'calendar'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-device-smoke-calendar-${{ github.sha }}
          path: |
            artifacts/device-smoke/calendar-card-interaction.png
            artifacts/device-smoke/calendar-card-completed.png
            artifacts/device-smoke/calendar-persian-time-picker.png
          if-no-files-found: error
