name: Arvin Device Smoke

on:
  push:
    branches: [main, master, 'device/**']
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvin-device-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  device-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize VazirHarf submodule
        run: git submodule sync --recursive && git submodule update --init --recursive
      - name: Preserve VazirHarf assets
        run: test -s assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf && cp -a assets/fonts/vazirharf "$RUNNER_TEMP/vazirharf"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf
      - name: Get dependencies
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run canonical Home smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: flutter test integration_test/android_home_smoke_test.dart -d emulator-${EMULATOR_PORT}

  people-device-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize VazirHarf submodule
        run: git submodule sync --recursive && git submodule update --init --recursive
      - name: Preserve VazirHarf assets
        run: test -s assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf && cp -a assets/fonts/vazirharf "$RUNNER_TEMP/vazirharf"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf
      - name: Get dependencies
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run canonical People smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: flutter test integration_test/android_people_smoke_test.dart -d emulator-${EMULATOR_PORT}
