name: Arvin PR CI Recovery Dispatcher

# Backstop for PR updates whose normal opened/synchronize/reopened event
# did not produce an Arvin Build run. This workflow never merges or releases.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read
  contents: read

concurrency:
  group: arvin-pr-ci-recovery-dispatcher
  cancel-in-progress: false

jobs:
  dispatch-missing-exact-head-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch missing exact-head Arvin Build runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflowId = 'build.yml';
            const staleFailureMs = 6 * 60 * 60 * 1000;
            const maxPrAgeMs = 14 * 24 * 60 * 60 * 1000;
            const maxDispatchesPerRun = 3;
            const now = Date.now();

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
              sort: 'updated',
              direction: 'desc'
            });

            let dispatched = 0;
            let skipped = 0;

            for (const pr of pulls) {
              if (dispatched >= maxDispatchesPerRun) {
                core.info(`SKIP_DISPATCH_BUDGET_EXHAUSTED=PR#${pr.number}`);
                skipped++;
                continue;
              }

              if (now - new Date(pr.updated_at).getTime() > maxPrAgeMs) {
                core.info(`SKIP_STALE_PR=PR#${pr.number} UPDATED_AT=${pr.updated_at}`);
                skipped++;
                continue;
              }

              // Only dispatch trusted branches in this same repository.
              // Fork PRs are deliberately excluded from this privileged dispatcher.
              if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
                core.info(`SKIP_FORK_PR=${pr.number}`);
                skipped++;
                continue;
              }

              const sha = pr.head.sha;
              const runsResponse = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: sha,
                per_page: 20
              });
              const exactRuns = runsResponse.data.workflow_runs
                // A normal pull_request run checks out github.sha (the synthetic PR merge
                // ref), so its run.head_sha alone is not proof that the PR head SHA itself
                // was checked out. Only accept recovery dispatches, whose Build jobs assert
                // git rev-parse HEAD === inputs.target_sha in every quality/APK lane.
                .filter(run => run.event === 'workflow_dispatch')
                .filter(run => run.head_sha === sha)
                // The run name records the pinned target SHA. This rejects a branch-move
                // race where GitHub's dispatch ref resolves to a different commit.
                .filter(run => run.display_title === `Arvin Build (${sha})`)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              const latest = exactRuns[0];
              if (latest && ['queued', 'in_progress', 'requested', 'waiting', 'pending'].includes(latest.status)) {
                core.info(`SKIP_EXACT_HEAD_BUILD_ACTIVE=PR#${pr.number} SHA=${sha}`);
                skipped++;
                continue;
              }

              if (latest && latest.conclusion === 'success') {
                core.info(`SKIP_EXACT_HEAD_ALREADY_GREEN=PR#${pr.number} SHA=${sha}`);
                skipped++;
                continue;
              }

              if (latest && now - new Date(latest.updated_at || latest.created_at).getTime() < staleFailureMs) {
                core.info(`SKIP_RECENT_EXACT_HEAD_RESULT=PR#${pr.number} SHA=${sha} CONCLUSION=${latest.conclusion || 'unknown'}`);
                skipped++;
                continue;
              }

              // workflow_dispatch is intentionally used as a recovery mechanism:
              // GitHub permits it to start a workflow even when a normal event
              // generated by a token does not start downstream workflows.
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: pr.head.ref,
                inputs: { target_sha: sha }
              });
              core.warning(`DISPATCHED_EXACT_HEAD_RECOVERY=PR#${pr.number} REF=${pr.head.ref} REQUESTED_SHA=${sha}`);
              dispatched++;
            }

            core.info(`RECOVERY_SUMMARY dispatched=${dispatched} skipped=${skipped} open_prs=${pulls.length}`);
