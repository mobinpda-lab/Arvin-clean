name: Temporary Calendar 1032 Apply

on:
  push:
    branches:
      - fix/calendar-runtime-1032-deterministic

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned VazirHarf
        run: |
          set -euo pipefail
          git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Apply focused product changes
        run: |
          python3 .github/scripts/fix_calendar_1032_driver.py
          python3 .github/scripts/apply_calendar_1032.py
      - name: Format and validate focused runtime contract
        run: |
          dart format lib/calendar_page.dart lib/official_calendar_page.dart lib/widgets/canonical_calendar_launcher.dart lib/task_editor_dialog.dart lib/main.dart test/calendar_runtime_actions_fast_track_test.dart
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
          flutter test test/calendar_page_test.dart test/calendar_runtime_actions_fast_track_test.dart
      - name: Commit product fix and remove temporary driver
        run: |
          git config user.name "arvin-deterministic-worker[bot]"
          git config user.email "arvin-deterministic-worker[bot]@users.noreply.github.com"
          git restore analysis_options.yaml pubspec.lock || true
          rm -f .github/workflows/tmp-calendar-1032-apply.yml .github/scripts/apply_calendar_1032.py .github/scripts/fix_calendar_1032_driver.py
          git add -A
          git commit -m "fix(calendar): persist actionable runtime paths and date create (#1032)"
          git push origin HEAD:fix/calendar-runtime-1032-deterministic
