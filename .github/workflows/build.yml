name: Arvin Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same PR supersedes the old PR validation. Main pushes use
# the unique run id so every merged main commit keeps its own post-merge build.
concurrency:
  group: arvin-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle file not found')
          text = path.read_text()
          is_kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if is_kts else 'coreLibraryDesugaringEnabled true'
          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'")
          if flag not in text:
              match = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n        ' + flag + text[match.end():]
              else:
                  text += '\n\ncompileOptions {\n        ' + flag + '\n}\n'
          if 'desugar_jdk_libs:2.1.5' not in text:
              match = re.search(r'(?m)^\s*dependencies\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n    ' + dependency + text[match.end():]
              else:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'
          path.write_text(text)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Verify debug APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
