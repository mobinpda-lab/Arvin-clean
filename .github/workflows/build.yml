name: Arvin Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name arvin .
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path('android/app/build.gradle')
          kotlin = Path('android/app/build.gradle.kts')
          path = groovy if groovy.exists() else kotlin
          if not path.exists():
              raise SystemExit('Android app Gradle file not found')

          text = path.read_text()
          if path.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled = true' not in text:
                  start = text.index('compileOptions {')
                  end = text.index('}', start)
                  text = text[:end] + '\n        isCoreLibraryDesugaringEnabled = true' + text[end:]
              if 'desugar_jdk_libs:2.1.5' not in text:
                  pos = text.index('dependencies {') + len('dependencies {')
                  text = text[:pos] + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' + text[pos:]
          else:
              if 'coreLibraryDesugaringEnabled true' not in text:
                  start = text.index('compileOptions {')
                  end = text.index('}', start)
                  text = text[:end] + '\n        coreLibraryDesugaringEnabled true' + text[end:]
              if 'desugar_jdk_libs:2.1.5' not in text:
                  pos = text.index('dependencies {') + len('dependencies {')
                  text = text[:pos] + "\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'" + text[pos:]

          path.write_text(text)
          print(f'Configured {path}')
          PY
      - name: Ensure notification dependency
        run: flutter pub add flutter_local_notifications:^22.3.0
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

# Ensure generated Android projects retain the notification dependency and desugaring configuration.
