name: Arvin Build
run-name: Arvin Build (${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }})

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate (used by the recovery dispatcher)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arvin-build-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  quality:
    # Draft PRs are valid product work and must receive real quality/build evidence.
    # Test execution is sharded across independent runners to reduce wall-clock time
    # without reducing coverage: every test shard is required by the quality gate.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [analyze, test-0, test-1, test-2, test-3, test-4, test-5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned release inputs
        if: matrix.lane == 'analyze'
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/settings.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application.*9.1.0' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.0' android/settings.gradle.kts
          grep -q 'VERSION_17' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts
      - name: Android V2 audit
        if: matrix.lane == 'analyze'
        run: |
          set -euo pipefail
          test -f android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          grep -q FlutterActivity android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          ! grep -R -E 'io\.flutter\.app\.|PluginRegistry\.Registrar' android/app/src/main
      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: arvin-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            arvin-pub-${{ runner.os }}-
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze
        if: matrix.lane == 'analyze'
        run: flutter analyze
      - name: Test
        if: startsWith(matrix.lane, 'test-')
        env:
          SHARD_INDEX: ${{ fromJSON(matrix.lane == 'test-0' && '0' || matrix.lane == 'test-1' && '1' || matrix.lane == 'test-2' && '2' || matrix.lane == 'test-3' && '3' || matrix.lane == 'test-4' && '4' || '5') }}
        run: flutter test --total-shards 6 --shard-index $SHARD_INDEX

  # APK builds are independent of Analyze/Test and run in parallel with the quality matrix.
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug, staging]
    name: apk (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned release inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Create ephemeral staging signing key
        if: matrix.variant == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/arvin-staging-test.keystore"
          password="arvin-staging-test-only"
          keytool -genkeypair -noprompt -v \
            -keystore "$keystore" -storetype JKS \
            -storepass "$password" -keypass "$password" \
            -alias arvin-staging-test -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Arvin Staging Test,O=Arvin,C=XX"
          chmod 600 "$keystore"
          {
            echo "ARVIN_STAGING_KEYSTORE_PATH=$keystore"
            echo "ARVIN_STAGING_KEYSTORE_PASSWORD=$password"
            echo "ARVIN_STAGING_KEY_ALIAS=arvin-staging-test"
            echo "ARVIN_STAGING_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          echo "STAGING_SIGNING_KEY=EPHEMERAL_TEST_ONLY"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.variant }}" == "staging" ]]; then
            cd android
            ./gradlew --no-daemon :app:assembleStaging
          else
            flutter build apk --${{ matrix.variant }} -t lib/main.dart
          fi

      - name: Verify staging APK signature and merged manifest
        if: matrix.variant == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/staging/app-staging.apk"
          test -s "$apk"
          sdk_build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$sdk_build_tools/apksigner"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [[ ! -x "$apkanalyzer" ]]; then
            apkanalyzer="$(command -v apkanalyzer)"
          fi
          "$apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee "$RUNNER_TEMP/apksigner-staging.log"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner-staging.log"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apksigner-staging.log"
          debuggable="$("$apkanalyzer" manifest debuggable "$apk")"
          echo "APK_DEBUGGABLE=$debuggable"
          test "$debuggable" = "false"
          mkdir -p staging-verification
          cp "$RUNNER_TEMP/apksigner-staging.log" staging-verification/apksigner-verify.log
          printf 'APK_DEBUGGABLE=%s\n' "$debuggable" > staging-verification/manifest-audit.txt
          printf 'TARGET_SHA=%s\n' "$(git rev-parse HEAD)" >> staging-verification/manifest-audit.txt
          python3 - "$apk" "$RUNNER_TEMP/apksigner-staging.log" "$(git rev-parse HEAD)" "$debuggable" staging-verification/release-manifest.json <<'PY'
          import hashlib, json, pathlib, sys
          apk_path, log_path, target_sha, debuggable, manifest_path = sys.argv[1:]
          apk = pathlib.Path(apk_path)
          log = pathlib.Path(log_path).read_text(encoding="utf-8", errors="replace")
          schemes = {}
          for scheme in ("v1", "v2", "v3"):
              prefix = f"Verified using {scheme} scheme"
              matches = [line for line in log.splitlines() if line.startswith(prefix)]
              if not matches:
                  raise SystemExit(f"APK_SIGNATURE=FAIL missing {scheme} verification line")
              schemes[scheme] = matches[-1].rsplit(": ", 1)[-1].strip().lower() == "true"
          if not schemes["v2"] or not schemes["v3"]:
              raise SystemExit(f"APK_SIGNATURE=FAIL required v2/v3 schemes: {schemes}")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {
              "source_sha": target_sha,
              "variant": "staging",
              "apk_path": str(apk),
              "file_size_bytes": apk.stat().st_size,
              "sha256": digest,
              "signature_schemes": schemes,
              "android_debuggable": debuggable == "true",
              "signing_key_class": "EPHEMERAL_TEST_ONLY_NOT_PRODUCTION",
          }
          pathlib.Path(manifest_path).write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(
              f"RELEASE_MANIFEST=PASS source_sha={target_sha} "
              f"bytes={manifest['file_size_bytes']} sha256={digest} "
              f"v1={schemes['v1']} v2={schemes['v2']} v3={schemes['v3']} "
              f"debuggable={manifest['android_debuggable']}"
          )
          PY
      - name: Font packaging audit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.variant }}" == "staging" ]]; then
            apk="android/app/build/outputs/apk/staging/app-staging.apk"
          else
            apk="build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk"
          fi
          test -s "$apk"
          for font in \
            assets/fonts/ui/vazirmatn/Vazirmatn-Regular.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-Medium.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-Bold.ttf; do
            if ! unzip -Z1 "$apk" | grep -Fxq "assets/flutter_assets/$font"; then
              echo "FONT_ASSET_BUNDLED=FAIL missing=$font" >&2
              exit 1
            fi
            echo "FONT_ASSET_BUNDLED=PASS $font"
          done
          if grep -R -n -E "VazirHarf|vazirharf|font-option-system|System Default|fontFamily:[[:space:]]*['\"]system['\"]" lib pubspec.yaml; then
            echo "FONT_SOURCE_PURGE=FAIL legacy font or System Default reference remains" >&2
            exit 1
          fi
          echo "FONT_SOURCE_PURGE=PASS"
          echo "FONT_GATE=PASS_VAZIRMATN_BUNDLED_SYSTEM_DEFAULT_PURGED"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.variant }}" == "staging" ]]; then
            test -s "android/app/build/outputs/apk/staging/app-staging.apk"
          else
            test -s "build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: arvin-${{ matrix.variant }}-apk
          path: ${{ matrix.variant == 'staging' && 'android/app/build/outputs/apk/staging/app-staging.apk' || format('build/app/outputs/flutter-apk/app-{0}.apk', matrix.variant) }}
          if-no-files-found: error
      - name: Upload staging verification logs
        if: matrix.variant == 'staging'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-staging-verification
          path: staging-verification/
          if-no-files-found: error
