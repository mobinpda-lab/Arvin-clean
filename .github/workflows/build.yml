name: Arvin Build
run-name: Arvin Build (${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }})

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate (used by the recovery dispatcher)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arvin-build-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  preflight:
    name: Validate requested revision
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested SHA before checkout
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::target_sha must be a full 40-character hexadecimal commit SHA"
            exit 1
          fi
          echo "TARGET_SHA_FORMAT=PASS"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
      - name: Verify preflight checkout revision
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_CHECKOUT_SHA=$TARGET_SHA"
          echo "ACTUAL_CHECKOUT_SHA=$actual"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "::error::Preflight checkout does not match expected revision"
            exit 1
          fi
          if [[ "$IS_DISPATCH" == "true" ]]; then
            echo "EXACT_TARGET_SHA=$actual"
          else
            echo "CHECKOUT_SHA_MATCH=$actual"
            echo "EXACT_TARGET_SHA=NOT_APPLICABLE_NON_DISPATCH"
          fi

  quality:
    needs: preflight
    # Draft PRs are valid product work and must receive real quality/build evidence.
    # Test execution is sharded across independent runners to reduce wall-clock time
    # without reducing coverage: every test shard is required by the quality gate.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [analyze, test-0, test-1, test-2, test-3, test-4, test-5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Expected revision is not a full 40-character hexadecimal SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_CHECKOUT_SHA=$TARGET_SHA"
          echo "ACTUAL_CHECKOUT_SHA=$actual"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "::error::Checked-out revision does not match expected revision"
            exit 1
          fi
          if [[ "$IS_DISPATCH" == "true" ]]; then
            echo "EXACT_TARGET_SHA=$actual"
          else
            echo "CHECKOUT_SHA_MATCH=$actual"
            echo "EXACT_TARGET_SHA=NOT_APPLICABLE_NON_DISPATCH"
          fi
      - name: Cache pinned VazirHarf
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vazirharf
          key: arvin-vazirharf-${{ runner.os }}-3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
      - name: Fetch pinned VazirHarf on cache miss
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/vazirharf/.git" ]; then
            git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
            git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
            git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          fi
          test "$(git -C "$RUNNER_TEMP/vazirharf" rev-parse HEAD)" = "3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8"
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned release inputs
        if: matrix.lane == 'analyze'
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/settings.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application.*9.1.0' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.0' android/settings.gradle.kts
          grep -q 'VERSION_17' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && rm -rf assets/fonts/vazirharf && cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - name: Android V2 audit
        if: matrix.lane == 'analyze'
        run: |
          set -euo pipefail
          test -f android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          grep -q FlutterActivity android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          ! grep -R -E 'io\.flutter\.app\.|PluginRegistry\.Registrar' android/app/src/main
      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: arvin-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            arvin-pub-${{ runner.os }}-
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze
        if: matrix.lane == 'analyze'
        run: flutter analyze
      - name: Set up Ruby for workflow contract YAML parsing
        if: startsWith(matrix.lane, 'test-')
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Test
        if: startsWith(matrix.lane, 'test-')
        env:
          SHARD_INDEX: ${{ fromJSON(matrix.lane == 'test-0' && '0' || matrix.lane == 'test-1' && '1' || matrix.lane == 'test-2' && '2' || matrix.lane == 'test-3' && '3' || matrix.lane == 'test-4' && '4' || '5') }}
        run: flutter test --total-shards 6 --shard-index $SHARD_INDEX

  # APK builds are independent of Analyze/Test and run in parallel with the quality matrix.
  apk:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    name: apk (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Expected revision is not a full 40-character hexadecimal SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_CHECKOUT_SHA=$TARGET_SHA"
          echo "ACTUAL_CHECKOUT_SHA=$actual"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "::error::Checked-out revision does not match expected revision"
            exit 1
          fi
          if [[ "$IS_DISPATCH" == "true" ]]; then
            echo "EXACT_TARGET_SHA=$actual"
          else
            echo "CHECKOUT_SHA_MATCH=$actual"
            echo "EXACT_TARGET_SHA=NOT_APPLICABLE_NON_DISPATCH"
          fi

      - name: Cache pinned VazirHarf
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vazirharf
          key: arvin-vazirharf-${{ runner.os }}-3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
      - name: Fetch pinned VazirHarf on cache miss
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/vazirharf/.git" ]; then
            git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          fi
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned release inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && rm -rf assets/fonts/vazirharf && cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Build APK
        run: flutter build apk --${{ matrix.variant }} -t lib/main.dart
      - name: Verify APK
        run: test -s "build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: arvin-${{ matrix.variant }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk
          if-no-files-found: error
