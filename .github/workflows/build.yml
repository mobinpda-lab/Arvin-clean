name: Arvin Build

on:
  push:
    branches: [main, master, 'gate/**']
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvin-build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize VazirHarf submodule
        run: git submodule sync --recursive && git submodule update --init --recursive
      - name: Verify VazirHarf assets
        run: test -s assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf
      - name: Preserve VazirHarf assets
        run: cp -a assets/fonts/vazirharf "$RUNNER_TEMP/vazirharf"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = next((p for p in (Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')) if p.exists()), None)
          if path is None: raise SystemExit('Android app Gradle file not found')
          text = path.read_text(); kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
          if flag not in text:
              m = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              text = text[:m.end()] + '\n        ' + flag + text[m.end():] if m else text + '\n\ncompileOptions {\n        ' + flag + '\n}\n'
          if 'desugar_jdk_libs:2.1.5' not in text:
              m = re.search(r'(?m)^\s*dependencies\s*\{', text)
              text = text[:m.end()] + '\n    ' + dep + text[m.end():] if m else text + '\n\ndependencies {\n    ' + dep + '\n}\n'
          path.write_text(text)
          PY
      - name: Android V2 audit
        run: |
          test -f android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          grep -q FlutterActivity android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          ! grep -R -E 'io\.flutter\.app\.|PluginRegistry\.Registrar' android/app/src/main
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  apk:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    name: apk (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Initialize VazirHarf submodule
        run: git submodule sync --recursive && git submodule update --init --recursive
      - name: Verify VazirHarf assets
        run: test -s assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf
      - name: Preserve VazirHarf assets
        run: cp -a assets/fonts/vazirharf "$RUNNER_TEMP/vazirharf"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && cp -a "$RUNNER_TEMP/vazirharf" assets/fonts/vazirharf
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = next((p for p in (Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')) if p.exists()), None)
          if path is None: raise SystemExit('Android app Gradle file not found')
          text = path.read_text(); kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
          if flag not in text:
              m = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              text = text[:m.end()] + '\n        ' + flag + text[m.end():] if m else text + '\n\ncompileOptions {\n        ' + flag + '\n}\n'
          if 'desugar_jdk_libs:2.1.5' not in text:
              m = re.search(r'(?m)^\s*dependencies\s*\{', text)
              text = text[:m.end()] + '\n    ' + dep + text[m.end():] if m else text + '\n\ndependencies {\n    ' + dep + '\n}\n'
          path.write_text(text)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --${{ matrix.variant }} -t lib/main.dart
      - name: Verify APK
        run: test -s "build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-${{ matrix.variant }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk
