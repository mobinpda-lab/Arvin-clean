name: Arvin Build
run-name: Arvin Build (${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }})

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate (used by the recovery dispatcher)'
        required: false
        type: string
      official_release:
        description: 'Build and verify an owner-authorized production-signed APK (main branch only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arvin-build-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  quality:
    # Draft PRs are valid product work and must receive real quality/build evidence.
    # Test execution is sharded across independent runners to reduce wall-clock time
    # without reducing coverage: every test shard is required by the quality gate.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [analyze, test-0, test-1, test-2, test-3, test-4, test-5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.sha }}
      - name: Verify exact requested revision
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"
      - name: Cache pinned VazirHarf
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vazirharf
          key: arvin-vazirharf-${{ runner.os }}-3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
      - name: Fetch pinned VazirHarf on cache miss
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/vazirharf/.git" ]; then
            git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
            git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
            git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          fi
          test "$(git -C "$RUNNER_TEMP/vazirharf" rev-parse HEAD)" = "3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8"
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned release inputs
        if: matrix.lane == 'analyze'
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/settings.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application.*9.1.0' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.0' android/settings.gradle.kts
          grep -q 'VERSION_17' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && rm -rf assets/fonts/vazirharf && cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - name: Android V2 audit
        if: matrix.lane == 'analyze'
        run: |
          set -euo pipefail
          test -f android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          grep -q FlutterActivity android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          ! grep -R -E 'io\.flutter\.app\.|PluginRegistry\.Registrar' android/app/src/main
      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: arvin-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            arvin-pub-${{ runner.os }}-
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze
        if: matrix.lane == 'analyze'
        run: flutter analyze
      - name: Test
        if: startsWith(matrix.lane, 'test-')
        env:
          SHARD_INDEX: ${{ fromJSON(matrix.lane == 'test-0' && '0' || matrix.lane == 'test-1' && '1' || matrix.lane == 'test-2' && '2' || matrix.lane == 'test-3' && '3' || matrix.lane == 'test-4' && '4' || '5') }}
        run: flutter test --total-shards 6 --shard-index $SHARD_INDEX

  # APK builds are independent of Analyze/Test and run in parallel with the quality matrix.
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    name: apk (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.sha }}
      - name: Verify exact requested revision
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"

      - name: Cache pinned VazirHarf
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vazirharf
          key: arvin-vazirharf-${{ runner.os }}-3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
      - name: Fetch pinned VazirHarf on cache miss
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/vazirharf/.git" ]; then
            git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          fi
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
          mkdir -p assets/fonts
          cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify repository-owned release inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
      - name: Restore VazirHarf assets
        run: mkdir -p assets/fonts && rm -rf assets/fonts/vazirharf && cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Build APK (${{ matrix.variant }}; non-official CI artifact)
        run: flutter build apk --${{ matrix.variant }} -t lib/main.dart
      - name: Verify APK exists (not a production-signing assertion)
        run: test -s "build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk"
      - name: Upload non-official CI APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.variant == 'release' && 'arvin-release-dev-debug-signed-apk' || 'arvin-debug-apk' }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk
          if-no-files-found: error

  # Production signing is deliberately isolated from pull_request and push jobs.
  # The guard permits only the exact tip selected on trusted main; PR-controlled code
  # cannot be checked out in a secret-bearing job.
  official-release-guard:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.official_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted main ref and exact current SHA
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Official signing is permitted only from refs/heads/main."
            exit 1
          fi
          test -n "$TARGET_SHA"
          test "$TARGET_SHA" = "$GITHUB_SHA"
          echo "EXACT_TARGET_SHA=$GITHUB_SHA"
          echo "OFFICIAL_RELEASE_GUARD=PASS"

  official-release:
    name: Official production-signed APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.official_release && needs.official-release-guard.result == 'success' }}
    needs: [official-release-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          test "$actual" = "$GITHUB_SHA"
          echo "EXACT_TARGET_SHA=$actual"
          echo "ARVIN_REQUESTED_TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$actual"
          echo "WORKFLOW_EVENT=$GITHUB_EVENT_NAME"
          echo "SOURCE_BRANCH=$GITHUB_REF_NAME"
          echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
          echo "WORKFLOW_JOB_ID=$GITHUB_JOB"

      - name: Cache pinned VazirHarf
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vazirharf
          key: arvin-vazirharf-${{ runner.os }}-3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
      - name: Fetch pinned VazirHarf on cache miss
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/vazirharf/.git" ]; then
            git clone --no-tags --depth 1 https://github.com/nadalaba/vazirharf.git "$RUNNER_TEMP/vazirharf"
          fi
          git -C "$RUNNER_TEMP/vazirharf" fetch --depth 1 origin 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          git -C "$RUNNER_TEMP/vazirharf" checkout --detach 3cbc943b9fb9107baa77008b3e96b3c3e40e9ed8
          test -s "$RUNNER_TEMP/vazirharf/fonts/ttf/Vazirharf-Regular.ttf"
          mkdir -p assets/fonts/vazirharf
          cp -a "$RUNNER_TEMP/vazirharf/." assets/fonts/vazirharf/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          test -s assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf

      - name: Decode authorized keystore and validate secret presence
        env:
          ARVIN_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARVIN_RELEASE_KEYSTORE_BASE64 }}
          ARVIN_RELEASE_STORE_PASSWORD: ${{ secrets.ARVIN_RELEASE_STORE_PASSWORD }}
          ARVIN_RELEASE_KEY_ALIAS: ${{ secrets.ARVIN_RELEASE_KEY_ALIAS }}
          ARVIN_RELEASE_KEY_PASSWORD: ${{ secrets.ARVIN_RELEASE_KEY_PASSWORD }}
          ARVIN_RELEASE_CERT_SHA256: ${{ secrets.ARVIN_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ARVIN_RELEASE_KEYSTORE_BASE64 ARVIN_RELEASE_STORE_PASSWORD ARVIN_RELEASE_KEY_ALIAS ARVIN_RELEASE_KEY_PASSWORD ARVIN_RELEASE_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Required repository secret is missing: $name"
              exit 1
            fi
          done
          key_file="$RUNNER_TEMP/arvin-release-keystore.jks"
          umask 077
          printf '%s' "$ARVIN_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          test -s "$key_file"
          echo "KEYSTORE_DECODE=PASS (contents withheld)"
          echo "KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Build production Release APK
        env:
          ARVIN_OFFICIAL_RELEASE: 'true'
          ARVIN_RELEASE_STORE_FILE: ${{ runner.temp }}/arvin-release-keystore.jks
          ARVIN_RELEASE_STORE_PASSWORD: ${{ secrets.ARVIN_RELEASE_STORE_PASSWORD }}
          ARVIN_RELEASE_KEY_ALIAS: ${{ secrets.ARVIN_RELEASE_KEY_ALIAS }}
          ARVIN_RELEASE_KEY_PASSWORD: ${{ secrets.ARVIN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release -t lib/main.dart
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK signature schemes, owner fingerprint and APK checksum
        env:
          ARVIN_RELEASE_CERT_SHA256: ${{ secrets.ARVIN_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          verify_log="$RUNNER_TEMP/apksigner-verify.txt"
          "$apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee "$verify_log"
          grep -Eiq '^Verified using v2 scheme .*: true "$verify_log"
          grep -Eiq '^Verified using v3 scheme .*: true "$verify_log"
          actual_fp="$(sed -nE 's/.*Signer #1 certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$verify_log" | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_fp="$(printf '%s' "$ARVIN_RELEASE_CERT_SHA256" | tr -d ' :\t\r\n' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual_fp" =~ ^[0-9A-F]{64}$ ]]
          [[ "$expected_fp" =~ ^[0-9A-F]{64}$ ]]
          test "$actual_fp" = "$expected_fp"
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          {
            echo "repository=mobinpda-lab/Arvin-clean"
            echo "workflow_name=$GITHUB_WORKFLOW"
            echo "branch=$GITHUB_REF_NAME"
            echo "requested_target_sha=$ARVIN_REQUESTED_TARGET_SHA"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_pr_head_sha=not_applicable_workflow_dispatch_on_main"
            echo "source_pr_base_sha=not_applicable_workflow_dispatch_on_main"
            echo "workflow_event=$GITHUB_EVENT_NAME"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_job_id=$GITHUB_JOB"
            echo "apk_filename=$(basename "$apk")"
            echo "apk_sha256=$apk_sha"
            echo "certificate_sha256=$actual_fp"
            echo "v2_signature=PASS"
            echo "v3_signature=PASS"
            echo "expected_certificate_match=PASS"
            echo "apksigner_verification=PASS"
            echo "official_release_status=VERIFIED_ARTIFACT_ONLY_NOT_RELEASE_APPROVAL"
          } | tee release-evidence.txt
          {
            echo "### Official APK verification evidence"
            echo "- Source SHA: `$(git rev-parse HEAD)`"
            echo "- Run / Job: `$GITHUB_RUN_ID` / `$GITHUB_JOB`"
            echo "- APK: `$(basename "$apk")`"
            echo "- APK SHA-256: `$apk_sha`"
            echo "- Certificate SHA-256: `$actual_fp` (matched owner-provided expected fingerprint)"
            echo "- APK Signature Scheme v2: PASS"
            echo "- APK Signature Scheme v3: PASS"
            echo "- Official artifact verification: PASS; this is not release approval."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified official APK and provenance
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: arvin-official-release-${{ inputs.target_sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            release-evidence.txt
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact identity in job summary
        if: ${{ always() }}
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          {
            echo "- GitHub Artifact ID: ${ARTIFACT_ID:-not-created}"
            echo "- Artifact archive digest: not computed inside this job; if recorded from GitHub artifact metadata, keep it distinct from the APK SHA-256 above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary production signing material
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/arvin-release-keystore.jks"
          test ! -e "$RUNNER_TEMP/arvin-release-keystore.jks"
