name: Arvin Build
run-name: Arvin Build (${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }})

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to validate (used by the recovery dispatcher)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arvin-build-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  quality:
    # Draft PRs are valid product work and must receive real quality/build evidence.
    # Test execution is sharded across independent runners to reduce wall-clock time
    # without reducing coverage: every test shard is required by the quality gate.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [analyze, test-0, test-1, test-2, test-3, test-4, test-5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Install Linux SQLite development library
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-dev
      - name: Verify repository-owned release inputs
        if: matrix.lane == 'analyze'
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/settings.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
          grep -q 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application.*9.1.0' android/settings.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.4.0' android/settings.gradle.kts
          grep -q 'VERSION_17' android/app/build.gradle.kts
          grep -q 'desugar_jdk_libs:2.1.5' android/app/build.gradle.kts
      - name: Android V2 audit
        if: matrix.lane == 'analyze'
        run: |
          set -euo pipefail
          test -f android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          grep -q FlutterActivity android/app/src/main/kotlin/com/example/arvin/MainActivity.kt
          ! grep -R -E 'io\.flutter\.app\.|PluginRegistry\.Registrar' android/app/src/main
      - name: Cache Pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: arvin-pub-v2-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: |
            arvin-pub-v2-${{ runner.os }}-
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze
        if: matrix.lane == 'analyze'
        run: flutter analyze
      - name: Test
        if: startsWith(matrix.lane, 'test-')
        env:
          SHARD_INDEX: ${{ fromJSON(matrix.lane == 'test-0' && '0' || matrix.lane == 'test-1' && '1' || matrix.lane == 'test-2' && '2' || matrix.lane == 'test-3' && '3' || matrix.lane == 'test-4' && '4' || '5') }}
        run: flutter test --total-shards 6 --shard-index $SHARD_INDEX

  # Keep visual golden coverage independent from the seven-lane Analyze/Test contract.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Install Linux SQLite development library
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-dev
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Task Details structural layout smoke
        run: flutter test test/task_detail_visual_test.dart
      - name: Generate Persian PDF acceptance sample and verify embedded fonts
        run: flutter test test/report_typography_canonical_test.dart --reporter expanded
      - name: Render PDF and inspect embedded font resources
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          evidence="build/arvin-command-07-a2/pdf"
          pdf="$evidence/vazirmatn-persian-acceptance.pdf"
          test -s "$pdf"
          pdffonts "$pdf" | tee "$evidence/pdffonts.txt"
          # pdffonts columns are name, type, encoding, emb, sub, uni, object.
          # Whitespace tokenization therefore places emb at $5 and uni at $7.
          awk 'NR > 2 && /Vazirmatn/ { count++; if ($5 != "yes" || $7 != "yes") bad=1 } END { if (count < 2 || bad) exit 1 }' "$evidence/pdffonts.txt"
          pdftotext -layout "$pdf" "$evidence/extracted-text.txt"
          # Preserve Poppler's raw glyph mapping and also normalize Arabic presentation
          # forms to canonical Unicode before checking semantic text content.
          python3 - <<'PY'
          import pathlib
          import unicodedata
          source = pathlib.Path("build/arvin-command-07-a2/pdf/extracted-text.txt")
          target = pathlib.Path("build/arvin-command-07-a2/pdf/extracted-text-normalized.txt")
          target.write_text(unicodedata.normalize("NFKC", source.read_text(encoding="utf-8")), encoding="utf-8")
          PY
          grep -Fq 'می‌خواهم' "$evidence/extracted-text-normalized.txt"
          grep -Fq '۱۴۰۵/۰۸/۲۱' "$evidence/extracted-text-normalized.txt"
          # Poppler emits the LTR date in visual order inside the RTL paragraph.
          grep -Fq '12-11-2026' "$evidence/extracted-text-normalized.txt"
          grep -Fq 'Example Ltd' "$evidence/extracted-text-normalized.txt"
          pdftoppm -png -r 144 -f 1 -singlefile "$pdf" "$evidence/vazirmatn-persian-preview"
          sha256sum "$pdf" | tee "$evidence/pdf.sha256"
          echo "PDF_FONT_EMBEDDING=PASS"
          echo "PDF_UNICODE_EXTRACTION=PASS"
          echo "PDF_RENDER=PASS"
      - name: Upload PDF acceptance evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: arvin-vazirmatn-persian-pdf-${{ github.run_id }}
          path: build/arvin-command-07-a2/pdf/
          if-no-files-found: warn
      - name: Upload Task Details visual evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: arvin-task-detail-visual-${{ github.run_id }}
          path: |
            test/failures/task_detail_visual_actual.png
            test/failures/**/*.png
          if-no-files-found: warn

  # APK builds are independent of Analyze/Test and run in parallel with the quality matrix.
  apk:
    # Product owner explicitly authorized candidate-only APK assembly on this draft PR branch.
    # Artifacts are validation evidence only; this workflow never publishes or releases them.
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug, staging]
    name: apk (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact requested revision
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "EXACT_TARGET_SHA=$actual"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Install Linux SQLite development library
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-dev
      - name: Verify repository-owned release inputs
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradlew
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Create ephemeral staging signing key
        if: matrix.variant == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/arvin-staging-test.keystore"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -v \
            -keystore "$keystore" -storetype JKS \
            -storepass "$password" -keypass "$password" \
            -alias arvin-staging-test -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Arvin Staging Test,O=Arvin,C=XX"
          chmod 600 "$keystore"
          {
            echo "ARVIN_STAGING_KEYSTORE_PATH=$keystore"
            echo "ARVIN_STAGING_KEYSTORE_PASSWORD=$password"
            echo "ARVIN_STAGING_KEY_ALIAS=arvin-staging-test"
            echo "ARVIN_STAGING_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          unset password
          echo "STAGING_SIGNING_KEY=EPHEMERAL_TEST_ONLY"

      - name: Build APK
        id: build-apk
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.variant }}" == "staging" ]]; then
            cd android
            bash ./gradlew --no-daemon :app:assembleStaging
          else
            flutter build apk --${{ matrix.variant }} -t lib/main.dart
          fi

      - name: Verify staging APK signature and merged manifest
        if: matrix.variant == 'staging'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p staging-verification
          apk="build/app/outputs/apk/staging/app-staging.apk"
          signer_log="staging-verification/apksigner-verify.log"
          : > "$signer_log"

          apk_status=NOT_VERIFIED
          apksigner_exit=NOT_RUN
          v1_status=NOT_VERIFIED
          v2_status=NOT_VERIFIED
          v3_status=NOT_VERIFIED
          signer_sha256=NOT_AVAILABLE
          debuggable_status=NOT_VERIFIED
          debuggable_value=NOT_VERIFIED
          apkanalyzer_exit=NOT_RUN

          if [[ -s "$apk" ]]; then
            apk_status=PASS
            sdk_build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            apksigner="$sdk_build_tools/apksigner"
            apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
            if [[ ! -x "$apkanalyzer" ]]; then
              apkanalyzer="$(command -v apkanalyzer || find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -n 1)"
            fi

            if [[ -x "$apksigner" ]]; then
              set +e
              "$apksigner" verify --verbose --print-certs "$apk" > "$signer_log" 2>&1
              apksigner_exit=$?
              set -e
              cat "$signer_log"
              for scheme in v1 v2 v3; do
                line="$(grep -F "Verified using $scheme scheme" "$signer_log" | tail -n 1 || true)"
                if [[ -z "$line" ]]; then
                  status=NOT_VERIFIED
                elif [[ "$line" == *": true" ]]; then
                  status=PASS
                else
                  status=FAIL
                fi
                case "$scheme" in
                  v1) v1_status="$status" ;;
                  v2) v2_status="$status" ;;
                  v3) v3_status="$status" ;;
                esac
              done
              digest_line="$(grep -F 'Signer #1 certificate SHA-256 digest:' "$signer_log" | tail -n 1 || true)"
              if [[ -n "$digest_line" ]]; then
                signer_sha256="${digest_line##*: }"
              fi
            else
              echo "APKSIGNER=NOT_FOUND" | tee -a "$signer_log"
            fi

            if [[ -x "$apkanalyzer" ]]; then
              set +e
              debuggable_value="$("$apkanalyzer" manifest debuggable "$apk" 2>&1)"
              apkanalyzer_exit=$?
              set -e
              if [[ "$apkanalyzer_exit" == "0" && "$debuggable_value" == "false" ]]; then
                debuggable_status=PASS
              elif [[ "$apkanalyzer_exit" == "0" ]]; then
                debuggable_status=FAIL
              fi
            else
              echo "APK_ANALYZER=NOT_FOUND" | tee -a staging-verification/manifest-audit.txt
            fi
          else
            echo "APK_FILE=NOT_FOUND path=$apk" | tee -a "$signer_log"
          fi

          apk_bytes=0
          apk_sha256=NOT_AVAILABLE
          if [[ -s "$apk" ]]; then
            apk_bytes="$(stat -c '%s' "$apk")"
            apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          fi

          manifest_status=PASS
          [[ "$apk_status" == PASS ]] || manifest_status=FAIL
          [[ "$apksigner_exit" == 0 ]] || manifest_status=FAIL
          [[ "$v2_status" == PASS ]] || manifest_status=FAIL
          [[ "$v3_status" == PASS ]] || manifest_status=FAIL
          [[ "$debuggable_status" == PASS ]] || manifest_status=FAIL

          export APK_STATUS="$apk_status"
          export APKSIGNER_EXIT="$apksigner_exit"
          export V1_STATUS="$v1_status"
          export V2_STATUS="$v2_status"
          export V3_STATUS="$v3_status"
          export SIGNER_SHA256="$signer_sha256"
          export DEBUGGABLE_STATUS="$debuggable_status"
          export DEBUGGABLE_VALUE="$debuggable_value"
          export APKANALYZER_EXIT="$apkanalyzer_exit"
          export APK_BYTES="$apk_bytes"
          export APK_SHA256="$apk_sha256"
          export TARGET_SHA="$(git rev-parse HEAD)"
          export MANIFEST_STATUS="$manifest_status"
          python3 - <<'PY'
          import json, os, pathlib
          manifest = {
              "source_sha": os.environ["TARGET_SHA"],
              "variant": "staging",
              "apk_path": "build/app/outputs/apk/staging/app-staging.apk",
              "apk_status": os.environ["APK_STATUS"],
              "file_size_bytes": int(os.environ["APK_BYTES"]),
              "sha256": os.environ["APK_SHA256"],
              "apksigner_exit_code": os.environ["APKSIGNER_EXIT"],
              "signature_schemes": {
                  "v1": os.environ["V1_STATUS"],
                  "v2": os.environ["V2_STATUS"],
                  "v3": os.environ["V3_STATUS"],
              },
              "signer_certificate_sha256": os.environ["SIGNER_SHA256"],
              "apkanalyzer_exit_code": os.environ["APKANALYZER_EXIT"],
              "android_debuggable_value": os.environ["DEBUGGABLE_VALUE"],
              "android_debuggable_check": os.environ["DEBUGGABLE_STATUS"],
              "release_manifest_validation": os.environ["MANIFEST_STATUS"],
              "signing_key_class": "EPHEMERAL_TEST_ONLY_NOT_PRODUCTION",
              "publishable": False,
          }
          pathlib.Path("staging-verification/release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          pathlib.Path("staging-verification/manifest-audit.txt").write_text(
              "\n".join(f"{key}={value}" for key, value in manifest.items()) + "\n",
              encoding="utf-8",
          )
          PY

          echo "APK_STATUS=$apk_status"
          echo "APKSIGNER_EXIT_CODE=$apksigner_exit"
          echo "APK_SIGNATURE_V1=$v1_status"
          echo "APK_SIGNATURE_V2=$v2_status"
          echo "APK_SIGNATURE_V3=$v3_status"
          echo "SIGNER_CERTIFICATE_SHA256=$signer_sha256"
          echo "APK_DEBUGGABLE_CHECK=$debuggable_status value=$debuggable_value exit=$apkanalyzer_exit"
          echo "RELEASE_MANIFEST_VALIDATION=$manifest_status"
          echo "APK_SHA256=$apk_sha256 APK_BYTES=$apk_bytes"
          if [[ "$manifest_status" != PASS ]]; then
            exit 1
          fi

      - name: Font packaging audit
        if: always() && steps.build-apk.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.variant }}" == "staging" ]]; then
            apk="build/app/outputs/apk/staging/app-staging.apk"
          else
            apk="build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk"
          fi
          test -s "$apk"
          declare -A expected_blob=(
            ["assets/fonts/ui/vazirmatn/Vazirmatn-Light.ttf"]="2dfd5c35ed4c26f7ce9f3ba753f11d9a38356c42"
            ["assets/fonts/ui/vazirmatn/Vazirmatn-Regular.ttf"]="64e4a8189557a17b63fd7a77794207483e592972"
            ["assets/fonts/ui/vazirmatn/Vazirmatn-Medium.ttf"]="1e08dd54d90a4879451ef0f80fe0d8068fb7462f"
            ["assets/fonts/ui/vazirmatn/Vazirmatn-SemiBold.ttf"]="6b3842aca6055c8258404b1758133b81c961a13f"
            ["assets/fonts/ui/vazirmatn/Vazirmatn-Bold.ttf"]="efa9b095da01d299310bdcae293e24e657fe6da9"
          )
          echo "FONT_UPSTREAM_COMMIT=6e553e33489a8f9dfaccc76860a2e3f3c1e66de7"
          for font in \
            assets/fonts/ui/vazirmatn/Vazirmatn-Light.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-Regular.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-Medium.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-SemiBold.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-Bold.ttf; do
            if ! unzip -Z1 "$apk" | grep -Fxq "assets/flutter_assets/$font"; then
              echo "FONT_ASSET_BUNDLED=FAIL missing=$font" >&2
              exit 1
            fi
            actual_blob="$(git hash-object "$font")"
            if [[ "$actual_blob" != "${expected_blob[$font]}" ]]; then
              echo "FONT_PROVENANCE=FAIL file=$font expected=${expected_blob[$font]} actual=$actual_blob" >&2
              exit 1
            fi
            font_sha256="$(sha256sum "$font" | awk '{print $1}')"
            embedded_sha256="$(unzip -p "$apk" "assets/flutter_assets/$font" | sha256sum | awk '{print $1}')"
            if [[ "$embedded_sha256" != "$font_sha256" ]]; then
              echo "APK_FONT_CONTENT=FAIL file=$font source_sha256=$font_sha256 embedded_sha256=$embedded_sha256" >&2
              exit 1
            fi
            font_bytes="$(stat -c '%s' "$font")"
            echo "FONT_ASSET_BUNDLED=PASS $font"
            echo "FONT_PROVENANCE=PASS file=$font git_blob=$actual_blob bytes=$font_bytes sha256=$font_sha256"
            echo "APK_FONT_CONTENT=PASS file=$font embedded_sha256=$embedded_sha256"
          done
          if grep -R -n -E "VazirHarf|vazirharf" lib pubspec.yaml; then
            echo "FONT_LEGACY_PURGE=FAIL retired VazirHarf runtime reference remains" >&2
            exit 1
          fi
          echo "FONT_LEGACY_PURGE=PASS"
          for font in \
            assets/fonts/ui/vazirmatn/Vazirmatn-Light.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-Regular.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-Medium.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-SemiBold.ttf \
            assets/fonts/ui/vazirmatn/Vazirmatn-Bold.ttf; do
            test -s "$font"
          done
          test -s assets/fonts/ui/vazirmatn/LICENSE.txt
          grep -Fq 'SIL OPEN FONT LICENSE Version 1.1' assets/fonts/ui/vazirmatn/LICENSE.txt
          grep -Fq 'family: Vazirmatn' pubspec.yaml
          grep -Fq "static const String vazirmatnFamily = 'Vazirmatn';" lib/theme/app_fonts.dart
          grep -Fq 'static const String fontFamily = AppFonts.vazirmatnFamily;' lib/core/theme/arvin_theme.dart
          grep -Fq 'fontFamily: AppFonts.vazirmatnFamily,' lib/theme/font_registry.dart
          echo "FONT_LICENSE=PASS_OFL_1_1"
          echo "FONT_FAMILY=PASS_VAZIRMATN"
          echo "FONT_GATE=PASS_VAZIRMATN_5_WEIGHTS_BUNDLED"

      - name: Verify APK
        if: always() && steps.build-apk.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.variant }}" == "staging" ]]; then
            test -s "build/app/outputs/apk/staging/app-staging.apk"
          else
            test -s "build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk"
          fi
      - name: Upload APK
        if: success() && steps.build-apk.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-${{ matrix.variant }}-apk
          path: ${{ matrix.variant == 'staging' && 'build/app/outputs/apk/staging/app-staging.apk' || format('build/app/outputs/flutter-apk/app-{0}.apk', matrix.variant) }}
          if-no-files-found: error
      - name: Upload Staging APK audit candidate
        if: always() && matrix.variant == 'staging'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-staging-apk-audit-candidate
          path: build/app/outputs/apk/staging/app-staging.apk
          if-no-files-found: ignore

      - name: Upload staging verification logs
        if: always() && matrix.variant == 'staging'
        uses: actions/upload-artifact@v5
        with:
          name: arvin-staging-verification
          path: staging-verification/
          if-no-files-found: warn
