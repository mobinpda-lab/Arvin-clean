name: Arvin Build

on:
  push:
    branches: [main, master, 'gate/**']
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Fast Lane: Draft PRs receive fast validation from Arvin Parallel Wave.
# The full APK gate runs only for ready/non-draft PR heads, main pushes,
# explicit gate/** exact-SHA validation refs, or manual dispatch.
# Analyze/tests run once. Release and debug APKs then build in parallel on the
# same exact SHA to reduce wall-clock merge time without weakening evidence.
concurrency:
  group: arvin-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle file not found')
          text = path.read_text()
          is_kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if is_kts else 'coreLibraryDesugaringEnabled true'
          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'")
          if flag not in text:
              match = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n        ' + flag + text[match.end():]
              else:
                  text += '\n\ncompileOptions {\n        ' + flag + '\n}\n'
          if 'desugar_jdk_libs:2.1.5' not in text:
              match = re.search(r'(?m)^\s*dependencies\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n    ' + dependency + text[match.end():]
              else:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'
          path.write_text(text)
          PY
      - name: Android V2 audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app/src/main')
          activities = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if not activities:
              raise SystemExit('MainActivity.kt/java not found after Android generation')
          text = activities[0].read_text(encoding='utf-8')
          if 'FlutterActivity' not in text:
              raise SystemExit('MainActivity does not use FlutterActivity')
          forbidden = ('io.flutter.app.', 'PluginRegistry.Registrar')
          for candidate in root.rglob('*'):
              if candidate.is_file():
                  content = candidate.read_text(encoding='utf-8', errors='ignore')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(f'deleted Android v1 embedding reference: {token} in {candidate}')
          print(f'Android V2 audit passed: {activities[0]}')
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  apk:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    name: apk (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --no-pub --platforms=android --project-name arvin .
      - name: Configure Android desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle file not found')
          text = path.read_text()
          is_kts = path.suffix == '.kts'
          flag = 'isCoreLibraryDesugaringEnabled = true' if is_kts else 'coreLibraryDesugaringEnabled true'
          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'")
          if flag not in text:
              match = re.search(r'(?m)^\s*compileOptions\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n        ' + flag + text[match.end():]
              else:
                  text += '\n\ncompileOptions {\n        ' + flag + '\n}\n'
          if 'desugar_jdk_libs:2.1.5' not in text:
              match = re.search(r'(?m)^\s*dependencies\s*\{', text)
              if match:
                  text = text[:match.end()] + '\n    ' + dependency + text[match.end():]
              else:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'
          path.write_text(text)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --${{ matrix.variant }} -t lib/main.dart
      - name: Verify APK
        run: test -s "build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvin-${{ matrix.variant }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk
