name: One-off Canonical Backup Home Wiring

on:
  push:
    branches: [fix/issue-221-canonical-backup]

permissions:
  contents: write

jobs:
  wire-home:
    if: ${{ !contains(github.event.head_commit.message, '[backup-home-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-221-canonical-backup
          fetch-depth: 0
      - name: Wire canonical backup and restore into Home
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import 'services/task_migration_writer.dart';\n"
          task_store_import = "import 'services/task_store.dart';\n"
          if task_store_import not in text:
              if import_anchor not in text:
                  raise SystemExit('task migration writer import anchor not found')
              text = text.replace(import_anchor, import_anchor + task_store_import, 1)

          field_anchor = "  final TaskMigrationWriter migrationWriter = TaskMigrationWriter();\n"
          task_store_field = "  final TaskStore taskStore = TaskStore();\n"
          if task_store_field not in text:
              if field_anchor not in text:
                  raise SystemExit('migration writer field anchor not found')
              text = text.replace(field_anchor, field_anchor + task_store_field, 1)

          legacy_backup = """      final fileName = await backupManager.backupTasks(\n        tasks.map((task) => task.toJson()).toList(),\n      );"""
          canonical_backup = """      final fileName = await backupManager.backupCanonicalTasks(_searchSource);"""
          if legacy_backup in text:
              text = text.replace(legacy_backup, canonical_backup, 1)
          elif canonical_backup not in text:
              raise SystemExit('Home backup call anchor not found')

          start_token = "  Future<void> _restoreFromFile() async {"
          end_token = "  Future<void> _backupMenu() async {"
          start = text.find(start_token)
          end = text.find(end_token, start)
          if start < 0 or end < 0:
              raise SystemExit('restore method boundaries not found')

          canonical_restore = '''  Future<void> _restoreFromFile() async {
    try {
      final list = await backupManager.restoreCanonicalTasks();
      if (list == null) return;

      final emergencyBackup =
          await backupManager.backupCanonicalTasks(_searchSource);

      if (!mounted) return;
      final approved = await showDialog<bool>(
        context: context,
        builder: (dialogContext) => AlertDialog(
          title: const Text('بازیابی اطلاعات'),
          content: Text(
            'تعداد ${list.length} کار از پشتیبان آماده بازیابی است.\\n\\n'
            '${emergencyBackup == null ? '' : 'قبل از بازیابی، یک پشتیبان اضطراری کامل نیز ساخته شد.'}',
          ),
          actions: [
            TextButton(
              onPressed: () => Navigator.pop(dialogContext, false),
              child: const Text('لغو'),
            ),
            FilledButton(
              onPressed: () => Navigator.pop(dialogContext, true),
              child: const Text('بازیابی'),
            ),
          ],
        ),
      );
      if (approved != true) return;

      await taskStore.save(List<Task>.of(list));
      await _load();
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(content: Text('${list.length} کار با همه جزئیات بازیابی شد')),
        );
      }
    } catch (error) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(content: Text('بازیابی ناموفق بود: $error')),
        );
      }
    }
  }

'''
          text = text[:start] + canonical_restore + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit canonical Home wiring and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm .github/workflows/one-off-canonical-backup-home.yml
          git commit -m "fix(backup): wire Home to canonical portability [backup-home-wired]"
          git push origin HEAD:fix/issue-221-canonical-backup
