name: Arvin Parallel Calendar

on:
  push:
    branches: ['feat/**', 'fix/**', main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Calendar surface
        run: flutter analyze lib/calendar_page.dart
      - name: Test Calendar surface
        run: flutter test test/calendar_page_test.dart
