name: Joplin Persian Shamsi Plugin

on:
  push:
    paths:
      - 'research/joplin-persian-shamsi-isolated/plugin/**'
  pull_request:
    paths:
      - 'research/joplin-persian-shamsi-isolated/plugin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/joplin-persian-shamsi-isolated/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: research/joplin-persian-shamsi-isolated/plugin/package-lock.json
      - run: npm ci
      - run: npm run dist
      - name: Verify JPL archive
        run: |
          test -n "$(find publish -maxdepth 1 -name '*.jpl' -print -quit)"
          unzip -l publish/*.jpl | grep -E 'manifest.json|fonts/Vazirharf\[wght\]\.ttf'
